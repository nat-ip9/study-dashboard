VIEWS.schedule = function(){
  const d = state.schedDay || 1;
  const periods = (state.schedule[d] || ['','','','','']);
  const PERIOD_NAMES = ['Period 1','Period 2','Period 3','Period 4','Period 5'];
  const TIMES = ['08:15','09:15','10:25','11:25','13:30'];
  const edit = state.editingSchedule;

  const tabs = [...Array(10).keys()].map(i => {
    const n = i + 1;
    return `<button class="day-tab ${n===d?'active':''}" data-act="sched-day" data-day="${n}">Day ${n}</button>`;
  }).join('');

  const todayCards = periods.map((p, i) => {
    if (edit){
      return `<div class="period">
        <div class="pn">${PERIOD_NAMES[i]} · ${TIMES[i]}</div>
        <input data-act="sched-edit" data-day="${d}" data-period="${i}" value="${esc(p)}" placeholder="e.g. Chinese (B310)">
      </div>`;
    }
    const m = String(p||'').match(/^(.+?)\s*\((.+)\)$/);
    const name = m ? m[1] : p;
    const room = m ? m[2] : '';
    return `<div class="period">
      <div class="pn">${PERIOD_NAMES[i]} · ${TIMES[i]}</div>
      <div class="pc" style="color:${subjColor(name)}">${esc(name || '—')}</div>
      ${room && room !== '/' ? `<div class="tiny muted" style="margin-top:3px">📍 ${esc(room)}</div>` : ''}
    </div>`;
  }).join('');

  const tableRows = PERIOD_NAMES.map((pn, i) => `
    <tr>
      <td style="font-weight:750;white-space:nowrap">${pn}</td>
      ${[...Array(10).keys()].map(k => {
        const n = k + 1;
        const cell = (state.schedule[n] || [])[i] || '';
        const m = String(cell).match(/^(.+?)\s*\((.+)\)$/);
        const nm = m ? m[1] : cell;
        if (edit){
          return `<td><input class="cell-input" data-act="sched-edit" data-day="${n}" data-period="${i}" value="${esc(cell)}" placeholder="—"></td>`;
        }
        return `<td style="${n===d ? 'background:color-mix(in srgb,var(--primary) 5%,transparent)' : ''}">
          <span style="font-size:12px;font-weight:600;color:${cell ? subjColor(nm) : 'var(--muted)'}">${esc(nm || '—')}</span>
        </td>`;
      }).join('')}
    </tr>`).join('');

  return `
  <div class="card" style="margin-bottom:12px">
    <div class="card-head">
      <div class="card-title">📅 我的課表</div>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="tiny muted">10 天循環</span>
        ${edit
          ? `<button class="btn btn-primary btn-sm" data-act="sched-done">✓ 完成編輯</button>`
          : `<button class="btn btn-sm" data-act="sched-edit-toggle">✏️ 編輯課表</button>`}
      </div>
    </div>
    <div class="day-tabs">${tabs}</div>
  </div>

  <div class="card" style="margin-bottom:12px">
    <div class="card-head"><div class="card-title">🕐 Day ${d} 課堂</div></div>
    <div class="sched-grid">${todayCards}</div>
  </div>

  <div class="card">
    <div class="card-head"><div class="card-title">🗓️ 全循環總表</div></div>
    <div class="scroll-x">
      <table class="tbl" style="min-width:900px">
        <thead><tr><th>節次</th>${[...Array(10).keys()].map(k => `<th style="text-align:center">D${k+1}</th>`).join('')}</tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>
  </div>`;
};

/* =====================================================================
   7. RENDER
   ===================================================================== */
function render(){
  $('#nav').innerHTML = NAV.map(n => `
    <button class="nav-item ${state.view === n.id ? 'active' : ''}" data-nav="${n.id}">
      <span class="nav-icon">${n.icon}</span>
      <span class="nav-text"><b>${n.zh}</b><small>${n.en}</small></span>
    </button>`).join('');

  const meta = NAV.find(n => n.id === state.view) || NAV[0];
  $('#viewTitle').textContent = meta.zh;
  $('#viewSub').textContent = meta.en;

  const t = new Date();
  $('#todayDate').textContent = `${t.getFullYear()}/${pad(t.getMonth()+1)}/${pad(t.getDate())} 週${WD[t.getDay()]}`;

  $('#viewHost').innerHTML = VIEWS[state.view] ? VIEWS[state.view]() : '';
  Cloud.renderChip();

  if (state.view === 'detox'){
    requestAnimationFrame(()=>{
      const canvas = document.getElementById('bubblesCanvas');
      if (canvas && !Bubbles.running) Bubbles.init(canvas);
      else if (canvas && Bubbles.running) Bubbles.resize();
    });
  } else {
    if (Bubbles.running) Bubbles.destroy();
  }
}

/* =====================================================================
   8. ACTIONS
   ===================================================================== */
document.addEventListener('click', e => {
  const navBtn = e.target.closest('[data-nav]');
  if (navBtn){
    const oldView = state.view;
    const newView = navBtn.dataset.nav;
    if (oldView === 'detox' && newView !== 'detox'){
      Ambience.stopAll();
      Bubbles.destroy();
    }
    state.view = newView;
    state.expandedAssessId = null;
    save(); render();
    window.scrollTo({top:0, behavior:'smooth'});
    return;
  }

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  switch(act){
    case 'open-cmdk': { CmdK.open(); break; }
    case 'sync-chip': { state.view = 'settings'; save(); render(); window.scrollTo({top:0, behavior:'smooth'}); Cloud.sync(); break; }
    case 'cloud-create-bin': { Cloud.createJsonBin(); break; }
    case 'cloud-save': { Cloud.persist(); Cloud.restartTimer(); render(); toast('💾 已儲存同步設定'); Cloud.sync(); break; }
    case 'cloud-sync-now':  { Cloud.sync(); break; }
    case 'cloud-push-now': { Cloud.forcePush(); break; }
    case 'cloud-pull-now': { Cloud.forcePull(); break; }

    case 'jump-to-feedback-subj': {
      state.view = 'feedback';
      state.fbFilter = el.dataset.subj;
      state.highlightFeedbackId = null;
      save(); render();
      window.scrollTo({top:0, behavior:'smooth'});
      break;
    }
    case 'jump-to-report': {
      state.view = 'report';
      save(); render();
      window.scrollTo({top:0, behavior:'smooth'});
      break;
    }
    case 'jump-to-feedback': {
      e.stopPropagation();
      const id = el.dataset.id;
      state.view = 'feedback';
      state.highlightFeedbackId = id;
      state.editingFbId = null;
      state.fbAdding = false;
      save(); render();
      setTimeout(() => {
        const target = document.querySelector(`[data-fb-id="${id}"]`);
        if (target) target.scrollIntoView({behavior:'smooth', block:'center'});
      }, 120);
      setTimeout(() => { state.highlightFeedbackId = null; save(false); }, 4500);
      break;
    }

    case 'inbox-check': {
      const idx = parseInt(el.dataset.inboxIdx, 10);
      const items = collectInbox();
      const it = items[idx];
      if (it && it.canCheck && it.onCheck){ it.onCheck(); save(); render(); toast('✅ 完成'); }
      break;
    }
    case 'inbox-jump': {
      state.view = el.dataset.source;
      save(); render();
      window.scrollTo({top:0, behavior:'smooth'});
      break;
    }

    case 'wb-add-toggle': { state.wbAdding = !state.wbAdding; save(); render(); setTimeout(() => { const el2 = document.getElementById('wbNewTopic'); el2 && el2.focus(); }, 0); break; }
    case 'wb-cancel': { state.wbAdding = false; save(); render(); break; }
    case 'wb-save-new': {
      const subject = $('#wbNewSubj').value;
      const topic = $('#wbNewTopic').value.trim();
      const date = $('#wbNewDate').value || todayISO();
      const question = $('#wbNewQuestion').value.trim();
      const reason = $('#wbNewReason').value.trim();
      const correct = $('#wbNewCorrect').value.trim();
      if (!question && !topic){ toast('⚠️ 請至少填寫題型或題目'); return; }
      state.wrongBook = state.wrongBook || [];
      state.wrongBook.unshift({ id: uid(), subject, topic, question, reason, correct, date, mastered: false });
      state.wbAdding = false;
      save(); render();
      toast('✅ 已新增錯題');
      break;
    }
    case 'wb-del': {
      e.stopPropagation();
      const id = el.dataset.id;
      if (!id) break;
      const target = (state.wrongBook || []).find(x => x.id === id);
      if (!target) break;
      if (!confirm('刪除此錯題紀錄？\nDelete this mistake?')) break;
      state.wrongBook = state.wrongBook.filter(x => x.id !== id);
      save(); render();
      toast('🗑 已刪除 Deleted');
      break;
    }
    case 'wb-toggle-master': {
      const w = (state.wrongBook || []).find(x => x.id === el.dataset.id);
      if (!w) break;
      w.mastered = !w.mastered;
      save(); render();
      toast(w.mastered ? '✅ 已標記為掌握' : '📝 已標記為未掌握');
      break;
    }
    case 'wb-toggle-detail': { const id = el.dataset.id; state.wbExpandedId = state.wbExpandedId === id ? null : id; save(); render(); break; }
    case 'wb-filter-subj': { state.wbSubjectFilter = el.dataset.subj; save(); render(); break; }
    case 'wb-filter-status': { state.wbStatusFilter = el.dataset.status; save(); render(); break; }

    case 'assess-toggle-detail': { const id = el.dataset.id; state.expandedAssessId = state.expandedAssessId === id ? null : id; save(); render(); break; }

    case 'todo-toggle': { const it = state.todos.find(x => x.id === el.dataset.id); if (it){ it.done = !it.done; save(); render(); } break; }
    case 'todo-del': { state.todos = state.todos.filter(x => x.id !== el.dataset.id); save(); render(); break; }
    case 'todo-add': {
      const inp = $('#newTodoInput'); const txt = inp ? inp.value.trim() : '';
      if (!txt){ inp && inp.focus(); return; }
      state.todos.push({id: uid(), date: state.selDate || todayISO(), text: txt, done: false});
      save(); render();
      setTimeout(() => { const i = $('#newTodoInput'); i && i.focus(); }, 0);
      break;
    }
    case 'pick-day': { state.selDate = el.dataset.date; save(); render(); break; }
    case 'week-shift': {
      const delta = parseInt(el.dataset.delta, 10);
      state.weekAnchor = delta === 0 ? todayISO() : addDays(state.weekAnchor || todayISO(), delta);
      state.selDate = weekStart(state.weekAnchor);
      save(); render();
      break;
    }
    case 'srp-toggle': {
      const it = state.srp.find(x => x.id === el.dataset.id);
      if (!it) break;
      const idx = parseInt(el.dataset.idx, 10);
      if (!it.done) it.done = [false,false,false,false];
      it.done[idx] = !it.done[idx];
      save(); render();
      break;
    }
    case 'srp-del': { state.srp = state.srp.filter(x => x.id !== el.dataset.id); save(); render(); break; }
    case 'srp-add': {
      const subj = $('#srpSubj').value;
      const concept = $('#srpConcept').value.trim();
      const start = $('#srpStart').value;
      if (!concept){ $('#srpConcept').focus(); return; }
      if (!start) return;
      state.srp.push({id: uid(), subject: subj, concept, start, done:[false,false,false,false]});
      save(); render();
      toast('✅ 已新增知識點');
      break;
    }
    case 'assign-add': {
      const name = $('#asName').value.trim();
      if (!name){ $('#asName').focus(); return; }
      state.assignments.push({ id: uid(), name, subject: $('#asSubj').value, status: '未開始 Not Started', due: $('#asDue').value || null, time: $('#asTime').value.trim(), remarks: '' });
      save(); render();
      toast('✅ 已新增作業');
      break;
    }
    case 'assign-del': { state.assignments = state.assignments.filter(x => x.id !== el.dataset.id); save(); render(); break; }
    case 'assign-cycle': {
      const a = state.assignments.find(x => x.id === el.dataset.id);
      if (!a) break;
      const cycle = ['未開始 Not Started','進行中 In Progress','已完成 Finished','已繳交 Submitted'];
      const i = cycle.indexOf(a.status);
      a.status = cycle[(i + 1) % cycle.length];
      save(); render();
      break;
    }
    case 'assess-add': {
      const name = $('#evName').value.trim();
      if (!name){ $('#evName').focus(); return; }
      state.assessments.push({ id: uid(), name, subject: $('#evSubj').value, criteria: $('#evCrit').value.trim() || '—', due: $('#evDue').value || null, dueNote: '', progress: 0, remarks: '' });
      save(); render();
      toast('✅ 已新增評估');
      break;
    }
    case 'assess-del': { state.assessments = state.assessments.filter(x => x.id !== el.dataset.id); save(); render(); break; }
    case 'fb-filter': { state.fbFilter = el.dataset.subj; save(); render(); break; }
    case 'fb-grade-filter': { state.fbGradeFilter = el.dataset.grade; save(); render(); break; }
    case 'fb-add': { state.fbAdding = true; state.editingFbId = null; save(); render(); setTimeout(() => { const i = $('#fbNewName'); i && i.focus(); }, 0); break; }
    case 'fb-cancel': { state.fbAdding = false; state.editingFbId = null; save(); render(); break; }
    case 'fb-save-new': {
      const name = $('#fbNewName').value.trim();
      const subj = $('#fbNewSubj').value;
      const grade = $('#fbNewGrade').value.trim() || '未分類';
      const crit = $('#fbNewCrit').value.trim() || '—';
      const text = $('#fbNewText').value;
      if (!name){ $('#fbNewName').focus(); return; }
      state.feedback.unshift({id: uid(), name, subject: subj, grade, crit, text});
      state.fbAdding = false;
      save(); render();
      toast('✅ 已新增反饋');
      break;
    }
    case 'fb-edit': { state.editingFbId = el.dataset.id; state.fbAdding = false; save(); render(); break; }
    case 'fb-save': {
      const id = el.dataset.id;
      const f = state.feedback.find(x => x.id === id);
      if (!f) break;
      f.name = $('#fbEditName-' + id).value.trim() || f.name;
      f.subject = $('#fbEditSubj-' + id).value;
      f.grade = $('#fbEditGrade-' + id).value.trim() || '未分類';
      f.crit = $('#fbEditCrit-' + id).value.trim() || '—';
      f.text = $('#fbEditText-' + id).value;
      state.editingFbId = null;
      save(); render();
      toast('✅ 已更新反饋');
      break;
    }
    case 'fb-del': { if (!confirm('刪除此反饋？')) break; state.feedback = state.feedback.filter(x => x.id !== el.dataset.id); save(); render(); break; }
    case 'rcg-add': {
      const name = $('#rcgNewName').value.trim();
      if (!name){ $('#rcgNewName').focus(); return; }
      if (!Array.isArray(state.reportGrades)) state.reportGrades = [];
      state.reportGrades.push({ id: uid(), name, subject: $('#rcgNewSubj').value, scores: [null, null, null, null, null] });
      save(); render();
      toast('✅ 已新增評估');
      break;
    }
    case 'rcg-del': { state.reportGrades = (state.reportGrades || []).filter(x => x.id !== el.dataset.id); save(); render(); break; }
    case 'sched-day': { state.schedDay = parseInt(el.dataset.day, 10); save(); render(); break; }
    case 'sched-edit-toggle': { state.editingSchedule = true; save(); render(); break; }
    case 'sched-done': { state.editingSchedule = false; save(); render(); toast('✅ 課表已儲存'); break; }
    case 'subj-add': {
      const inp = $('#subjNewInput'); const name = inp ? inp.value.trim() : '';
      if (!name){ inp && inp.focus(); return; }
      if (state.subjects.includes(name)){ toast('⚠️ 此科目已存在'); return; }
      state.subjects.push(name);
      save(); render();
      toast('✅ 已新增科目');
      break;
    }
    case 'subj-del': { const name = el.dataset.name; if (!confirm(`刪除科目「${name}」？`)) break; state.subjects = state.subjects.filter(s => s !== name); save(); render(); break; }
    case 'subj-rename': {
      const oldName = el.dataset.name;
      const newName = prompt(`重新命名科目：`, oldName);
      if (!newName || !newName.trim() || newName === oldName) return;
      const trimmed = newName.trim();
      if (state.subjects.includes(trimmed) && trimmed !== oldName){ toast('⚠️ 名稱重複'); return; }
      state.subjects = state.subjects.map(s => s === oldName ? trimmed : s);
      state.srp.forEach(x => { if (x.subject === oldName) x.subject = trimmed; });
      state.assignments.forEach(x => { if (x.subject === oldName) x.subject = trimmed; });
      state.assessments.forEach(x => { if (x.subject === oldName) x.subject = trimmed; });
      state.feedback.forEach(x => { if (x.subject === oldName) x.subject = trimmed; });
      (state.wrongBook || []).forEach(x => { if (x.subject === oldName) x.subject = trimmed; });
      save(); render();
      break;
    }
    case 'data-export': {
      const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `study-dashboard-${todayISO()}.json`; a.click();
      URL.revokeObjectURL(url);
      toast('⬇️ 已匯出');
      break;
    }
    case 'data-import': {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = '.json,application/json';
      input.onchange = (ev) => {
        const file = ev.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (re) => {
          try{
            const data = JSON.parse(re.target.result);
            if (!data || typeof data !== 'object') throw new Error('invalid');
            state = normalizeState(data);
            state.editingFbId = null; state.fbAdding = false; state.editingSchedule = false;
            state.wbAdding = false; state.wbExpandedId = null;
            state.expandedAssessId = null; state.highlightFeedbackId = null;
            save(); applyTheme(); render();
            toast('✅ 已匯入');
          }catch(err){ toast('⚠️ 匯入失敗'); }
        };
        reader.readAsText(file);
      };
      input.click();
      break;
    }
    case 'data-reset': {
      if (!confirm('⚠️ 這會清除所有資料。確定要重設嗎？')) return;
      Ambience.stopAll(); Bubbles.destroy();
      localStorage.removeItem(LS_KEY);
      state = structuredClone(DEFAULT_STATE);
      state.editingFbId = null; state.fbAdding = false; state.editingSchedule = false;
      state.wbAdding = false; state.wbExpandedId = null;
      state.expandedAssessId = null; state.highlightFeedbackId = null;
      save(); applyTheme(); render();
      toast('↺ 已重設');
      break;
    }

    case 'detox-quote': {
      const el2 = document.getElementById('detoxQuote');
      if (el2){ el2.classList.remove('fade'); void el2.offsetWidth; el2.classList.add('fade'); }
      detoxState.currentQuoteIdx = pickQuoteIdx();
      const q = DETOX_QUOTES[detoxState.currentQuoteIdx];
      setTimeout(()=>{
        const cur = document.getElementById('detoxQuote');
        if (!cur) return;
        cur.querySelector('.d-quote-zh').textContent = q.zh;
        cur.querySelector('.d-quote-en').textContent = q.en;
      }, 120);
      break;
    }
    case 'detox-burn': {
      const wrap = document.getElementById('dWriteWrap');
      const area = document.getElementById('dWriteArea');
      const bed = document.getElementById('dBurnBed');
      if (!wrap || !area || !bed) break;
      const text = area.value.trim();
      if (!text) break;
      const kind = el.dataset.kind;
      wrap.classList.add('burning');
      bed.className = 'd-burn-bed ' + kind;
      wrap.querySelectorAll('.d-burn-particle').forEach(p => p.remove());
      const isFire = kind === 'fire', isWater = kind === 'water', isWind = kind === 'wind';
      const count = isFire ? 55 : isWater ? 45 : 40;
      for (let i = 0; i < count; i++){
        const p = document.createElement('span');
        let type;
        if (isFire) type = Math.random() < 0.65 ? 'fire' : 'ash';
        else if (isWater) type = 'water';
        else type = 'wind';
        p.className = 'd-burn-particle ' + type;
        const startX = 5 + Math.random() * 90;
        const tx = (Math.random() - 0.5) * (isWind ? 320 : 180);
        let ty;
        if (isFire) ty = -(180 + Math.random() * 260);
        else if (isWater) ty = (60 + Math.random() * 180);
        else ty = -(30 + Math.random() * 140) * (Math.random() - 0.2);
        p.style.left = startX + '%';
        p.style.top = isWater ? '-10%' : '100%';
        p.style.setProperty('--tx', tx + 'px');
        p.style.setProperty('--ty', ty + 'px');
        p.style.setProperty('--delay', (Math.random() * 1.2) + 's');
        p.style.setProperty('--dur', (1.2 + Math.random() * 1.0) + 's');
        p.style.setProperty('--size', (2 + Math.random() * 4) + 'px');
        p.style.setProperty('--rot', (Math.random() * 30 - 15) + 'deg');
        p.style.setProperty('--len', (20 + Math.random() * 60) + 'px');
        wrap.appendChild(p);
        setTimeout(() => p.remove(), 2800);
      }
      const parentCard = wrap.closest('.d-card');
      if (parentCard) parentCard.querySelectorAll('.d-burn-btn').forEach(b => b.disabled = true);
      setTimeout(()=>{
        area.value = '';
        wrap.classList.remove('burning');
        bed.className = 'd-burn-bed';
        wrap.querySelectorAll('.d-burn-particle').forEach(p => p.remove());
        const pc = wrap.closest('.d-card');
        if (pc) pc.querySelectorAll('.d-burn-btn').forEach(b => b.disabled = true);
        area.focus();
      }, 2200);
      break;
    }
    case 'detox-toggle': {
      const track = el.dataset.track;
      if (!state.detoxVolumes) state.detoxVolumes = {};
      const cur = state.detoxVolumes[track] || 0;
      let newVol;
      if (cur > 0){
        state.detoxVolumes['_memo_' + track] = cur;
        state.detoxVolumes[track] = 0;
        newVol = 0;
        Ambience.setVolume(track, 0);
      } else {
        const memo = state.detoxVolumes['_memo_' + track] || 0.5;
        state.detoxVolumes[track] = memo;
        newVol = memo;
        Ambience.setVolume(track, memo);
      }
      const row = el.closest('.d-audio-row');
      if (row){
        row.classList.toggle('playing', newVol > 0);
        const slider = row.querySelector('.d-audio-slider');
        if (slider) slider.value = Math.round(newVol * 100);
        if (el) el.textContent = newVol > 0 ? '❚❚' : '▶';
      }
      save();
      break;
    }
    case 'spotify-toggle': {
      const box = document.getElementById('spotifyFloat');
      if (box) box.classList.toggle('open');
      break;
    }
  }
});

document.addEventListener('input', e => {
  if (e.target.dataset && e.target.dataset.act === 'detox-volume'){
    const track = e.target.dataset.track;
    const v = parseInt(e.target.value, 10) / 100;
    Ambience.setVolume(track, v);
    const row = e.target.closest('.d-audio-row');
    if (row){
      row.classList.toggle('playing', v > 0);
      const btn = row.querySelector('.d-audio-play');
      if (btn) btn.textContent = v > 0 ? '❚❚' : '▶';
    }
    save(false);
    return;
  }
  if (e.target.id === 'dWriteArea'){
    const card = e.target.closest('.d-card');
    if (!card) return;
    const has = e.target.value.trim().length > 0;
    card.querySelectorAll('.d-burn-btn').forEach(b => b.disabled = !has);
    return;
  }
  const cloudPath = e.target.dataset && e.target.dataset.cloud;
  if (cloudPath){
    const [grp, key] = cloudPath.split('.');
    if (Cloud.cfg[grp] && key) Cloud.cfg[grp][key] = e.target.value;
    Cloud.persist();
    return;
  }
  if (e.target.id === 'cloudInterval'){
    Cloud.cfg.intervalSec = Math.max(30, parseInt(e.target.value, 10) || 60);
    Cloud.persist();
    return;
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'sched-edit'){
    const day = parseInt(el.dataset.day, 10);
    const period = parseInt(el.dataset.period, 10);
    if (!state.schedule[day]) state.schedule[day] = ['','','','',''];
    state.schedule[day][period] = el.value;
    save();
    return;
  }
  if (act === 'assess-progress'){
    const a = state.assessments.find(x => x.id === el.dataset.id);
    if (!a) return;
    a.progress = parseInt(el.value, 10);
    const wrap = el.closest('div.card');
    if (wrap){
      const bar = wrap.querySelector('.bar-fill');
      if (bar) bar.style.width = a.progress + '%';
      wrap.querySelectorAll('span').forEach(s => {
        if (/^\d+%$/.test(s.textContent.trim())) s.textContent = a.progress + '%';
      });
    }
    save();
    return;
  }
  if (act === 'rcg-name'){
    const g = (state.reportGrades || []).find(x => x.id === el.dataset.id);
    if (g){ g.name = el.value; save(); }
    return;
  }
  if (act === 'rcg-score'){
    const g = (state.reportGrades || []).find(x => x.id === el.dataset.id);
    if (!g) return;
    const def = RC_SUBJECTS.find(s => s.key === g.subject);
    const maxScore = (def && def.key === 'Biotech') ? 10 : 8;
    const idx = parseInt(el.dataset.idx, 10);
    if (!Array.isArray(g.scores)) g.scores = [null, null, null, null, null];
    const raw = el.value.trim();
    if (raw === '') g.scores[idx] = null;
    else { let n = parseInt(raw, 10); if (isNaN(n)) g.scores[idx] = null; else g.scores[idx] = Math.max(0, Math.min(maxScore, n)); }
    save();
    refreshReportSummary();
    return;
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'cloudProvider'){ Cloud.cfg.provider = e.target.value; Cloud.persist(); render(); return; }
  if (e.target.id === 'cloudAuto'){ Cloud.cfg.auto = e.target.checked; Cloud.persist(); Cloud.restartTimer(); return; }
  if (e.target.id === 'cloudInterval'){ Cloud.restartTimer(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'assess-progress'){ render(); return; }
  if (act === 'rcg-subject'){
    const g = (state.reportGrades || []).find(x => x.id === el.dataset.id);
    if (g){ g.subject = el.value; save(); render(); }
    return;
  }
  if (act === 'rcg-score'){
    const g = (state.reportGrades || []).find(x => x.id === el.dataset.id);
    if (!g) return;
    const def = RC_SUBJECTS.find(s => s.key === g.subject);
    const maxScore = (def && def.key === 'Biotech') ? 10 : 8;
    const idx = parseInt(el.dataset.idx, 10);
    if (!Array.isArray(g.scores)) g.scores = [null, null, null, null, null];
    let v = parseInt(el.value, 10);
    if (isNaN(v)) v = null;
    else v = Math.max(0, Math.min(maxScore, v));
    g.scores[idx] = v;
    save();
    el.value = v === null ? '' : v;
    refreshReportSummary();
    return;
  }
  if (act === 'sched-edit'){
    const day = parseInt(el.dataset.day, 10);
    const period = parseInt(el.dataset.period, 10);
    if (!state.schedule[day]) state.schedule[day] = ['','','','',''];
    state.schedule[day][period] = el.value;
    save();
  }
});

document.addEventListener('keydown', e => {

/* =====================================================================
   8b. 快捷鍵系統 Ctrl+K
   ===================================================================== */
const CmdK = {
  overlay: null, input: null, list: null, filtered: [], activeIdx: 0,

  commands: [
    {id:'nav-master',    icon:'🏠', label:'主控台 Dashboard',      hint:'', run: () => state.view = 'master'},
    {id:'nav-todo',      icon:'📝', label:'待辦事項 To-Do',        hint:'', run: () => state.view = 'todo'},
    {id:'nav-srp',       icon:'⏰', label:'間隔複習 SRP',           hint:'', run: () => state.view = 'srp'},
    {id:'nav-assign',    icon:'✍️', label:'作業追蹤 Assignments',  hint:'', run: () => state.view = 'assign'},
    {id:'nav-assess',    icon:'📚', label:'考試計劃 Assessments',  hint:'', run: () => state.view = 'assess'},
    {id:'nav-feedback',  icon:'💬', label:'考試反饋 Feedback',     hint:'', run: () => state.view = 'feedback'},
    {id:'nav-wrongbook', icon:'📕', label:'錯題本 Mistake Book',   hint:'', run: () => state.view = 'wrongbook'},
    {id:'nav-report',    icon:'💯', label:'成績單 Report Cards',   hint:'', run: () => state.view = 'report'},
    {id:'nav-detox',     icon:'🌿', label:'解壓空間 Detox',        hint:'', run: () => state.view = 'detox'},
    {id:'nav-schedule',  icon:'📅', label:'課表 Schedule',         hint:'', run: () => state.view = 'schedule'},
    {id:'nav-guide',     icon:'📋', label:'操作指南 Guide',         hint:'', run: () => state.view = 'guide'},
    {id:'nav-settings',  icon:'⚙️', label:'設定 Settings',         hint:'', run: () => state.view = 'settings'},
    {id:'act-theme',     icon:'🌓', label:'切換深色/淺色主題 Toggle theme', hint:'theme', run: () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; applyTheme(); }},
    {id:'act-sync',      icon:'🔄', label:'立即同步 Sync now',      hint:'sync',  run: () => Cloud.sync()},
    {id:'act-push',      icon:'⬆️', label:'上傳本地 Push',          hint:'',      run: () => Cloud.forcePush()},
    {id:'act-pull',      icon:'⬇️', label:'下載雲端 Pull',          hint:'',      run: () => Cloud.forcePull()},
    {id:'act-export',    icon:'💾', label:'匯出 JSON Export',       hint:'',      run: () => { const b = document.querySelector('[data-act="data-export"]'); b && b.click(); }},
    {id:'act-reset',     icon:'🗑', label:'重設所有資料 Reset',      hint:'',      run: () => { const b = document.getElementById('resetBtn'); b && b.click(); }}
  ],

  init(){
    this.overlay = document.getElementById('cmdkOverlay');
    this.input = document.getElementById('cmdkInput');
    this.list = document.getElementById('cmdkList');
    if (!this.overlay) return;
    this.overlay.addEventListener('click', () => this.close());
    this.input.addEventListener('input', () => this.render());
    this.input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape'){ this.close(); e.preventDefault(); }
      else if (e.key === 'ArrowDown'){ e.preventDefault(); this.move(1); }
      else if (e.key === 'ArrowUp'){ e.preventDefault(); this.move(-1); }
      else if (e.key === 'Enter'){ e.preventDefault(); this.exec(); }
    });
  },

  open(){
    if (!this.overlay) return;
    this.overlay.classList.add('open');
    this.input.value = '';
    this.activeIdx = 0;
    this.render();
    setTimeout(() => this.input.focus(), 20);
  },

  close(){
    if (!this.overlay) return;
    this.overlay.classList.remove('open');
  },

  getFiltered(){
    const q = (this.input.value || '').trim().toLowerCase();
    let items = [...this.commands];
    if (q.startsWith('todo ') || q.startsWith('add ')){
      const text = q.replace(/^(todo|add)\s+/i, '').trim();
      if (text){
        items.unshift({
          id:'add-todo', icon:'➕',
          label:`新增待辦：「${text}」`,
          hint:'Enter',
          run: () => {
            state.todos.push({id: uid(), date: state.selDate || todayISO(), text, done: false});
            state.view = 'todo';
            toast('✅ 已新增待辦');
          }
        });
      }
    }
    if (!q) return items;
    return items.filter(it => it.label.toLowerCase().includes(q) || (it.hint || '').toLowerCase().includes(q));
  },

  render(){
    this.filtered = this.getFiltered();
    if (this.activeIdx >= this.filtered.length) this.activeIdx = 0;
    if (this.activeIdx < 0) this.activeIdx = this.filtered.length - 1;
    if (!this.filtered.length){
      this.list.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted);font-size:12.5px">沒有符合的指令</div>`;
      return;
    }
    this.list.innerHTML = this.filtered.map((it, i) =>
      `<div class="cmdk-item ${i===this.activeIdx?'active':''}" data-idx="${i}">
        <span class="cmdk-icon">${it.icon}</span>
        <span class="cmdk-label">${esc(it.label)}</span>
        ${it.hint ? `<span class="cmdk-hint">${esc(it.hint)}</span>` : ''}
      </div>`
    ).join('');
    this.list.querySelectorAll('.cmdk-item').forEach(el => {
      el.addEventListener('click', () => { this.activeIdx = parseInt(el.dataset.idx, 10); this.exec(); });
      el.addEventListener('mouseenter', () => {
        this.activeIdx = parseInt(el.dataset.idx, 10);
        this.list.querySelectorAll('.cmdk-item').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
      });
    });
  },

  move(d){
    this.activeIdx += d;
    this.render();
    const active = this.list.querySelector('.cmdk-item.active');
    if (active) active.scrollIntoView({block:'nearest'});
  },

  exec(){
    const it = this.filtered[this.activeIdx];
    if (!it) return;
    this.close();
    setTimeout(() => { it.run(); save(); render(); }, 60);
  }
};

CmdK.init();

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    CmdK.open();
    return;
  }
  if (e.key === 'Escape' && CmdK.overlay && CmdK.overlay.classList.contains('open')){
    CmdK.close();
  }
});

/* =====================================================================
   11. POMODORO
   ===================================================================== */
const POMO = {
  modes: {focus:{label:'專注 FOCUS', min:25}, short:{label:'短休 SHORT', min:5}, long:{label:'長休 LONG', min:15}},
  mode: 'focus', remaining: 25 * 60, running: false, tick: null
};
function pomoRender(){
  const m = Math.floor(POMO.remaining / 60), s = POMO.remaining % 60;
  $('#pomoTime').textContent = `${pad(m)}:${pad(s)}`;
  $('#pomoMode').textContent = POMO.modes[POMO.mode].label;
  $('#pomoToggle').textContent = POMO.running ? '❚❚' : '▶';
  $('#pomo').classList.toggle('running', POMO.running);
  document.title = POMO.running ? `${pad(m)}:${pad(s)} · 學習總覽` : '學習總覽 · Studying Overview';
}
function pomoBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.18, 0.36].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.15);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.2);
    });
  }catch(e){}
}
$('#pomoToggle').addEventListener('click', () => {
  POMO.running = !POMO.running;
  if (POMO.running){
    POMO.tick = setInterval(() => {
      POMO.remaining--;
      if (POMO.remaining <= 0){
        clearInterval(POMO.tick); POMO.running = false;
        POMO.remaining = POMO.modes[POMO.mode].min * 60;
        pomoBeep();
      }
      pomoRender();
    }, 1000);
  } else { clearInterval(POMO.tick); }
  pomoRender();
});
$('#pomoReset').addEventListener('click', () => {
  clearInterval(POMO.tick); POMO.running = false;
  POMO.remaining = POMO.modes[POMO.mode].min * 60;
  pomoRender();
});
$('#pomoMode').addEventListener('click', () => {
  const order = ['focus','short','long'];
  POMO.mode = order[(order.indexOf(POMO.mode) + 1) % order.length];
  clearInterval(POMO.tick); POMO.running = false;
  POMO.remaining = POMO.modes[POMO.mode].min * 60;
  pomoRender();
});
