function render(){
  $('#nav').innerHTML = NAV.map(n => `
    <button class="nav-item ${state.view === n.id ? 'active' : ''}" data-nav="${n.id}">
      <span class="nav-icon">${n.icon}</span>
      <span class="nav-text"><b>${n.zh}</b><small>${n.en}</small></span>
    </button>`).join('');

  const meta = NAV.find(n => n.id === state.view) || NAV[0];
  $('#viewTitle').textContent = meta.zh;
  $('#viewSub').textContent = meta.en;

  const t = new Date();
  $('#todayDate').textContent = `${t.getFullYear()}/${pad(t.getMonth()+1)}/${pad(t.getDate())} 週${WD[t.getDay()]}`;

  $('#viewHost').innerHTML = VIEWS[state.view] ? VIEWS[state.view]() : '';
  Cloud.renderChip();
}

/* =====================================================================
   8. ACTIONS
   ===================================================================== */
document.addEventListener('click', e => {
  const navBtn = e.target.closest('[data-nav]');
  if (navBtn){
    state.view = navBtn.dataset.nav;
    save(); render();
    window.scrollTo({top:0, behavior:'smooth'});
    return;
  }

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  switch(act){
    case 'sync-chip': {
      state.view = 'settings';
      save(); render();
      window.scrollTo({top:0, behavior:'smooth'});
      Cloud.sync();
      break;
    }
    case 'cloud-create-bin': { Cloud.createJsonBin(); break; }
    case 'cloud-save': {
      Cloud.persist();
      Cloud.restartTimer();
      render();
      toast('💾 已儲存同步設定');
      Cloud.sync();
      break;
    }
    case 'cloud-sync-now':  { Cloud.sync(); break; }
    case 'cloud-push-now': { Cloud.forcePush(); break; }
    case 'cloud-pull-now': { Cloud.forcePull(); break; }

    case 'todo-toggle': {
      const it = state.todos.find(x => x.id === el.dataset.id);
      if (it){ it.done = !it.done; save(); render(); }
      break;
    }
    case 'todo-del': {
      state.todos = state.todos.filter(x => x.id !== el.dataset.id);
      save(); render();
      break;
    }
    case 'todo-add': {
      const inp = $('#newTodoInput');
      const txt = inp ? inp.value.trim() : '';
      if (!txt) { inp && inp.focus(); return; }
      state.todos.push({id: uid(), date: state.selDate || todayISO(), text: txt, done: false});
      save(); render();
      setTimeout(() => { const i = $('#newTodoInput'); i && i.focus(); }, 0);
      break;
    }
    case 'pick-day': {
      state.selDate = el.dataset.date;
      save(); render();
      break;
    }
    case 'week-shift': {
      const delta = parseInt(el.dataset.delta, 10);
      state.weekAnchor = delta === 0 ? todayISO() : addDays(state.weekAnchor || todayISO(), delta);
      state.selDate = weekStart(state.weekAnchor);
      save(); render();
      break;
    }
    case 'srp-toggle': {
      const it = state.srp.find(x => x.id === el.dataset.id);
      if (!it) break;
      const idx = parseInt(el.dataset.idx, 10);
      if (!it.done) it.done = [false,false,false,false];
      it.done[idx] = !it.done[idx];
      save(); render();
      break;
    }
    case 'srp-del': {
      state.srp = state.srp.filter(x => x.id !== el.dataset.id);
      save(); render();
      break;
    }
    case 'srp-add': {
      const subj = $('#srpSubj').value;
      const concept = $('#srpConcept').value.trim();
      const start = $('#srpStart').value;
      if (!concept){ $('#srpConcept').focus(); return; }
      if (!start) return;
      state.srp.push({id: uid(), subject: subj, concept, start, done:[false,false,false,false]});
      save(); render();
      toast('✅ 已新增知識點 Added');
      break;
    }
    case 'assign-add': {
      const name = $('#asName').value.trim();
      if (!name){ $('#asName').focus(); return; }
      state.assignments.push({
        id: uid(), name,
        subject: $('#asSubj').value,
        status: '未開始 Not Started',
        due: $('#asDue').value || null,
        time: $('#asTime').value.trim(),
        remarks: ''
      });
      save(); render();
      toast('✅ 已新增作業 Assignment added');
      break;
    }
    case 'assign-del': {
      state.assignments = state.assignments.filter(x => x.id !== el.dataset.id);
      save(); render();
      break;
    }
    case 'assign-cycle': {
      const a = state.assignments.find(x => x.id === el.dataset.id);
      if (!a) break;
      const cycle = ['未開始 Not Started','進行中 In Progress','已完成 Finished','已繳交 Submitted'];
      const i = cycle.indexOf(a.status);
      a.status = cycle[(i + 1) % cycle.length];
      save(); render();
      break;
    }
    case 'assess-add': {
      const name = $('#evName').value.trim();
      if (!name){ $('#evName').focus(); return; }
      state.assessments.push({
        id: uid(), name,
        subject: $('#evSubj').value,
        criteria: $('#evCrit').value.trim() || '—',
        due: $('#evDue').value || null,
        dueNote: '',
        progress: 0, remarks: ''
      });
      save(); render();
      toast('✅ 已新增評估 Assessment added');
      break;
    }
    case 'assess-del': {
      state.assessments = state.assessments.filter(x => x.id !== el.dataset.id);
      save(); render();
      break;
    }
    case 'fb-filter': {
      state.fbFilter = el.dataset.subj;
      save(); render();
      break;
    }
    case 'fb-grade-filter': {
      state.fbGradeFilter = el.dataset.grade;
      save(); render();
      break;
    }
    case 'fb-add': {
      state.fbAdding = true;
      state.editingFbId = null;
      save(); render();
      setTimeout(() => { const i = $('#fbNewName'); i && i.focus(); }, 0);
      break;
    }
    case 'fb-cancel': {
      state.fbAdding = false;
      state.editingFbId = null;
      save(); render();
      break;
    }
    case 'fb-save-new': {
      const name = $('#fbNewName').value.trim();
      const subj = $('#fbNewSubj').value;
      const grade = $('#fbNewGrade').value.trim() || '未分類';
      const crit = $('#fbNewCrit').value.trim() || '—';
      const text = $('#fbNewText').value;
      if (!name){ $('#fbNewName').focus(); return; }
      state.feedback.unshift({id: uid(), name, subject: subj, grade, crit, text});
      state.fbAdding = false;
      save(); render();
      toast('✅ 已新增反饋 Feedback added');
      break;
    }
    case 'fb-edit': {
      state.editingFbId = el.dataset.id;
      state.fbAdding = false;
      save(); render();
      break;
    }
    case 'fb-save': {
      const id = el.dataset.id;
      const f = state.feedback.find(x => x.id === id);
      if (!f) break;
      f.name = $('#fbEditName-' + id).value.trim() || f.name;
      f.subject = $('#fbEditSubj-' + id).value;
      f.grade = $('#fbEditGrade-' + id).value.trim() || '未分類';
      f.crit = $('#fbEditCrit-' + id).value.trim() || '—';
      f.text = $('#fbEditText-' + id).value;
      state.editingFbId = null;
      save(); render();
      toast('✅ 已更新反饋 Feedback updated');
      break;
    }
    case 'fb-del': {
      if (!confirm('刪除此反饋？Delete this feedback?')) break;
      state.feedback = state.feedback.filter(x => x.id !== el.dataset.id);
      save(); render();
      toast('🗑 已刪除 Deleted');
      break;
    }
    case 'rcg-add': {
      const name = $('#rcgNewName').value.trim();
      if (!name){ $('#rcgNewName').focus(); return; }
      if (!Array.isArray(state.reportGrades)) state.reportGrades = [];
      state.reportGrades.push({
        id: uid(), name,
        subject: $('#rcgNewSubj').value,
        scores: [null, null, null, null, null]
      });
      save(); render();
      toast('✅ 已新增評估 Added');
      break;
    }
    case 'rcg-del': {
      state.reportGrades = (state.reportGrades || []).filter(x => x.id !== el.dataset.id);
      save(); render();
      break;
    }
    case 'sched-day': {
      state.schedDay = parseInt(el.dataset.day, 10);
      save(); render();
      break;
    }
    case 'sched-edit-toggle': {
      state.editingSchedule = true;
      save(); render();
      break;
    }
    case 'sched-done': {
      state.editingSchedule = false;
      save(); render();
      toast('✅ 課表已儲存 Schedule saved');
      break;
    }
    case 'subj-add': {
      const inp = $('#subjNewInput');
      const name = inp ? inp.value.trim() : '';
      if (!name){ inp && inp.focus(); return; }
      if (state.subjects.includes(name)){ toast('⚠️ 此科目已存在 Already exists'); return; }
      state.subjects.push(name);
      save(); render();
      toast('✅ 已新增科目 Subject added');
      break;
    }
    case 'subj-del': {
      const name = el.dataset.name;
      if (!confirm(`刪除科目「${name}」？`)) break;
      state.subjects = state.subjects.filter(s => s !== name);
      save(); render();
      toast('🗑 已刪除科目 Subject removed');
      break;
    }
    case 'subj-rename': {
      const oldName = el.dataset.name;
      const newName = prompt(`重新命名科目：`, oldName);
      if (!newName || !newName.trim() || newName === oldName) return;
      const trimmed = newName.trim();
      if (state.subjects.includes(trimmed) && trimmed !== oldName){
        toast('⚠️ 名稱重複 Duplicate name'); return;
      }
      state.subjects = state.subjects.map(s => s === oldName ? trimmed : s);
      state.srp.forEach(x => { if (x.subject === oldName) x.subject = trimmed; });
      state.assignments.forEach(x => { if (x.subject === oldName) x.subject = trimmed; });
      state.assessments.forEach(x => { if (x.subject === oldName) x.subject = trimmed; });
      state.feedback.forEach(x => { if (x.subject === oldName) x.subject = trimmed; });
      save(); render();
      toast('✅ 已重新命名 Renamed');
      break;
    }
    case 'data-export': {
      const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `study-dashboard-${todayISO()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast('⬇️ 已匯出 Exported');
      break;
    }
    case 'data-import': {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.onchange = (ev) => {
        const file = ev.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (re) => {
          try{
            const data = JSON.parse(re.target.result);
            if (!data || typeof data !== 'object') throw new Error('invalid');
            state = normalizeState(data);
            state.editingFbId = null;
            state.fbAdding = false;
            state.editingSchedule = false;
            save(); applyTheme(); render();
            toast('✅ 已匯入 Imported');
          }catch(err){
            toast('⚠️ 匯入失敗 Import failed');
          }
        };
        reader.readAsText(file);
      };
      input.click();
      break;
    }
    case 'data-reset': {
      if (!confirm('⚠️ 這會清除所有資料。確定要重設嗎？')) return;
      localStorage.removeItem(LS_KEY);
      state = structuredClone(DEFAULT_STATE);
      state.editingFbId = null;
      state.fbAdding = false;
      state.editingSchedule = false;
      save(); applyTheme(); render();
      toast('↺ 已重設 Reset complete');
      break;
    }
  }
});

document.addEventListener('input', e => {
  const cloudPath = e.target.dataset && e.target.dataset.cloud;
  if (cloudPath){
    const [grp, key] = cloudPath.split('.');
    if (Cloud.cfg[grp] && key) Cloud.cfg[grp][key] = e.target.value;
    Cloud.persist();
    return;
  }
  if (e.target.id === 'cloudInterval'){
    Cloud.cfg.intervalSec = Math.max(30, parseInt(e.target.value, 10) || 120);
    Cloud.persist();
    return;
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'sched-edit'){
    const day = parseInt(el.dataset.day, 10);
    const period = parseInt(el.dataset.period, 10);
    if (!state.schedule[day]) state.schedule[day] = ['','','','',''];
    state.schedule[day][period] = el.value;
    save();
    return;
  }
  if (act === 'assess-progress'){
    const a = state.assessments.find(x => x.id === el.dataset.id);
    if (!a) return;
    a.progress = parseInt(el.value, 10);
    const wrap = el.closest('div.card');
    if (wrap){
      const bar = wrap.querySelector('.bar-fill');
      if (bar) bar.style.width = a.progress + '%';
      wrap.querySelectorAll('span').forEach(s => {
        if (/^\d+%$/.test(s.textContent.trim())) s.textContent = a.progress + '%';
      });
    }
    save();
    return;
  }
  if (act === 'rcg-name'){
    const g = (state.reportGrades || []).find(x => x.id === el.dataset.id);
    if (g){ g.name = el.value; save(); }
    return;
  }
  if (act === 'rcg-score'){
    const g = (state.reportGrades || []).find(x => x.id === el.dataset.id);
    if (!g) return;
    const idx = parseInt(el.dataset.idx, 10);
    if (!Array.isArray(g.scores)) g.scores = [null, null, null, null, null];
    const raw = el.value.trim();
    if (raw === '') g.scores[idx] = null;
    else {
      let n = parseInt(raw, 10);
      if (isNaN(n)) g.scores[idx] = null;
      else g.scores[idx] = Math.max(0, Math.min(8, n));
    }
    save();
    refreshReportSummary();
    return;
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'cloudProvider'){
    Cloud.cfg.provider = e.target.value;
    Cloud.persist();
    render();
    return;
  }
  if (e.target.id === 'cloudAuto'){
    Cloud.cfg.auto = e.target.checked;
    Cloud.persist();
    Cloud.restartTimer();
    return;
  }
  if (e.target.id === 'cloudInterval'){
    Cloud.restartTimer();
    return;
  }

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'assess-progress'){ render(); return; }
  if (act === 'rcg-subject'){
    const g = (state.reportGrades || []).find(x => x.id === el.dataset.id);
    if (g){ g.subject = el.value; save(); render(); }
    return;
  }
  if (act === 'rcg-score'){
    const g = (state.reportGrades || []).find(x => x.id === el.dataset.id);
    if (!g) return;
    const idx = parseInt(el.dataset.idx, 10);
    if (!Array.isArray(g.scores)) g.scores = [null, null, null, null, null];
    let v = parseInt(el.value, 10);
    if (isNaN(v)) v = null;
    else v = Math.max(0, Math.min(8, v));
    g.scores[idx] = v;
    save();
    el.value = v === null ? '' : v;
    refreshReportSummary();
    return;
  }
  if (act === 'sched-edit'){
    const day = parseInt(el.dataset.day, 10);
    const period = parseInt(el.dataset.period, 10);
    if (!state.schedule[day]) state.schedule[day] = ['','','','',''];
    state.schedule[day][period] = el.value;
    save();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){
    if (e.target.id === 'newTodoInput'){
      const btn = document.querySelector('[data-act="todo-add"]');
      btn && btn.click(); e.preventDefault();
    }
    if (e.target.id === 'subjNewInput'){
      const btn = document.querySelector('[data-act="subj-add"]');
      btn && btn.click(); e.preventDefault();
    }
    if (e.target.id === 'rcgNewName'){
      const btn = document.querySelector('[data-act="rcg-add"]');
      btn && btn.click(); e.preventDefault();
    }
    if (['srpConcept','asName','evName','fbNewName'].includes(e.target.id)){
      const map = {srpConcept:'srp-add', asName:'assign-add', evName:'assess-add', fbNewName:'fb-save-new'};
      const btn = document.querySelector(`[data-act="${map[e.target.id]}"]`);
      btn && btn.click(); e.preventDefault();
    }
  }
});

function applyTheme(){
  document.documentElement.dataset.theme = state.theme;
  $('#themeBtn').textContent = state.theme === 'dark' ? '☀️ 淺色' : '🌙 深色';
}
$('#themeBtn').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  save(); applyTheme();
});

/* =====================================================================
   10. RESET BUTTON
   ===================================================================== */
$('#resetBtn').addEventListener('click', () => {
  if (!confirm('確定要重設所有資料嗎？')) return;
  localStorage.removeItem(LS_KEY);
  state = structuredClone(DEFAULT_STATE);
  state.editingFbId = null;
  state.fbAdding = false;
  state.editingSchedule = false;
  save(); applyTheme(); render();
  toast('↺ 已重設 Reset complete');
});

/* =====================================================================
   11. POMODORO
   ===================================================================== */
const POMO = {
  modes: {focus:{label:'專注 FOCUS', min:25}, short:{label:'短休 SHORT', min:5}, long:{label:'長休 LONG', min:15}},
  mode: 'focus', remaining: 25 * 60, running: false, tick: null
};
function pomoRender(){
  const m = Math.floor(POMO.remaining / 60), s = POMO.remaining % 60;
  $('#pomoTime').textContent = `${pad(m)}:${pad(s)}`;
  $('#pomoMode').textContent = POMO.modes[POMO.mode].label;
  $('#pomoToggle').textContent = POMO.running ? '❚❚' : '▶';
  $('#pomo').classList.toggle('running', POMO.running);
  document.title = POMO.running ? `${pad(m)}:${pad(s)} · 學習總覽` : '學習總覽 · Studying Overview';
}
function pomoBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.18, 0.36].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.15);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.2);
    });
  }catch(e){}
}
$('#pomoToggle').addEventListener('click', () => {
  POMO.running = !POMO.running;
  if (POMO.running){
    POMO.tick = setInterval(() => {
      POMO.remaining--;
      if (POMO.remaining <= 0){
        clearInterval(POMO.tick); POMO.running = false;
        POMO.remaining = POMO.modes[POMO.mode].min * 60;
        pomoBeep();
        if (Notification && Notification.permission === 'granted'){
          new Notification('⏰ 番茄鐘結束 Time is up!', {body:'休息一下。'});
        }
      }
      pomoRender();
    }, 1000);
  } else {
    clearInterval(POMO.tick);
  }
  pomoRender();
});
$('#pomoReset').addEventListener('click', () => {
  clearInterval(POMO.tick); POMO.running = false;
  POMO.remaining = POMO.modes[POMO.mode].min * 60;
  pomoRender();
});
$('#pomoMode').addEventListener('click', () => {
  const order = ['focus','short','long'];
  POMO.mode = order[(order.indexOf(POMO.mode) + 1) % order.length];
  clearInterval(POMO.tick); POMO.running = false;
  POMO.remaining = POMO.modes[POMO.mode].min * 60;
  pomoRender();
});

loadState();

  const params = new URLSearchParams(location.search);

  if (room && room !== Cloud.cfg.supabase.roomId){

});

}

if ('Notification' in window && Notification.permission === 'default'){
