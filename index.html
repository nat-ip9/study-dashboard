<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>學習總覽 · Studying Overview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f8fb;
  --surface:#ffffff;
  --surface-2:#f7f8fb;
  --surface-3:#eef0f6;
  --text:#16181f;
  --muted:#8891a3;
  --border:#ebedf3;
  --primary:#5b5ef0;
  --primary-2:#8b5cf6;
  --ok:#10b981; --warn:#f59e0b; --danger:#ef4444; --info:#3b82f6; --urgent:#e11d48;
  --r:12px; --r-sm:8px;
  --shadow:0 1px 2px rgba(20,23,40,.03);
}
[data-theme="dark"]{
  --bg:#0e1015;
  --surface:#16181f;
  --surface-2:#1c1f28;
  --surface-3:#22252f;
  --text:#e9ebf5;
  --muted:#8891a3;
  --border:#242832;
  --primary:#818cf8;
  --primary-2:#a78bfa;
  --shadow:0 1px 2px rgba(0,0,0,.25);
}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--border);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;min-height:100vh}
.sidebar{
  width:230px;flex:0 0 230px;
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:4px;
  padding:18px 14px;
  background:var(--surface);
  border-right:1px solid var(--border);
  overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 16px}
.brand-icon{width:36px;height:36px;flex:0 0 36px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:var(--primary);color:#fff}
.brand h1{font-size:14px;font-weight:800;letter-spacing:.2px}
.brand p{font-size:10.5px;color:var(--muted);font-weight:500;letter-spacing:.4px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:9px;border:1px solid transparent;
  background:transparent;cursor:pointer;text-align:left;
  color:var(--muted);font:inherit;transition:.14s ease;width:100%;
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--primary);color:#fff}
.nav-icon{font-size:14px;line-height:1;width:18px;text-align:center}
.nav-text{display:flex;flex-direction:column;line-height:1.2}
.nav-text b{font-size:12.5px;font-weight:650}
.nav-text small{font-size:10px;opacity:.72;font-weight:500;letter-spacing:.2px}
.sidebar-foot{display:flex;gap:6px;padding-top:10px;border-top:1px solid var(--border)}
.sidebar-foot button{
  flex:1;padding:7px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);font:inherit;font-size:11.5px;
  cursor:pointer;transition:.14s;font-weight:600;
}
.sidebar-foot button:hover{background:var(--surface-2);color:var(--text)}

.main{flex:1;min-width:0;padding:20px 26px 70px;max-width:1400px;margin:0 auto;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.topbar h2{font-size:20px;font-weight:800;letter-spacing:-.3px}
.topbar .sub{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1.2px;text-transform:uppercase}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.today-chip{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:99px;background:var(--surface-2);border:1px solid transparent;font-size:12px;font-weight:600;color:var(--muted)}
.today-chip .dot{width:6px;height:6px;border-radius:99px;background:var(--ok)}
.pomo{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;border-radius:99px;background:var(--surface-2)}
.pomo-mode{font-size:10px;font-weight:750;letter-spacing:.4px;color:var(--muted);cursor:pointer;user-select:none;padding:3px 7px;border-radius:99px;background:var(--surface);transition:.14s}
.pomo-mode:hover{color:var(--text)}
.pomo-time{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.4px;min-width:44px;text-align:center}
.icon-btn{width:26px;height:26px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:11px;display:grid;place-items:center;transition:.14s;line-height:1}
.icon-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.pomo.running .pomo-time{color:var(--primary)}

.grid{display:grid;gap:12px}
.g-2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g-4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.stack{display:flex;flex-direction:column;gap:12px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-title{font-size:13.5px;font-weight:750;display:flex;align-items:center;gap:8px}
.card-sub{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.6px;text-transform:uppercase}

.hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap;padding:22px 24px;border-radius:var(--r);margin-bottom:14px;background:linear-gradient(120deg,var(--primary) 0%,var(--primary-2) 100%);color:#fff}
.hero h3{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
.hero p{font-size:12.5px;opacity:.9;font-weight:500;max-width:560px}
.hero-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.hero-chips span{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.16)}
.ring-wrap{position:relative;width:92px;height:92px;flex:0 0 92px}
.ring{width:92px;height:92px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4.5;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.24)}
.ring .fg{stroke:#fff;transition:stroke-dasharray .7s cubic-bezier(.4,0,.2,1)}
.ring-label{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-label b{font-size:20px;font-weight:800;line-height:1}
.ring-label small{font-size:9px;opacity:.85;letter-spacing:.8px;font-weight:650;display:block;margin-top:2px}

.stat{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);transition:.15s}
.stat:hover{border-color:color-mix(in srgb,var(--primary) 28%,var(--border))}
.stat-icon{width:34px;height:34px;flex:0 0 34px;border-radius:9px;display:grid;place-items:center;font-size:16px;background:var(--surface-2)}
.stat-val{font-size:19px;font-weight:800;line-height:1.05;letter-spacing:-.4px}
.stat-lbl{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.2px}

.badge{display:inline-flex;align-items:center;padding:2.5px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap;line-height:1.5}
.pill.ok{background:rgba(16,185,129,.13);color:#0d9c6e}
.pill.warn{background:rgba(245,158,11,.14);color:#c47a06}
.pill.danger{background:rgba(239,68,68,.13);color:#dc2626}
.pill.urgent{background:rgba(225,29,72,.13);color:#e11d48}
.pill.info{background:rgba(59,130,246,.13);color:#2563eb}
.pill.muted{background:var(--surface-2);color:var(--muted)}

.list{display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;border-radius:10px;transition:.14s;border:1px solid transparent}
.item:hover{background:var(--surface-2)}
.item + .item{border-top:1px solid var(--border)}
.item-main{flex:1;min-width:0}
.item-title{font-size:13px;font-weight:600;word-break:break-word}
.item-title.done{text-decoration:line-through;color:var(--muted);opacity:.72}
.item-meta{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:3px}
.item-actions{display:flex;gap:5px;opacity:0;transition:.15s}
.item:hover .item-actions{opacity:1}

.cb{width:19px;height:19px;flex:0 0 19px;border-radius:6px;border:2px solid var(--border);background:var(--surface);cursor:pointer;display:grid;place-items:center;transition:.14s;margin-top:1px;font-size:10px;color:transparent;line-height:1}
.cb:hover{border-color:var(--primary)}
.cb.on{background:var(--primary);border-color:var(--primary);color:#fff}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:12.5px;font-weight:650;cursor:pointer;transition:.14s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--primary);color:#fff;border-color:transparent}
.btn-primary:hover{background:color-mix(in srgb,var(--primary) 90%, black)}
.btn-sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,var(--border))}
.btn-danger:hover{background:rgba(239,68,68,.08);color:var(--danger)}

.input{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 11px;font:inherit;font-size:12.5px;color:var(--text);outline:none;transition:.14s;min-width:0;width:100%}
.input::placeholder{color:var(--muted);opacity:.7}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 14%,transparent)}
select.input{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea.input{font-family:inherit;resize:vertical;line-height:1.55}
.form-row{display:flex;gap:8px;flex-wrap:wrap}
.form-row > *{flex:1 1 150px}
.form-row > .btn{flex:0 0 auto}

.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;width:100%}
.bar-fill{height:100%;border-radius:99px;background:var(--primary);transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar-fill.ok{background:var(--ok)}
.bar-fill.warn{background:var(--warn)}
.bar-fill.danger{background:var(--danger)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:99px;background:var(--surface-3);outline:none;cursor:pointer;margin-top:10px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:99px;background:var(--primary);cursor:pointer;border:2px solid var(--surface)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:99px;border:2px solid var(--surface);background:var(--primary);cursor:pointer}

.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day-chip{padding:10px 6px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;text-align:center;transition:.14s;position:relative;overflow:hidden}
.day-chip:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--border))}
.day-chip.sel{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 5%,var(--surface))}
.day-chip.today::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--primary)}
.day-chip .wd{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.day-chip .dd{font-size:15px;font-weight:800;margin:2px 0 6px;letter-spacing:-.3px}
.day-chip .mini{height:3px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.day-chip .mini i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s}

.rev-row{display:flex;gap:5px;flex-wrap:wrap}
.rev-chip{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:52px;padding:5px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;transition:.14s}
.rev-chip:hover{border-color:var(--primary)}
.rev-chip .rl{font-size:9px;font-weight:750;color:var(--muted);letter-spacing:.3px}
.rev-chip .rd{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.rev-chip.on{background:rgba(16,185,129,.13);border-color:rgba(16,185,129,.4)}
.rev-chip.on .rd,.rev-chip.on .rl{color:#0d9c6e}
.rev-chip.due{background:rgba(225,29,72,.11);border-color:rgba(225,29,72,.35)}
.rev-chip.due .rd,.rev-chip.due .rl{color:#e11d48}
.rev-chip.late{background:rgba(245,158,11,.13);border-color:rgba(245,158,11,.35)}
.rev-chip.late .rd,.rev-chip.late .rl{color:#c47a06}

.scroll-x{overflow-x:auto;margin:0 -6px;padding:0 6px}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:620px}
table.tbl th{text-align:left;font-size:10px;font-weight:750;color:var(--muted);letter-spacing:.7px;text-transform:uppercase;padding:0 12px 8px;white-space:nowrap}
table.tbl td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:middle}
table.tbl tbody tr{transition:.13s}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl tbody tr:first-child td{border-top:1px solid var(--border)}
table.tbl input.cell-input{width:100%;border:1px solid transparent;background:transparent;padding:5px 7px;border-radius:6px;font:inherit;font-size:12px;color:inherit;outline:none;transition:.14s}
table.tbl input.cell-input:hover{background:var(--surface-2);border-color:var(--border)}
table.tbl input.cell-input:focus{background:var(--surface);border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 14%,transparent)}

.sched-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.period{padding:10px 11px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);transition:.14s}
.period:hover{border-color:color-mix(in srgb,var(--primary) 35%,var(--border))}
.period .pn{font-size:9.5px;font-weight:750;color:var(--muted);letter-spacing:.7px;text-transform:uppercase;margin-bottom:3px}
.period .pc{font-size:12px;font-weight:650;line-height:1.35}
.period input{width:100%;border:1px solid var(--border);background:var(--surface);padding:6px 8px;border-radius:7px;font:inherit;font-size:12px;color:var(--text);outline:none;transition:.14s;margin-top:2px}
.day-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;flex-wrap:wrap}
.day-tab{padding:6px 13px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:650;cursor:pointer;transition:.14s;color:var(--muted);white-space:nowrap}
.day-tab:hover{color:var(--text);border-color:var(--primary)}
.day-tab.active{background:var(--primary);color:#fff;border-color:transparent}

details.acc{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);overflow:hidden;transition:.14s}
details.acc + details.acc{margin-top:8px}
details.acc[open]{border-color:color-mix(in srgb,var(--primary) 25%,var(--border))}
details.acc summary{padding:12px 15px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:650;transition:.14s}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:'＋';margin-left:auto;color:var(--muted);font-weight:600;font-size:14px;transition:.2s}
details.acc[open] summary::after{content:'－'}
details.acc summary:hover{background:var(--surface-2)}
.acc-body{padding:2px 15px 15px;font-size:12.5px;color:var(--text)}
.fb-list{list-style:none;display:flex;flex-direction:column;gap:7px}
.fb-list li{padding-left:14px;position:relative;color:var(--muted);line-height:1.65;font-size:12.5px;white-space:pre-wrap}
.fb-list li::before{content:'';position:absolute;left:2px;top:8px;width:4px;height:4px;border-radius:99px;background:var(--primary)}

.chip-row{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:4px 11px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-size:11.5px;font-weight:600;cursor:pointer;transition:.14s;color:var(--muted)}
.chip:hover{color:var(--text);border-color:var(--primary)}
.chip.active{background:var(--primary);color:#fff;border-color:transparent}

.subj-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px 6px 12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);font-size:12px;font-weight:650;transition:.14s}
.subj-chip .dot{width:7px;height:7px;border-radius:99px}
.subj-chip button{width:18px;height:18px;border-radius:99px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:10px;display:grid;place-items:center;line-height:1}

.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:12px;border:1.5px dashed var(--border);border-radius:10px;line-height:1.7}
.empty b{display:block;font-size:13px;color:var(--text);margin-bottom:3px}
.muted{color:var(--muted)}
.tiny{font-size:10.5px}
.sec-title{font-size:11px;font-weight:750;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin:4px 0 9px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:12.5px;border-bottom:1px dashed var(--border)}
.kv:last-child{border-bottom:none}
.kv b{font-weight:700}

.rc-grade{font-size:14px;font-weight:800;text-align:center;border-radius:8px;padding:4px 0;background:var(--surface-2);color:var(--muted)}
.rc-grade.hi{background:rgba(16,185,129,.13);color:#0d9c6e}
.rc-grade.mid{background:rgba(245,158,11,.14);color:#c47a06}
.rc-grade.lo{background:rgba(239,68,68,.13);color:#dc2626}

.rcg-row{display:grid;grid-template-columns:minmax(110px,1.3fr) 108px repeat(5,54px) 34px;gap:6px;align-items:center;padding:5px 6px;border-radius:9px;transition:.13s}
.rcg-row:hover{background:var(--surface-2)}
.rcg-row.rcg-head{font-size:10px;font-weight:750;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;padding-bottom:2px}
.rcg-row.rcg-head:hover{background:transparent}
.rcg-row .input{padding:6px 7px;font-size:12px;border-radius:7px}
.rcg-num{text-align:center;font-variant-numeric:tabular-nums}
.rcg-num:disabled{opacity:.25;cursor:not-allowed;background:var(--surface-2)}

.wb-record{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;transition:.14s;position:relative}
.wb-record:hover{border-color:color-mix(in srgb,var(--primary) 30%,var(--border))}
.wb-record.mastered{opacity:.62}
.wb-record.mastered .wb-question{text-decoration:line-through}
.wb-question{font-size:13px;font-weight:650;line-height:1.45;margin:6px 0 8px;word-break:break-word}
.wb-row{font-size:12px;line-height:1.55;margin-top:6px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.wb-row b{color:var(--text);font-weight:700}
.wb-wrong b{color:var(--danger)}
.wb-correct b{color:var(--ok)}

.inbox-bar{border-radius:var(--r);padding:14px 16px;margin-bottom:12px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--primary)}
.inbox-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.inbox-head b{font-size:13px;font-weight:750}
.inbox-list{display:flex;flex-direction:column;gap:3px}
.inbox-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;transition:.14s;border:1px solid transparent}
.inbox-item:hover{background:var(--surface-2);border-color:var(--border)}
.inbox-item .inbox-icon{font-size:14px;flex:0 0 20px;text-align:center;line-height:1}
.inbox-item .inbox-main{flex:1;min-width:0}
.inbox-item .inbox-title{font-size:12.5px;font-weight:600;line-height:1.4;word-break:break-word}
.inbox-item .inbox-meta{font-size:10.5px;color:var(--muted);display:flex;gap:8px;margin-top:2px;flex-wrap:wrap}
.inbox-item .inbox-src{opacity:.7;font-weight:600}

const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');

const toISO    = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays  = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate()+n); return toISO(d); };
const todayISO = () => toISO(new Date());
const diffDays = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const fmtMD    = iso => { const d = parseISO(iso); return `${d.getMonth()+1}/${d.getDate()}`; };
const fmtLong  = iso => { const d = parseISO(iso); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} 週${'日一二三四五六'[d.getDay()]}`; };
const WD       = ['日','一','二','三','四','五','六'];
const weekStart = iso => { const d = parseISO(iso); return addDays(iso, -((d.getDay()+6)%7)); };

let toastTimer;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

let state;

function normalizeState(raw){
  const base = structuredClone(DEFAULT_STATE);
  const merged = Object.assign(base, raw || {});
  if (!Array.isArray(merged.subjects) || !merged.subjects.length) merged.subjects = [...DEFAULT_SUBJECTS];
  if (!Array.isArray(merged.feedback)) merged.feedback = structuredClone(DEFAULT_FEEDBACK);
  if (!merged.schedule || typeof merged.schedule !== 'object') merged.schedule = structuredClone(DEFAULT_SCHEDULE);
  if (!Array.isArray(merged.reportGrades)) merged.reportGrades = [];
  if (!Array.isArray(merged.todos)) merged.todos = [];
  if (!Array.isArray(merged.srp)) merged.srp = [];
  if (!Array.isArray(merged.assignments)) merged.assignments = [];
  if (!Array.isArray(merged.assessments)) merged.assessments = [];
  if (!Array.isArray(merged.wrongBook)) merged.wrongBook = [];
  merged.wrongBook = merged.wrongBook.map(w => {
    if (!w || typeof w !== 'object') return null;
    if (!w.id) w.id = uid();
    return w;
  }).filter(Boolean);
  if (typeof merged.updatedAt !== 'number') merged.updatedAt = 0;
  merged.feedback.forEach(f => { if (!f.grade) f.grade = 'Grade 8'; });
  if (!merged.detoxVolumes || typeof merged.detoxVolumes !== 'object'){
    merged.detoxVolumes = { rain:0, waves:0, fire:0, coffee:0, forest:0, chime:0 };
  }
  return merged;
}

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if (raw){ state = normalizeState(JSON.parse(raw)); return; }
  }catch(e){ console.warn('load failed', e); }
  state = structuredClone(DEFAULT_STATE);
}

function save(touch = true){
  if (touch) state.updatedAt = Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}

/* =====================================================================
   4. DERIVED HELPERS
   ===================================================================== */
const isFinished = a => /完成|已繳|finished|submitted/i.test(a.status || '');

function srpDates(item){
  return item.start ? REV_OFFSETS.map(o => addDays(item.start, o)) : [];
}
function srpDueOn(date){
  const out = [];
  state.srp.forEach(it => {
    const ds = srpDates(it);
    const done = it.done || [false,false,false,false];
    ds.forEach((d, i) => { if (d === date && !done[i]) out.push({item: it, idx: i}); });
  });
  return out;
}
function srpStatus(it){
  const ds = srpDates(it);
  if (!ds.length) return {label:'📋 待安排', tone:'muted'};
  const done = it.done || [false,false,false,false];
  const t = todayISO();
  if (done.every(Boolean)) return {label:'✅ 已完成', tone:'ok'};
  const iToday = ds.findIndex((d,i) => !done[i] && d === t);
  if (iToday >= 0) return {label:`🔴 今日第 ${iToday+1} 次複習`, tone:'urgent'};
  const iOver = ds.findIndex((d,i) => !done[i] && d < t);
  if (iOver >= 0) return {label:`⏰ 第 ${iOver+1} 次複習已逾期`, tone:'danger'};
  const iNext = ds.findIndex((d,i) => !done[i]);
  return {label:`📅 等待第 ${iNext+1} 次複習`, tone:'info'};
}
function assignStatus(a){
  if (isFinished(a)) return {label:'✅ 已完成', tone:'ok'};
  if (!a.due) return {label:'📋 待安排', tone:'muted'};
  const d = diffDays(todayISO(), a.due);
  if (d < 0)  return {label:'⚠️ 逾期', tone:'danger'};
  if (d === 0) return {label:'⏰ 今天到期', tone:'urgent'};
  if (d <= 3) return {label:'🔔 即將到期', tone:'warn'};
  return {label:'📋 進行中', tone:'info'};
}
function assessStatus(a){
  if (!a.due) return {label:'📋 日期待定', tone:'muted'};
  const d = diffDays(todayISO(), a.due);
  const p = a.progress || 0;
  if (d < 0) return {label:'⚠️ 已過期', tone:'danger'};
  if (d <= 3 && p < 80) return {label:'⚠️ 剩 3 天內準備未達 80%', tone:'danger'};
  if (d <= 10 && p < 50) return {label:'🔔 剩 10 天進度落後', tone:'warn'};
  if (p >= 80) return {label:'✅ 準備充分', tone:'ok'};
  if (p >= 50) return {label:'🔄 進行中', tone:'info'};
  return {label:'📝 未開始', tone:'muted'};
}
function assessSuggest(a){
  if (!a.due) return '📌 先確認評估日期，再納入 SRP 規劃。';
  const d = diffDays(todayISO(), a.due);
  if (d < 0) return '⚠️ 已過期，請立即與老師確認補交安排。';
  if (d <= 7) return `🔔 距離考試僅剩 ${d} 天，建議密集複習！`;
  if (d <= 14) return '📌 考前兩週，可開始規劃此科知識點進入 SRP。';
  return '✅ 時間充裕，先建立知識點清單。';
}
function weekStats(startISO){
  const days = [...Array(7)].map((_, i) => addDays(startISO, i));
  const list = state.todos.filter(t => days.includes(t.date));
  const done = list.filter(t => t.done).length;
  return {total: list.length, done, pct: list.length ? Math.round(done/list.length*100) : 0, days};
}

/* 統一收件匣（含合併邏輯） */
function collectInbox(){
  const t = todayISO();
  const raw = [];

  state.todos.filter(x => x.date === t && !x.done).forEach(x => {
    raw.push({
      entityKey: 'todo:' + x.id, isSuggestion: false,
      id: 'todo-' + x.id, type: 'todo', sourceId: x.id,
      icon: '📝', text: x.text,
      source: 'todo', sourceLabel: '待辦事項',
      tone: 'info', canCheck: true,
      onCheck: () => { const it = state.todos.find(y => y.id === x.id); if (it) it.done = true; }
    });
  });

  srpDueOn(t).forEach(({item, idx}) => {
    raw.push({
      entityKey: 'srp:' + item.id, isSuggestion: false,
      id: 'srp-' + item.id + '-' + idx, type: 'srp', sourceId: item.id, idx,
      icon: '⏰', text: item.concept, sub: `第 ${idx+1} 次複習`,
      source: 'srp', sourceLabel: '間隔複習',
      tone: 'urgent', canCheck: true,
      onCheck: () => {
        const it = state.srp.find(y => y.id === item.id);
        if (!it) return;
        if (!it.done) it.done = [false,false,false,false];
        it.done[idx] = true;
      }
    });
  });

  state.assignments.filter(a => a.due && !isFinished(a)).forEach(a => {
    const d = diffDays(t, a.due);
    if (d < 0){
      raw.push({
        entityKey: 'assign:' + a.id, isSuggestion: false,
        id: 'assign-' + a.id, type: 'assign', sourceId: a.id,
        icon: '⚠️', text: a.name, sub: `逾期 ${-d} 天`,
        source: 'assign', sourceLabel: '作業追蹤',
        tone: 'danger', canCheck: false
      });
    } else if (d <= 3){
      raw.push({
        entityKey: 'assign:' + a.id, isSuggestion: false,
        id: 'assign-' + a.id, type: 'assign', sourceId: a.id,
        icon: '✍️', text: a.name, sub: d === 0 ? '今天到期' : `剩 ${d} 天`,
        source: 'assign', sourceLabel: '作業追蹤',
        tone: d === 0 ? 'urgent' : 'warn', canCheck: false
      });
    }
  });

  state.assessments.forEach(a => {
    if (!a.due) return;
    const d = diffDays(t, a.due);
    if (d < 0 || d > 7) return;
    if ((a.progress || 0) >= 80) return;
    raw.push({
      entityKey: 'assess:' + a.id, isSuggestion: false,
      id: 'assess-' + a.id, type: 'assess', sourceId: a.id,
      icon: '📚', text: a.name, sub: `剩 ${d} 天 · 準備 ${a.progress || 0}%`,
      source: 'assess', sourceLabel: '考試計劃',
      tone: d <= 3 ? 'danger' : 'warn', canCheck: false
    });
  });

  const lateSRPItems = state.srp.filter(it => {
    const ds = srpDates(it), done = it.done || [];
    return ds.some((d, i) => !done[i] && d < t);
  });
  if (lateSRPItems.length){
    raw.push({
      entityKey: 'srp-batch', isSuggestion: false,
      id: 'srp-late-batch', type: 'srp',
      icon: '⏰', text: `有 ${lateSRPItems.length} 個知識點複習逾期`,
      sub: '趁空檔補上，間隔複習最忌斷線',
      source: 'srp', sourceLabel: '間隔複習',
      tone: 'warn', canCheck: false
    });
  }

  const oldWrongs = (state.wrongBook || []).filter(w => !w.mastered && diffDays(w.date, t) >= 7);
  if (oldWrongs.length){
    raw.push({
      entityKey: 'wrong-batch', isSuggestion: false,
      id: 'wrong-batch', type: 'wrongbook',
      icon: '📕', text: `有 ${oldWrongs.length} 筆錯題超過 7 天未掌握`,
      sub: '建議今天花 10 分鐘復習',
      source: 'wrongbook', sourceLabel: '錯題本',
      tone: 'warn', canCheck: false
    });
  }

  /* 智慧建議（會與原始項合併） */
  state.assignments.filter(a => a.due && !isFinished(a)).forEach(a => {
    const d = diffDays(t, a.due);
    if (d <= -3 && d > -30){
      raw.push({
        entityKey: 'assign:' + a.id, isSuggestion: true,
        id: 'smart-assign-late-' + a.id,
        text: `補交（已逾期 ${-d} 天）`,
        tone: 'danger'
      });
    }
  });
  state.assessments.forEach(a => {
    if (!a.due) return;
    const d = diffDays(t, a.due);
    if (d === 7){
      raw.push({
        entityKey: 'assess:' + a.id, isSuggestion: true,
        id: 'smart-assess-7d-' + a.id,
        text: `開始密集複習（距考試 7 天）`,
        tone: 'warn'
      });
    }
    if (d === 1){
      raw.push({
        entityKey: 'assess:' + a.id, isSuggestion: true,
        id: 'smart-assess-1d-' + a.id,
        text: `最後檢查（明天考試）`,
        tone: 'urgent'
      });
    }
  });
  state.srp.filter(it => {
    const ds = srpDates(it), done = it.done || [];
    return ds.some((d, i) => !done[i] && diffDays(d, t) >= 7);
  }).forEach(it => {
    raw.push({
      entityKey: 'srp:' + it.id, isSuggestion: true,
      id: 'smart-srp-' + it.id,
      text: `補複習（已逾期 7 天以上）`,
      tone: 'warn'
    });
  });

  /* 合併：相同 entityKey 的合併為一條 */
  const groups = new Map();
  for (const item of raw){
    const key = item.entityKey;
    if (!groups.has(key)) groups.set(key, { main: null, suggestions: [] });
    const g = groups.get(key);
    if (item.isSuggestion){
      g.suggestions.push(item.text);
    } else if (!g.main){
      g.main = item;
    }
  }

  const items = [];
  for (const [key, g] of groups){
    if (g.main){
      g.main.suggestions = g.suggestions;
      items.push(g.main);
    } else {
      const first = raw.find(i => i.entityKey === key && i.isSuggestion);
      if (first) items.push({
        id: first.id, type: 'smart', icon: '💡',
        text: `[建議] ${first.text}`,
        source: 'master', sourceLabel: '建議',
        tone: first.tone, canCheck: false, suggestions: []
      });
    }
  }

  const order = { danger: 0, urgent: 1, warn: 2, info: 3, ok: 4 };
  items.sort((a, b) => order[a.tone] - order[b.tone]);
  return items;
}

/* 考試相關資料關聯 */
function getAssessRelated(subject, criteria){
  const parseCrit = (s) => new Set(String(s || '').split(/[,\s]+/).map(x => x.trim().toUpperCase()).filter(Boolean));
  const targetCrit = parseCrit(criteria);

  const feedbacks = state.feedback.filter(f => {
    if (f.subject !== subject) return false;
    if (!targetCrit.size) return true;
    const fCrit = parseCrit(f.crit);
    for (const c of targetCrit) if (fCrit.has(c)) return true;
    return false;
  }).slice(0, 3);

  return {
    feedbacks,
    wrongs: (state.wrongBook || []).filter(w => w.subject === subject).slice(0, 5),
    assignments: state.assignments.filter(a => a.subject === subject && !isFinished(a))
  };
}

const RC_SUBJECTS = [
  {key:'Chinese',    crit:['A','B','C','D'],         cuts:[28,24,19,15,10,6]},
  {key:'MfE',        crit:['A','B','C','D'],         cuts:[28,24,19,15,10,6]},
  {key:'English',    crit:['A','B','C','D'],         cuts:[28,24,19,15,10,6]},
  {key:'Math',       crit:['A','B','C','D'],         cuts:[28,24,19,15,10,6]},
  {key:'INS',        crit:['A','B','C','D'],         cuts:[28,24,19,15,10,6]},
  {key:'Sciences',   crit:['A','B','C','D'],         cuts:[28,24,19,15,10,6]},
  {key:'PHE',        crit:['A','B','C','D'],         cuts:[28,24,19,15,10,6]},
  {key:'Humanities', crit:['A','B','C','D'],         cuts:[28,24,19,15,10,6]},
  {key:'Biotech',    crit:['I','II','III','IV','V'], cuts:[44,38,30,24,16,10]}
];

function ibGradeFromTotal(total, cuts){
  for (let i = 0; i < cuts.length; i++) if (total >= cuts[i]) return 7 - i;
  return 1;
}

function rcCalc(){
  const grades = state.reportGrades || [];
  return RC_SUBJECTS.map(def => {
    const recs = grades.filter(r => r.subject === def.key);
    const avgs = def.crit.map((_, i) => {
      const vals = recs.map(r => (r.scores || [])[i])
        .filter(v => v !== null && v !== undefined && v !== '' && !isNaN(v)).map(Number);
      if (!vals.length) return null;
      return Math.floor(vals.reduce((a, b) => a + b, 0) / vals.length);
    });
    const filled = avgs.filter(v => v !== null);
    const total = filled.reduce((a, b) => a + b, 0);
    const complete = filled.length === def.crit.length;
    const grade = complete ? ibGradeFromTotal(total, def.cuts) : null;
    return { def, avgs, total, complete, grade, count: recs.length, filledCount: filled.length };
  });
}

function rcStatsHTML(){
  const subjData = rcCalc();
  let sumAll = 0, cntAll = 0;
  const graded = [];
  subjData.forEach(sd => {
    const isBiotech = sd.def.key === 'Biotech';
    sd.avgs.forEach(v => {
      if (v !== null){ sumAll += isBiotech ? v * 0.8 : v; cntAll++; }
    });
    if (sd.grade !== null) graded.push(sd.grade);
  });
  const avg = cntAll ? sumAll / cntAll : null;
  const oa  = graded.length ? graded.reduce((a, b) => a + b, 0) / graded.length : null;
  const sumDisplay = Number.isInteger(sumAll) ? sumAll : sumAll.toFixed(1);
  return `
    <div class="stat"><div class="stat-icon" style="background:rgba(91,94,240,.13)">📊</div>
      <div><div class="stat-val">${graded.length}/9</div><div class="stat-lbl">已評科目</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(16,185,129,.13)">🏆</div>
      <div><div class="stat-val">${oa !== null ? oa.toFixed(2) : '—'}</div><div class="stat-lbl">Total OA</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(139,92,246,.13)">📐</div>
      <div><div class="stat-val">${avg !== null ? avg.toFixed(2) : '—'}</div><div class="stat-lbl">標準平均 (0–8)</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(245,158,11,.14)">Σ</div>
      <div><div class="stat-val">${sumDisplay}</div><div class="stat-lbl">標準化總分（${cntAll}）</div></div></div>
  `;
}

function rcSummaryHTML(){
  const subjData = rcCalc();
  const rows = subjData.map(sd => {
    const cells = [...Array(5)].map((_, i) => {
      if (i >= sd.def.crit.length) return `<td style="text-align:center" class="tiny muted">·</td>`;
      const v = sd.avgs[i];
      return `<td style="text-align:center;font-weight:750;font-size:13.5px;font-variant-numeric:tabular-nums">${
        v === null ? '<span class="muted" style="font-weight:400">–</span>' : v
      }</td>`;
    }).join('');
    const gc = sd.grade === null ? '' : sd.grade >= 6 ? 'hi' : sd.grade >= 4 ? 'mid' : 'lo';
    const hasAny = sd.filledCount > 0;
    return `<tr>
      <td><span data-act="jump-to-feedback-subj" data-subj="${esc(sd.def.key)}" style="display:flex;align-items:center;gap:8px;cursor:pointer" title="點擊查看該科反饋">
        <span style="width:8px;height:8px;border-radius:99px;background:${subjColor(sd.def.key)};flex:0 0 8px"></span>
        <b style="font-size:12.5px">${sd.def.key}</b>
        <span class="tiny muted" style="font-weight:600;opacity:.6">💬</span>
      </span></td>
      ${cells}
      <td style="text-align:center;font-weight:800;font-size:13.5px">${hasAny ? sd.total : '<span class="muted" style="font-weight:400">–</span>'}</td>
      <td style="text-align:center"><span class="rc-grade ${gc}" style="display:inline-block;min-width:34px;padding:3px 0">${sd.grade ?? '—'}</span></td>
      <td style="text-align:right" class="tiny muted">${sd.count ? sd.count + ' 筆' : '—'}</td>
    </tr>`;
  }).join('');

  return `<div class="scroll-x"><table class="tbl" style="min-width:600px">
    <thead><tr><th>科目</th><th style="text-align:center">A</th><th style="text-align:center">B</th><th style="text-align:center">C</th><th style="text-align:center">D</th><th style="text-align:center">E</th><th style="text-align:center">總分</th><th style="text-align:center">等級</th><th style="text-align:right">紀錄</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

const CLOUD_CFG_KEY = 'nathan-cloud-cfg-v1';

const Cloud = {
  cfg: {
    provider: 'supabase', auto: true, intervalSec: 60,
    supabase: { url: '', anonKey: '', roomId: '' },
    jsonbin:  { masterKey: '', binId: '' },
    custom:   { url: '', token: '' }
  },
  timer: null, busy: false, lastSyncAt: 0, status: 'idle', message: '',

  load(){
    try{
      const raw = localStorage.getItem(CLOUD_CFG_KEY);
      if (raw){
        const parsed = JSON.parse(raw);
        Object.assign(this.cfg, parsed);
        if (!parsed._v2){ this.cfg.intervalSec = 60; this.cfg._v2 = true; this.persist(); }
      }
    }catch(e){}
  },
  persist(){ try{ localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(this.cfg)); }catch(e){} },
  get configured(){
    const c = this.cfg;
    if (c.provider === 'supabase') return !!(c.supabase.url && c.supabase.anonKey && c.supabase.roomId);
    if (c.provider === 'jsonbin')  return !!(c.jsonbin.binId && c.jsonbin.masterKey);
    if (c.provider === 'custom')   return !!c.custom.url;
    return false;
  },

  async pull(){
    const c = this.cfg;
    if (c.provider === 'supabase'){
      const base = c.supabase.url.replace(/\/+$/,'');
      const r = await fetch(`${base}/rest/v1/study_state?room=eq.${encodeURIComponent(c.supabase.roomId)}&select=data`,
        { headers: { apikey: c.supabase.anonKey, Authorization: `Bearer ${c.supabase.anonKey}` } });
      if (!r.ok) throw new Error(`pull HTTP ${r.status}`);
      const rows = await r.json();
      return rows[0] ? rows[0].data : null;
    }
    if (c.provider === 'jsonbin'){
      const r = await fetch(`https://api.jsonbin.io/v3/b/${c.jsonbin.binId}/latest`,
        { headers: { 'X-Master-Key': c.jsonbin.masterKey, 'X-Bin-Meta': 'false' } });
      if (!r.ok) throw new Error(`pull HTTP ${r.status}`);
      return await r.json();
    }
    if (c.provider === 'custom'){
      const r = await fetch(c.custom.url, { headers: c.custom.token ? { Authorization: `Bearer ${c.custom.token}` } : {} });
      if (!r.ok) throw new Error(`pull HTTP ${r.status}`);
      return await r.json();
    }
    throw new Error('未設定同步');
  },

  async push(data){
    const c = this.cfg;
    if (c.provider === 'supabase'){
      const base = c.supabase.url.replace(/\/+$/,'');
      const r = await fetch(`${base}/rest/v1/study_state`, {
        method: 'POST',
        headers: {
          apikey: c.supabase.anonKey, Authorization: `Bearer ${c.supabase.anonKey}`,
          'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal'
        },
        body: JSON.stringify([{ room: c.supabase.roomId, data, updated_at: new Date().toISOString() }])
      });
      if (!r.ok) throw new Error(`push HTTP ${r.status}`);
      return;
    }
    if (c.provider === 'jsonbin'){
      const r = await fetch(`https://api.jsonbin.io/v3/b/${c.jsonbin.binId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': c.jsonbin.masterKey },
        body: JSON.stringify(data)
      });
      if (!r.ok) throw new Error(`push HTTP ${r.status}`);
      return;
    }
    if (c.provider === 'custom'){
      const r = await fetch(c.custom.url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...(c.custom.token ? { Authorization: `Bearer ${c.custom.token}` } : {}) },
        body: JSON.stringify(data)
      });
      if (!r.ok) throw new Error(`push HTTP ${r.status}`);
      return;
    }
    throw new Error('未設定同步');
  },

  async sync(silent){
    if (!this.configured || this.busy) return;
    this.busy = true; this.setStatus('syncing', '同步中…');
    try{
      const remote = await this.pull();
      const localTs  = state.updatedAt || 0;
      const remoteTs = (remote && remote.updatedAt) || 0;
      if (!remote){ await this.push(state); this.setStatus('ok', '已上傳雲端'); }
      else if (remoteTs > localTs){
        state = normalizeState(remote);
        state.editingFbId = null; state.fbAdding = false; state.editingSchedule = false;
        state.wbAdding = false; state.wbExpandedId = null;
        state.expandedAssessId = null; state.highlightFeedbackId = null;
        localStorage.setItem(LS_KEY, JSON.stringify(state));
        applyTheme(); render();
        this.setStatus('ok', '已下載雲端更新');
        if (!silent) toast('⬇️ 已同步雲端最新資料');
      } else if (localTs > remoteTs){ await this.push(state); this.setStatus('ok', '已上傳本地'); }
      else { this.setStatus('ok', '已是最新'); }
      this.lastSyncAt = Date.now();
      this.updateLastSyncUI();
    }catch(err){
      console.warn('sync error', err);
      this.setStatus('error', err.message || '同步失敗');
    }finally{ this.busy = false; this.renderChip(); }
  },

  async forcePush(){
    if (!this.configured) { toast('⚠️ 尚未設定同步'); return; }
    this.busy = true; this.setStatus('syncing', '上傳中…');
    try{
      state.updatedAt = Date.now();
      localStorage.setItem(LS_KEY, JSON.stringify(state));
      await this.push(state);
      this.lastSyncAt = Date.now();
      this.setStatus('ok', '已上傳'); toast('⬆️ 已上傳本地資料');
      this.updateLastSyncUI();
    }catch(e){ this.setStatus('error', e.message); toast('⚠️ 上傳失敗'); }
    finally{ this.busy = false; this.renderChip(); }
  },
  async forcePull(){
    if (!this.configured) { toast('⚠️ 尚未設定同步'); return; }
    this.busy = true; this.setStatus('syncing', '下載中…');
    try{
      const remote = await this.pull();
      if (!remote){ this.setStatus('ok', '雲端無資料'); toast('雲端尚無資料'); return; }
      state = normalizeState(remote);
      state.editingFbId = null; state.fbAdding = false; state.editingSchedule = false;
      state.wbAdding = false; state.wbExpandedId = null;
      state.expandedAssessId = null; state.highlightFeedbackId = null;
      localStorage.setItem(LS_KEY, JSON.stringify(state));
      applyTheme(); render();
      this.lastSyncAt = Date.now();
      this.setStatus('ok', '已下載'); toast('⬇️ 已下載雲端資料');
      this.updateLastSyncUI();
    }catch(e){ this.setStatus('error', e.message); toast('⚠️ 下載失敗'); }
    finally{ this.busy = false; this.renderChip(); }
  },

  setStatus(s, msg){
    this.status = s; this.message = msg || '';
    this.renderChip();
    const el = document.getElementById('cloudStatusText');
    if (el) el.textContent = msg || s;
  },

  updateLastSyncUI(){
    const el = document.getElementById('lastSyncText');
    if (el) el.textContent = this.lastSyncAt ? new Date(this.lastSyncAt).toLocaleTimeString() : '—';
  },

  renderChip(){
    const dot  = document.getElementById('syncDot');
    const text = document.getElementById('syncText');
    if (!dot || !text) return;
    if (!this.configured){ dot.style.background = 'var(--muted)'; text.textContent = '本機 Local'; return; }
    const map = { idle:['var(--info)','待同步'], syncing:['var(--warn)','同步中…'], ok:['var(--ok)','已同步'], error:['var(--danger)','同步失敗'] };
    const [color, label] = map[this.status] || map.idle;
    dot.style.background = color;
    text.textContent = label;
  },

  restartTimer(){
    clearInterval(this.timer);
    if (!this.cfg.auto || !this.configured) return;
    const sec = Math.max(30, this.cfg.intervalSec || 60);
    this.timer = setInterval(() => {
      if (document.visibilityState === 'visible') this.sync(true);
    }, sec * 1000);
  },

  async createJsonBin(){
    const key = this.cfg.jsonbin.masterKey;
    if (!key){ toast('⚠️ 請先填入 X-Master-Key'); return; }
    try{
      const r = await fetch('https://api.jsonbin.io/v3/b', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': key, 'X-Bin-Name': 'study-dashboard' },
        body: JSON.stringify(state)
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      const id = data?.metadata?.id;
      if (!id) throw new Error('no id');
      this.cfg.jsonbin.binId = id;
      this.persist();
      toast('✅ 已建立 Bin：' + id);
      render();
    }catch(e){ toast('⚠️ 建立失敗：' + e.message); }
  }
};

const Ambience = {
  ctx: null, master: null, tracks: {},
  init(){
    if (this.ctx) return true;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.6;
      this.master.connect(this.ctx.destination);
      return true;
    }catch(e){ return false; }
  },
  makeNoise(type){
    const sr = this.ctx.sampleRate, len = sr * 4;
    const buf = this.ctx.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    if (type === 'white'){ for (let i=0;i<len;i++) d[i] = Math.random()*2-1; }
    else if (type === 'pink'){
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for (let i=0;i<len;i++){
        const w = Math.random()*2-1;
        b0 = 0.99886*b0 + w*0.0555179; b1 = 0.99332*b1 + w*0.0750759;
        b2 = 0.96900*b2 + w*0.1538520; b3 = 0.86650*b3 + w*0.3104856;
        b4 = 0.55000*b4 + w*0.5329522; b5 = -0.7616*b5 - w*0.0168980;
        d[i] = (b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11; b6 = w*0.115926;
      }
    } else {
      let last = 0;
      for (let i=0;i<len;i++){ const w = Math.random()*2-1; last = (last + 0.02*w) / 1.02; d[i] = last * 3.5; }
    }
    return buf;
  },
  buildRain(){
    const c = this.ctx, out = c.createGain(); out.gain.value = 0;
    const src = c.createBufferSource(); src.buffer = this.makeNoise('pink'); src.loop = true;
    const hp = c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=800;
    const lp = c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=8000;
    const layer = c.createGain(); layer.gain.value = 0.5;
    src.connect(hp); hp.connect(lp); lp.connect(layer); layer.connect(out); src.start();
    const dropTimer = setInterval(()=>{
      if (out.gain.value < 0.02) return;
      try{
        for (let i=0;i<1+Math.floor(Math.random()*3);i++){
          const o = c.createOscillator(), g = c.createGain();
          o.type = 'triangle';
          const freq = 4000 + Math.random()*4000;
          o.frequency.setValueAtTime(freq, c.currentTime);
          o.frequency.exponentialRampToValueAtTime(freq*0.6, c.currentTime+0.03);
          g.gain.setValueAtTime(0.0001, c.currentTime);
          g.gain.exponentialRampToValueAtTime(0.05 + Math.random()*0.05, c.currentTime+0.002);
          g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+0.04);
          o.connect(g); g.connect(out); o.start(); o.stop(c.currentTime+0.05);
        }
      }catch(e){}
    }, 60);
    return {out, timers:[dropTimer]};
  },
  buildWaves(){
    const c = this.ctx, out = c.createGain(); out.gain.value = 0;
    const src = c.createBufferSource(); src.buffer = this.makeNoise('brown'); src.loop = true;
    const lp = c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=800;
    const waveGain = c.createGain(); waveGain.gain.value = 0.5;
    src.connect(lp); lp.connect(waveGain); waveGain.connect(out);
    const lfo = c.createOscillator(); lfo.frequency.value = 0.08;
    const lfoGain = c.createGain(); lfoGain.gain.value = 0.45;
    lfo.connect(lfoGain); lfoGain.connect(waveGain.gain);
    const foam = c.createBufferSource(); foam.buffer = this.makeNoise('white'); foam.loop = true;
    const foamHP = c.createBiquadFilter(); foamHP.type='highpass'; foamHP.frequency.value=2500;
    const foamGain = c.createGain(); foamGain.gain.value = 0.15;
    foam.connect(foamHP); foamHP.connect(foamGain); foamGain.connect(out);
    const lfo2 = c.createOscillator(); lfo2.frequency.value = 0.08;
    const lfoGain2 = c.createGain(); lfoGain2.gain.value = 0.13;
    lfo2.connect(lfoGain2); lfoGain2.connect(foamGain.gain);
    src.start(); lfo.start(); foam.start(); lfo2.start();
    return {out, nodes:[src, lfo, foam, lfo2]};
  },
  buildFire(){
    const c = this.ctx, out = c.createGain(); out.gain.value = 0;
    const src = c.createBufferSource(); src.buffer = this.makeNoise('brown'); src.loop = true;
    const lp = c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=400;
    const rumble = c.createGain(); rumble.gain.value = 0.55;
    src.connect(lp); lp.connect(rumble); rumble.connect(out); src.start();
    let nextCrackle = 0;
    const crackleTimer = setInterval(()=>{
      if (out.gain.value < 0.02) return;
      const now = Date.now();
      if (now < nextCrackle) return;
      nextCrackle = now + 40 + Math.random()*250;
      const isBig = Math.random() < 0.15;
      const count = isBig ? 3 + Math.floor(Math.random()*4) : 1;
      for (let i=0;i<count;i++){
        setTimeout(()=>{
          try{
            const o = c.createOscillator(), g = c.createGain();
            o.type = Math.random() < 0.7 ? 'square' : 'triangle';
            const freq = 1500 + Math.random()*4000;
            o.frequency.setValueAtTime(freq, c.currentTime);
            o.frequency.exponentialRampToValueAtTime(freq*0.4, c.currentTime+0.02);
            const amp = isBig ? (0.08 + Math.random()*0.12) : (0.03 + Math.random()*0.06);
            g.gain.setValueAtTime(0.0001, c.currentTime);
            g.gain.exponentialRampToValueAtTime(amp, c.currentTime+0.003);
            g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+0.04 + Math.random()*0.05);
            o.connect(g); g.connect(out); o.start(); o.stop(c.currentTime+0.1);
          }catch(e){}
        }, i * (10 + Math.random()*30));
      }
    }, 50);
    return {out, timers:[crackleTimer]};
  },
  buildCoffee(){
    const c = this.ctx, out = c.createGain(); out.gain.value = 0;
    const voice = c.createBufferSource(); voice.buffer = this.makeNoise('pink'); voice.loop = true;
    const vbp = c.createBiquadFilter(); vbp.type='bandpass'; vbp.frequency.value=500; vbp.Q.value=0.4;
    const vgain = c.createGain(); vgain.gain.value = 0.6;
    voice.connect(vbp); vbp.connect(vgain); vgain.connect(out); voice.start();
    const rumble = c.createBufferSource(); rumble.buffer = this.makeNoise('brown'); rumble.loop = true;
    const rlp = c.createBiquadFilter(); rlp.type='lowpass'; rlp.frequency.value=250;
    const rgain = c.createGain(); rgain.gain.value = 0.4;
    rumble.connect(rlp); rlp.connect(rgain); rgain.connect(out); rumble.start();
    const voiceLFO = c.createOscillator(); voiceLFO.frequency.value = 0.3;
    const voiceLFOGain = c.createGain(); voiceLFOGain.gain.value = 0.15;
    voiceLFO.connect(voiceLFOGain); voiceLFOGain.connect(vgain.gain); voiceLFO.start();
    const clinkTimer = setInterval(()=>{
      if (out.gain.value < 0.02) return;
      if (Math.random() > 0.35) return;
      const baseFreq = 2500 + Math.random()*3000;
      [1, 2.1, 3.4, 5.2].forEach((h, i)=>{
        try{
          const o = c.createOscillator(), g = c.createGain();
          o.type = 'sine'; o.frequency.value = baseFreq * h;
          const amp = 0.06 / (i + 1);
          g.gain.setValueAtTime(0.0001, c.currentTime);
          g.gain.exponentialRampToValueAtTime(amp, c.currentTime+0.005);
          g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.3 + Math.random()*0.5);
          o.connect(g); g.connect(out); o.start(); o.stop(c.currentTime+1.2);
        }catch(e){}
      });
    }, 3000);
    return {out, timers:[clinkTimer], nodes:[voice, rumble, voiceLFO]};
  },
  buildForest(){
    const c = this.ctx, out = c.createGain(); out.gain.value = 0;
    const leaves = c.createBufferSource(); leaves.buffer = this.makeNoise('pink'); leaves.loop = true;
    const lbp = c.createBiquadFilter(); lbp.type='bandpass'; lbp.frequency.value=4000; lbp.Q.value=0.3;
    const lgain = c.createGain(); lgain.gain.value = 0.5;
    leaves.connect(lbp); lbp.connect(lgain); lgain.connect(out); leaves.start();
    const leafLFO = c.createOscillator(); leafLFO.frequency.value = 0.4;
    const leafLFOGain = c.createGain(); leafLFOGain.gain.value = 0.2;
    leafLFO.connect(leafLFOGain); leafLFOGain.connect(lgain.gain); leafLFO.start();
    const birdTimer = setInterval(()=>{
      if (out.gain.value < 0.02) return;
      if (Math.random() > 0.5) return;
      const chirpCount = 1 + Math.floor(Math.random()*3);
      for (let i=0;i<chirpCount;i++){
        setTimeout(()=>{
          try{
            const o = c.createOscillator(), g = c.createGain();
            o.type = 'sine';
            const base = 2000 + Math.random()*2000;
            const now = c.currentTime;
            o.frequency.setValueAtTime(base, now);
            o.frequency.exponentialRampToValueAtTime(base * (1.5 + Math.random()*0.8), now+0.06);
            o.frequency.exponentialRampToValueAtTime(base * (0.8 + Math.random()*0.3), now+0.12);
            g.gain.setValueAtTime(0.0001, now);
            g.gain.exponentialRampToValueAtTime(0.06, now+0.005);
            g.gain.exponentialRampToValueAtTime(0.0001, now+0.15);
            o.connect(g); g.connect(out); o.start(now); o.stop(now+0.2);
          }catch(e){}
        }, i * (80 + Math.random()*100));
      }
    }, 2500);
    return {out, timers:[birdTimer], nodes:[leaves, leafLFO]};
  },
  buildChime(){
    const c = this.ctx, out = c.createGain(); out.gain.value = 0;
    const wind = c.createBufferSource(); wind.buffer = this.makeNoise('pink'); wind.loop = true;
    const wbp = c.createBiquadFilter(); wbp.type='bandpass'; wbp.frequency.value=800; wbp.Q.value=0.5;
    const wgain = c.createGain(); wgain.gain.value = 0.15;
    wind.connect(wbp); wbp.connect(wgain); wgain.connect(out); wind.start();
    const chimeTimer = setInterval(()=>{
      if (out.gain.value < 0.02) return;
      const baseFreq = 500 + Math.random()*500;
      [1, 2.76, 5.4, 8.9].forEach((p, i)=>{
        try{
          const o = c.createOscillator(), g = c.createGain();
          o.type = 'sine'; o.frequency.value = baseFreq * p;
          const amp = 0.1 / (i + 1);
          const dur = 3 + Math.random()*2;
          g.gain.setValueAtTime(0.0001, c.currentTime);
          g.gain.exponentialRampToValueAtTime(amp, c.currentTime+0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
          o.connect(g); g.connect(out); o.start(); o.stop(c.currentTime + dur + 0.5);
        }catch(e){}
      });
    }, 3500 + Math.random()*3000);
    return {out, timers:[chimeTimer], nodes:[wind]};
  },
  buildTrack(id){
    const builders = { rain: () => this.buildRain(), waves: () => this.buildWaves(), fire: () => this.buildFire(), coffee: () => this.buildCoffee(), forest: () => this.buildForest(), chime: () => this.buildChime() };
    const built = builders[id] ? builders[id]() : null;
    if (!built) return null;
    built.out.connect(this.master);
    return built;
  },
  start(id){
    if (!this.init()) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    if (!this.tracks[id]) this.tracks[id] = this.buildTrack(id);
    if (!this.tracks[id]) return;
    const t = this.tracks[id];
    const target = (state.detoxVolumes && state.detoxVolumes[id]) || 0;
    t.out.gain.cancelScheduledValues(this.ctx.currentTime);
    t.out.gain.setTargetAtTime(target * 0.8, this.ctx.currentTime, 0.15);
  },
  setVolume(id, v){
    if (!state.detoxVolumes) state.detoxVolumes = {};
    state.detoxVolumes[id] = v;
    if (v > 0 && !this.ctx) this.init();
    if (!this.ctx) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    if (v > 0 && !this.tracks[id]) this.tracks[id] = this.buildTrack(id);
    if (this.tracks[id]){
      const g = this.tracks[id].out.gain;
      g.cancelScheduledValues(this.ctx.currentTime);
      g.setTargetAtTime(v * 0.8, this.ctx.currentTime, 0.1);
    }
  },
  stopAll(){
    Object.keys(this.tracks).forEach(id=>{
      try{
        const t = this.tracks[id];
        if (t.out) t.out.gain.value = 0;
        if (t.nodes) t.nodes.forEach(n => { try{ n.stop(); }catch(e){} });
        if (t.timers) t.timers.forEach(tm => clearInterval(tm));
      }catch(e){}
    });
    this.tracks = {};
  }
};

function popSound(){
  try{
    if (!Ambience.ctx){ if (!Ambience.init()) return; }
    if (Ambience.ctx.state === 'suspended') Ambience.ctx.resume();
    const c = Ambience.ctx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(900 + Math.random()*300, t);
    o.frequency.exponentialRampToValueAtTime(160, t + 0.08);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.28, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.14);
    const o2 = c.createOscillator(), g2 = c.createGain();
    o2.type = 'triangle';
    o2.frequency.setValueAtTime(2200 + Math.random()*800, t);
    o2.frequency.exponentialRampToValueAtTime(800, t + 0.03);
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(0.08, t + 0.003);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o2.connect(g2); g2.connect(c.destination);
    o2.start(t); o2.stop(t + 0.06);
  }catch(e){}
}

const Bubbles = {
  canvas: null, ctx: null, raf: null, list: [], spawnTimer: null, running: false, W: 0, H: 0,
  init(canvasEl){
    if (this.running) return;
    this.canvas = canvasEl; this.ctx = canvasEl.getContext('2d');
    this.resize(); this.list = []; this.running = true; this.loop();
    this.spawnTimer = setInterval(()=>this.spawn(), 550);
    for (let i=0;i<6;i++) setTimeout(()=>this.spawn(), i*180);
    this._resizeHandler = () => this.resize();
    window.addEventListener('resize', this._resizeHandler);
  },
  resize(){
    if (!this.canvas) return;
    const r = this.canvas.getBoundingClientRect();
    if (r.width === 0) return;
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = r.width * dpr; this.canvas.height = r.height * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.W = r.width; this.H = r.height;
  },
  spawn(){
    if (!this.running || !this.W) return;
    if (this.list.length > 14) return;
    const r = 18 + Math.random()*26;
    this.list.push({ x: r + Math.random()*(this.W - r*2), y: this.H + r, r,
      vy: -(0.35 + Math.random()*0.5), vx: (Math.random()-0.5) * 0.3,
      wobble: Math.random()*Math.PI*2, wobbleAmp: 0.4 + Math.random()*0.6,
      hue: 20 + Math.random()*40, popped: 0 });
  },
  loop(){
    if (!this.running) return;
    this.raf = requestAnimationFrame(()=>this.loop());
    if (!this.ctx) return;
    this.ctx.clearRect(0, 0, this.W, this.H);
    for (let i=this.list.length-1;i>=0;i--){
      const b = this.list[i];
      if (b.popped > 0){
        b.popped += 0.08;
        if (b.popped >= 1){ this.list.splice(i, 1); continue; }
        const t = b.popped;
        this.ctx.globalAlpha = 1 - t;
        this.ctx.beginPath();
        this.ctx.arc(b.x, b.y, b.r * (1 + t*0.8), 0, Math.PI*2);
        this.ctx.strokeStyle = `hsla(${b.hue},80%,75%,1)`;
        this.ctx.lineWidth = 2*(1-t);
        this.ctx.stroke();
        this.ctx.globalAlpha = 1;
        continue;
      }
      b.y += b.vy; b.wobble += 0.02;
      b.x += b.vx + Math.sin(b.wobble) * b.wobbleAmp * 0.15;
      if (b.y + b.r < -20){ this.list.splice(i, 1); continue; }
      const grad = this.ctx.createRadialGradient(b.x - b.r*0.3, b.y - b.r*0.3, b.r*0.1, b.x, b.y, b.r);
      grad.addColorStop(0, `hsla(${b.hue},90%,85%,0.55)`);
      grad.addColorStop(0.7, `hsla(${b.hue},80%,65%,0.18)`);
      grad.addColorStop(1, `hsla(${b.hue},80%,55%,0.05)`);
      this.ctx.beginPath(); this.ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); this.ctx.fillStyle = grad; this.ctx.fill();
      this.ctx.beginPath(); this.ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); this.ctx.strokeStyle = `hsla(${b.hue},85%,75%,0.5)`; this.ctx.lineWidth = 1.2; this.ctx.stroke();
      this.ctx.beginPath(); this.ctx.arc(b.x - b.r*0.35, b.y - b.r*0.4, b.r*0.2, 0, Math.PI*2); this.ctx.fillStyle = 'rgba(255,255,255,0.5)'; this.ctx.fill();
    }
  },
  pop(x, y){
    for (let i=this.list.length-1;i>=0;i--){
      const b = this.list[i];
      if (b.popped > 0) continue;
      const dx = x - b.x, dy = y - b.y;
      if (dx*dx + dy*dy <= b.r*b.r){ b.popped = 0.01; popSound(); return true; }
    }
    return false;
  },
  destroy(){
    this.running = false;
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.spawnTimer) clearInterval(this.spawnTimer);
    if (this._resizeHandler) window.removeEventListener('resize', this._resizeHandler);
    this.list = []; this.canvas = null; this.ctx = null;
  }
};

let detoxState = { currentQuoteIdx: -1 };
function pickQuoteIdx(){
  if (DETOX_QUOTES.length <= 1) return 0;
  let i;
  do { i = Math.floor(Math.random() * DETOX_QUOTES.length); }
  while (i === detoxState.currentQuoteIdx);
  return i;
}

  <div class="card">${body}</div>`;
};

VIEWS.assess = function(){
  const t = todayISO();
  const sorted = [...state.assessments].sort((a, b) => {
    if (!a.due && !b.due) return 0;
    if (!a.due) return 1;
    if (!b.due) return -1;
    return a.due.localeCompare(b.due);
  });

  const cards = sorted.map(a => {
    const st = assessStatus(a);
    const p = a.progress || 0;
    const hasDue = !!a.due;
    const d = hasDue ? diffDays(t, a.due) : null;
    const cls = d === null ? '' : d <= 3 ? 'danger' : d <= 10 ? 'warn' : 'ok';
    const isExpanded = state.expandedAssessId === a.id;

    let relatedHTML = '';
    if (isExpanded){
      const rel = getAssessRelated(a.subject, a.criteria);
      const hasFb = rel.feedbacks.length > 0;
      const hasWb = rel.wrongs.length > 0;
      const hasAs = rel.assignments.length > 0;
      relatedHTML = `
        <div style="border-top:1px dashed var(--border);padding-top:12px;margin-top:6px;display:flex;flex-direction:column;gap:12px">
          ${hasFb ? `
            <div>
              <div class="sec-title" style="margin-bottom:6px">💬 該科反饋（同 Criterion）</div>
              ${rel.feedbacks.map(f => `
                <div class="item" data-act="jump-to-feedback" data-id="${f.id}" style="cursor:pointer;flex-direction:column;align-items:stretch;gap:5px;padding:9px 11px;background:var(--surface-2);border-radius:9px;margin-bottom:5px">
                  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                    <span style="font-size:12.5px;font-weight:650">${esc(f.name)}</span>
                    ${f.crit && f.crit!=='—' ? `<span class="pill muted" style="font-size:10px">Crit ${esc(f.crit)}</span>` : ''}
                    <span class="tiny muted" style="margin-left:auto;font-weight:700">點擊查看 →</span>
                  </div>
                  <div class="tiny muted" style="line-height:1.55;white-space:pre-wrap">${esc((f.text || '').split('\n').slice(0,3).join('\n') || 'N/A')}</div>
                </div>`).join('')}
            </div>` : ''}
          ${hasWb ? `
            <div>
              <div class="sec-title" style="margin-bottom:6px">📕 相關錯題</div>
              ${rel.wrongs.map(w => `
                <div style="padding:8px 10px;border-radius:9px;background:var(--surface-2);margin-bottom:5px;${w.mastered ? 'opacity:.6' : ''}">
                  <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap">
                    ${w.mastered ? '<span class="pill ok" style="font-size:10px">已掌握</span>' : '<span class="pill warn" style="font-size:10px">未掌握</span>'}
                    ${w.topic ? `<span class="tiny muted" style="font-weight:650">${esc(w.topic)}</span>` : ''}
                    <span class="tiny muted" style="margin-left:auto">${fmtMD(w.date)}</span>
                  </div>
                  <div style="font-size:12.5px;font-weight:600;margin-bottom:3px">${esc(w.question || '')}</div>
                  ${w.reason ? `<div class="tiny muted">❌ ${esc(w.reason)}</div>` : ''}
                </div>`).join('')}
            </div>` : ''}
          ${hasAs ? `
            <div>
              <div class="sec-title" style="margin-bottom:6px">✍️ 該科待辦作業</div>
              ${rel.assignments.map(asg => `
                <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:var(--surface-2);margin-bottom:4px;font-size:12px">
                  <span>${esc(asg.name)}</span>
                  ${asg.due ? `<span class="tiny muted" style="margin-left:auto">${fmtMD(asg.due)}</span>` : ''}
                </div>`).join('')}
            </div>` : ''}
          ${(!hasFb && !hasWb && !hasAs) ? '<div class="tiny muted" style="text-align:center;padding:8px">該科暫無相關紀錄</div>' : ''}
        </div>`;
    }

    return `<div class="card" style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
        <div style="min-width:0">
          <div style="font-size:14.5px;font-weight:750">${esc(a.name)}</div>
          <div class="item-meta" style="margin-top:5px">
            ${subjBadge(a.subject)}
            ${a.criteria && a.criteria !== '—' ? `<span class="pill muted">Crit ${esc(a.criteria)}</span>` : ''}
            <span>${hasDue ? fmtMD(a.due) : (a.dueNote || 'TBD')}</span>
          </div>
        </div>
        <div style="text-align:right;flex:0 0 auto">
          ${hasDue ? `<div style="font-size:24px;font-weight:850;line-height:1;letter-spacing:-1px;color:${d<=3?'var(--danger)':d<=10?'var(--warn)':'var(--ok)'}">${d < 0 ? '—' : d}</div>
            <div class="tiny muted" style="font-weight:750;letter-spacing:.5px">${d < 0 ? 'PAST' : 'DAYS'}</div>`
          : `<div style="font-size:18px">📌</div><div class="tiny muted" style="font-weight:700">TBD</div>`}
        </div>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:5px">
          <span class="muted">準備進度</span><span>${p}%</span>
        </div>
        <div class="bar"><div class="bar-fill ${cls}" style="width:${p}%"></div></div>
        <input type="range" min="0" max="100" step="5" value="${p}" data-act="assess-progress" data-id="${a.id}">
      </div>
      <div class="tiny muted" style="line-height:1.55">${esc(assessSuggest(a))}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="pill ${st.tone}">${st.label}</span>
        <div style="display:flex;gap:6px">
          <button class="btn btn-sm" data-act="assess-toggle-detail" data-id="${a.id}">
            ${isExpanded ? '▲ 收起' : '▼ 相關資料'}
          </button>
          <button class="icon-btn" data-act="assess-del" data-id="${a.id}">✕</button>
        </div>
      </div>
      ${relatedHTML}
    </div>`;
  }).join('');

  const body = sorted.length
    ? `<div class="grid g-2">${cards}</div>`
    : `<div class="card"><div class="empty"><b>尚無考試</b></div></div>`;

  const urgent = sorted.filter(a => a.due && diffDays(t, a.due) >= 0 && diffDays(t, a.due) <= 7).length;

  return `
  <div class="grid g-4" style="margin-bottom:14px">
    <div class="stat"><div class="stat-icon" style="background:rgba(91,94,240,.13)">📚</div>
      <div><div class="stat-val">${sorted.length}</div><div class="stat-lbl">總評估</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(225,29,72,.13)">🔔</div>
      <div><div class="stat-val">${urgent}</div><div class="stat-lbl">7 天內</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(16,185,129,.13)">✅</div>
      <div><div class="stat-val">${sorted.filter(a => (a.progress||0) >= 80).length}</div><div class="stat-lbl">準備充分</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(245,158,11,.14)">📝</div>
      <div><div class="stat-val">${sorted.filter(a => (a.progress||0) < 50).length}</div><div class="stat-lbl">進度落後</div></div></div>
  </div>

  <div class="card" style="margin-bottom:12px">
    <div class="card-head"><div class="card-title">➕ 新增評估</div></div>
    <div class="form-row">
      <input class="input" id="evName" placeholder="評估名稱" style="flex:1 1 220px">
      <select class="input" id="evSubj" style="flex:0 0 120px">${state.subjects.map(s => `<option>${esc(s)}</option>`).join('')}</select>
      <input class="input" id="evCrit" placeholder="評分準則 e.g. A, B, D" style="flex:0 0 160px">
      <input class="input" type="date" id="evDue" style="flex:0 0 150px">
      <button class="btn btn-primary" data-act="assess-add">＋ 新增</button>
    </div>
  </div>

  ${body}`;
};

VIEWS.feedback = function(){
  const grades = ['All', ...new Set(state.feedback.map(f => f.grade || '未分類'))];
  const subs = ['All', ...new Set(state.feedback.map(f => f.subject))];
  const gradeFilter = state.fbGradeFilter || 'All';
  const filter = state.fbFilter || 'All';

  const list = state.feedback.filter(f => {
    const g = f.grade || '未分類';
    return (gradeFilter === 'All' || g === gradeFilter) && (filter === 'All' || f.subject === filter);
  });

  const editingId = state.editingFbId;
  const isNew = state.fbAdding;

  const gradeChips = grades.map(g =>
    `<button class="chip ${g===gradeFilter?'active':''}" data-act="fb-grade-filter" data-grade="${esc(g)}">${g === 'All' ? '全部年級' : esc(g)}</button>`
  ).join('');

  const subjChips = subs.map(s =>
    `<button class="chip ${s===filter?'active':''}" data-act="fb-filter" data-subj="${esc(s)}">${s === 'All' ? '全部科目' : esc(s)}</button>`
  ).join('');

  const filterStat = (() => {
    if (filter === 'All') return '';
    const subjData = rcCalc().find(sd => sd.def.key === filter);
    if (!subjData) return '';
    const grade = subjData.grade;
    const cls = grade === null ? '' : grade >= 6 ? 'hi' : grade >= 4 ? 'mid' : 'lo';
    return `
      <div style="margin-top:10px;padding:10px 12px;background:var(--surface-2);border-radius:9px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div>
          <div class="tiny muted" style="font-weight:700">${esc(filter)} 目前等級</div>
          <div style="display:flex;align-items:baseline;gap:8px;margin-top:3px">
            <span class="rc-grade ${cls}" style="display:inline-block;min-width:34px;padding:3px 0;font-size:14px">${grade ?? '—'}</span>
            <span class="tiny muted">總分 ${subjData.total} · ${subjData.count} 筆評估</span>
          </div>
        </div>
        <button class="btn btn-sm" data-act="jump-to-report" style="margin-left:auto">前往成績單 →</button>
      </div>`;
  })();

  const newForm = isNew ? `
    <div class="card" style="margin-bottom:12px;border-color:var(--primary)">
      <div class="card-head"><div class="card-title">➕ 新增反饋</div></div>
      <div class="form-row">
        <input class="input" id="fbNewName" placeholder="考試名稱" style="flex:1 1 220px">
        <select class="input" id="fbNewSubj" style="flex:0 0 130px">${state.subjects.map(s => `<option>${esc(s)}</option>`).join('')}</select>
        <input class="input" id="fbNewGrade" placeholder="年級" style="flex:0 0 130px">
        <input class="input" id="fbNewCrit" placeholder="評分準則" style="flex:0 0 200px">
      </div>
      <textarea class="input" id="fbNewText" placeholder="反饋內容（每行一項）" rows="5" style="margin-top:8px"></textarea>
      <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end">
        <button class="btn" data-act="fb-cancel">取消</button>
        <button class="btn btn-primary" data-act="fb-save-new">💾 儲存</button>
      </div>
    </div>` : '';

  const grouped = {};
  list.forEach(f => {
    const g = f.grade || '未分類';
    if (!grouped[g]) grouped[g] = [];
    grouped[g].push(f);
  });
  const groupNames = Object.keys(grouped).sort();

  const renderItem = (f) => {
    if (editingId === f.id){
      return `
        <div class="card" style="margin-bottom:10px;border-color:var(--primary)">
          <div class="form-row">
            <input class="input" id="fbEditName-${f.id}" value="${esc(f.name)}" style="flex:1 1 200px">
            <select class="input" id="fbEditSubj-${f.id}" style="flex:0 0 130px">${state.subjects.map(s => `<option ${s===f.subject?'selected':''}>${esc(s)}</option>`).join('')}</select>
            <input class="input" id="fbEditGrade-${f.id}" value="${esc(f.grade || '')}" style="flex:0 0 120px">
            <input class="input" id="fbEditCrit-${f.id}" value="${esc(f.crit)}" style="flex:0 0 150px">
          </div>
          <textarea class="input" id="fbEditText-${f.id}" rows="6" style="margin-top:8px">${esc(f.text)}</textarea>
          <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end">
            <button class="btn" data-act="fb-cancel">取消</button>
            <button class="btn btn-primary" data-act="fb-save" data-id="${f.id}">💾 儲存</button>
          </div>
        </div>`;
    }
    const txt = f.text && f.text.trim() && f.text.trim() !== 'N/A'
      ? `<ul class="fb-list">${f.text.split('\n').map(l => l.trim()).filter(Boolean).map(l => `<li>${esc(l.replace(/^-\s*/, ''))}</li>`).join('')}</ul>`
      : `<p class="muted tiny">N/A — 暫無反饋</p>`;
    const isHl = state.highlightFeedbackId === f.id;
    return `<details class="acc" data-fb-id="${f.id}" ${isHl ? 'open' : ''} style="${isHl ? 'border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent)' : ''}">
      <summary>
        ${subjBadge(f.subject)}
        <span>${esc(f.name)}</span>
        <span class="pill muted" style="margin-left:auto;margin-right:6px">Crit ${esc(f.crit)}</span>
      </summary>
      <div class="acc-body">
        ${txt}
        <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end">
          <button class="btn btn-sm" data-act="fb-edit" data-id="${f.id}">✏️ 編輯</button>
          <button class="btn btn-sm btn-danger" data-act="fb-del" data-id="${f.id}">🗑 刪除</button>
        </div>
      </div>
    </details>`;
  };

  const groupedHTML = groupNames.length
    ? groupNames.map(g => `
      <div style="margin-bottom:18px">
        <div class="sec-title" style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span style="font-size:13px">🎓 ${esc(g)}</span>
          <span class="tiny muted" style="font-weight:600">${grouped[g].length} 筆</span>
        </div>
        ${grouped[g].map(renderItem).join('')}
      </div>`).join('')
    : `<div class="empty"><b>沒有符合的反饋</b></div>`;

  return `
  <div class="card" style="margin-bottom:12px">
    <div class="card-head">
      <div class="card-title">💬 考試反饋</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="tiny muted">${list.length} 筆</span>
        <button class="btn btn-primary btn-sm" data-act="fb-add">＋ 新增反饋</button>
      </div>
    </div>
    <div style="margin-bottom:9px">
      <div class="tiny muted" style="font-weight:700;margin-bottom:6px">年級</div>
      <div class="chip-row">${gradeChips}</div>
    </div>
    <div>
      <div class="tiny muted" style="font-weight:700;margin-bottom:6px">科目</div>
      <div class="chip-row">${subjChips}</div>
    </div>
    ${filterStat}
  </div>
  ${newForm}
  <div>${groupedHTML}</div>`;
};

VIEWS.wrongbook = function(){
  const t = todayISO();
  const all = state.wrongBook || [];
  const subjectFilter = state.wbSubjectFilter || 'All';
  const statusFilter = state.wbStatusFilter || 'All';
  const isAdding = state.wbAdding;
  const expandedId = state.wbExpandedId;

  const subjects = ['All', ...new Set(all.map(w => w.subject))];
  const filtered = all.filter(w => {
    if (subjectFilter !== 'All' && w.subject !== subjectFilter) return false;
    if (statusFilter === 'mastered' && !w.mastered) return false;
    if (statusFilter === 'unmastered' && w.mastered) return false;
    return true;
  }).sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  const total = all.length;
  const mastered = all.filter(w => w.mastered).length;
  const unmastered = total - mastered;
  const oldUnmastered = all.filter(w => !w.mastered && diffDays(w.date, t) >= 7).length;

  const subjChips = subjects.map(s => {
    const n = s === 'All' ? total : all.filter(w => w.subject === s).length;
    return `<button class="chip ${s===subjectFilter?'active':''}" data-act="wb-filter-subj" data-subj="${esc(s)}">${s === 'All' ? '全部' : esc(s)} <span style="opacity:.65">(${n})</span></button>`;
  }).join('');

  const statusChips = [
    {id:'All', label:`全部 (${total})`},
    {id:'unmastered', label:`未掌握 (${unmastered})`},
    {id:'mastered', label:`已掌握 (${mastered})`}
  ].map(s => `<button class="chip ${s.id===statusFilter?'active':''}" data-act="wb-filter-status" data-status="${s.id}">${s.label}</button>`).join('');

VIEWS.report = function(){
  const grades = state.reportGrades || [];
  const gradeRows = grades.length ? grades.map(g => {
    const def = RC_SUBJECTS.find(s => s.key === g.subject) || RC_SUBJECTS[0];
    const maxScore = (def.key === 'Biotech') ? 10 : 8;
    const cells = [...Array(5)].map((_, i) => {
      const active = i < def.crit.length;
      const raw = (g.scores || [])[i];
      const v = (raw === null || raw === undefined || raw === '') ? '' : raw;
      return `<input class="input rcg-num" type="number" inputmode="numeric" min="0" max="${maxScore}" step="1" value="${v}" ${active ? '' : 'disabled'} data-act="rcg-score" data-id="${g.id}" data-idx="${i}" placeholder="–">`;
    }).join('');
    return `<div class="rcg-row">
      <input class="input" value="${esc(g.name)}" placeholder="評估名稱" data-act="rcg-name" data-id="${g.id}">
      <select class="input" data-act="rcg-subject" data-id="${g.id}">${RC_SUBJECTS.map(s => `<option value="${s.key}" ${s.key === g.subject ? 'selected' : ''}>${s.key}</option>`).join('')}</select>
      ${cells}
      <button class="icon-btn" data-act="rcg-del" data-id="${g.id}">✕</button>

  const gradeTable = grades.length ? `

  return `

  <div class="card" style="margin-bottom:12px">
    <div class="card-head">
