<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>學習總覽 · Studying Overview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f5fa;
  --glow1:#e6ebff; --glow2:#ffe8f2;
  --surface:#ffffff;
  --surface-2:#f6f7fc;
  --surface-3:#eef0f8;
  --text:#141728;
  --muted:#6b7280;
  --border:#e6e8f2;
  --primary:#5b5ef0;
  --primary-2:#8b5cf6;
  --ok:#10b981; --warn:#f59e0b; --danger:#ef4444; --info:#3b82f6; --urgent:#e11d48;
  --r:16px; --r-sm:10px;
  --shadow:0 1px 2px rgba(20,23,40,.04), 0 14px 30px -22px rgba(20,23,40,.5);
}
[data-theme="dark"]{
  --bg:#0d0f16;
  --glow1:#1a1d33; --glow2:#251a2b;
  --surface:#161923;
  --surface-2:#1d2130;
  --surface-3:#242938;
  --text:#e9ebf5;
  --muted:#98a1b8;
  --border:#272c3c;
  --primary:#818cf8;
  --primary-2:#a78bfa;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 30px -22px rgba(0,0,0,.9);
}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  background:var(--bg);
  background-image:radial-gradient(1100px 600px at 8% -8%, var(--glow1) 0%, transparent 58%),
                   radial-gradient(900px 520px at 102% 0%, var(--glow2) 0%, transparent 55%);
  background-attachment:fixed;
  color:var(--text);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--border);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;min-height:100vh}
.sidebar{
  width:246px;flex:0 0 246px;
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:6px;
  padding:22px 16px;
  background:color-mix(in srgb, var(--surface) 72%, transparent);
  backdrop-filter:blur(14px);
  border-right:1px solid var(--border);
  overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px 18px}
.brand-icon{
  width:40px;height:40px;flex:0 0 40px;border-radius:13px;
  display:grid;place-items:center;font-size:20px;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  box-shadow:0 10px 22px -12px var(--primary);
}
.brand h1{font-size:15px;font-weight:800;letter-spacing:.2px}
.brand p{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.4px}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 11px;border-radius:12px;border:1px solid transparent;
  background:transparent;cursor:pointer;text-align:left;
  color:var(--muted);font:inherit;transition:.16s ease;width:100%;
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;box-shadow:0 10px 22px -14px var(--primary);
}
.nav-icon{font-size:15px;line-height:1;width:18px;text-align:center}
.nav-text{display:flex;flex-direction:column;line-height:1.2}
.nav-text b{font-size:13px;font-weight:650}
.nav-text small{font-size:10px;opacity:.72;font-weight:500;letter-spacing:.2px}
.sidebar-foot{display:flex;gap:6px;padding-top:12px;border-top:1px solid var(--border)}
.sidebar-foot button{
  flex:1;padding:8px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);font:inherit;font-size:12px;
  cursor:pointer;transition:.15s;font-weight:600;
}
.sidebar-foot button:hover{background:var(--surface-2);color:var(--text)}

.main{flex:1;min-width:0;padding:22px 28px 70px;max-width:1460px;margin:0 auto;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.topbar h2{font-size:22px;font-weight:800;letter-spacing:-.3px}
.topbar .sub{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:1.2px;text-transform:uppercase}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.today-chip{
  display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;
  background:var(--surface);border:1px solid var(--border);font-size:12.5px;font-weight:650;
  box-shadow:var(--shadow);
}
.today-chip .dot{width:7px;height:7px;border-radius:99px;background:var(--ok);box-shadow:0 0 0 3px rgba(16,185,129,.2)}

.pomo{
  display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-radius:99px;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);
}
.pomo-mode{
  font-size:10.5px;font-weight:750;letter-spacing:.4px;color:var(--muted);
  cursor:pointer;user-select:none;padding:3px 7px;border-radius:99px;background:var(--surface-2);
  transition:.15s;
}
.pomo-mode:hover{color:var(--text)}
.pomo-time{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px;min-width:46px;text-align:center}
.icon-btn{
  width:28px;height:28px;border-radius:99px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);cursor:pointer;font-size:12px;
  display:grid;place-items:center;transition:.15s;line-height:1;
}
.icon-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.pomo.running .pomo-time{color:var(--primary)}

.grid{display:grid;gap:14px}
.g-2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g-4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.stack{display:flex;flex-direction:column;gap:14px}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:18px;box-shadow:var(--shadow);
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-title{font-size:14.5px;font-weight:750;display:flex;align-items:center;gap:8px}
.card-sub{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.6px;text-transform:uppercase}

.hero{
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap;
  padding:26px 28px;border-radius:20px;margin-bottom:16px;
  background:linear-gradient(120deg,var(--primary) 0%,var(--primary-2) 55%,#ec4899 130%);
  color:#fff;box-shadow:0 24px 50px -30px var(--primary);
}
.hero::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(500px 260px at 88% -20%, rgba(255,255,255,.28), transparent 70%);
  pointer-events:none;
}
.hero h3{font-size:23px;font-weight:800;letter-spacing:-.4px;margin-bottom:5px}
.hero p{font-size:13px;opacity:.9;font-weight:500;max-width:560px}
.hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.hero-chips span{
  font-size:11.5px;font-weight:650;padding:4px 11px;border-radius:99px;
  background:rgba(255,255,255,.19);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.22);
}
.ring-wrap{position:relative;width:104px;height:104px;flex:0 0 104px}
.ring{width:104px;height:104px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.24)}
.ring .fg{stroke:#fff;transition:stroke-dasharray .7s cubic-bezier(.4,0,.2,1)}
.ring-label{
  position:absolute;inset:0;display:grid;place-content:center;text-align:center;
}
.ring-label b{font-size:22px;font-weight:800;line-height:1}
.ring-label small{font-size:9.5px;opacity:.85;letter-spacing:.8px;font-weight:650;display:block;margin-top:3px}

.stat{
  display:flex;align-items:center;gap:13px;padding:15px 16px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);
  transition:.18s;
}
.stat:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--primary) 35%,var(--border))}
.stat-icon{
  width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;
  font-size:18px;background:var(--surface-2);
}
.stat-val{font-size:22px;font-weight:800;line-height:1.05;letter-spacing:-.5px}
.stat-lbl{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.2px}

.badge{
  display:inline-flex;align-items:center;padding:2.5px 9px;border-radius:99px;
  font-size:11px;font-weight:700;letter-spacing:.2px;white-space:nowrap;
}
.pill{
  display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;
  font-size:11px;font-weight:700;white-space:nowrap;line-height:1.5;
}
.pill.ok{background:rgba(16,185,129,.15);color:#0d9c6e}
.pill.warn{background:rgba(245,158,11,.16);color:#c47a06}
.pill.danger{background:rgba(239,68,68,.15);color:#dc2626}
.pill.urgent{background:rgba(225,29,72,.15);color:#e11d48}
.pill.info{background:rgba(59,130,246,.15);color:#2563eb}
.pill.muted{background:var(--surface-2);color:var(--muted)}

.list{display:flex;flex-direction:column;gap:2px}
.item{
  display:flex;align-items:flex-start;gap:11px;padding:10px 12px;border-radius:12px;
  transition:.15s;border:1px solid transparent;
}
.item:hover{background:var(--surface-2)}
.item + .item{border-top:1px solid var(--border)}
.item-main{flex:1;min-width:0}
.item-title{font-size:13.5px;font-weight:600;word-break:break-word}
.item-title.done{text-decoration:line-through;color:var(--muted);opacity:.72}
.item-meta{font-size:11.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:3px}
.item-actions{display:flex;gap:5px;opacity:0;transition:.15s}
.item:hover .item-actions{opacity:1}

.cb{
  width:20px;height:20px;flex:0 0 20px;border-radius:7px;border:2px solid var(--border);
  background:var(--surface);cursor:pointer;display:grid;place-items:center;
  transition:.16s;margin-top:1px;font-size:11px;color:transparent;line-height:1;
}
.cb:hover{border-color:var(--primary);transform:scale(1.06)}
.cb.on{background:linear-gradient(135deg,var(--primary),var(--primary-2));border-color:transparent;color:#fff}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 15px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font:inherit;font-size:13px;font-weight:650;
  cursor:pointer;transition:.16s;white-space:nowrap;
}
.btn:hover{background:var(--surface-2);transform:translateY(-1px)}
.btn-primary{
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;border-color:transparent;box-shadow:0 10px 22px -14px var(--primary);
}
.btn-primary:hover{filter:brightness(1.07);background:linear-gradient(135deg,var(--primary),var(--primary-2))}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--surface-2);color:var(--danger)}
.btn-danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--border))}
.btn-danger:hover{background:rgba(239,68,68,.1);color:var(--danger)}

.input{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:9px 12px;font:inherit;font-size:13px;color:var(--text);outline:none;
  transition:.15s;min-width:0;width:100%;
}
.input::placeholder{color:var(--muted);opacity:.75}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
select.input{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea.input{font-family:inherit;resize:vertical;line-height:1.55}
.form-row{display:flex;gap:8px;flex-wrap:wrap}
.form-row > *{flex:1 1 150px}
.form-row > .btn{flex:0 0 auto}

.bar{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden;width:100%}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--primary-2));transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar-fill.ok{background:linear-gradient(90deg,#10b981,#34d399)}
.bar-fill.warn{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.bar-fill.danger{background:linear-gradient(90deg,#ef4444,#f87171)}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;
  background:var(--surface-3);outline:none;cursor:pointer;margin-top:10px;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:99px;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  cursor:pointer;box-shadow:0 2px 8px -2px var(--primary);border:2px solid var(--surface);
}
input[type=range]::-moz-range-thumb{
  width:14px;height:14px;border-radius:99px;border:2px solid var(--surface);
  background:var(--primary);cursor:pointer;
}

.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day-chip{
  padding:11px 8px;border-radius:13px;border:1px solid var(--border);background:var(--surface);
  cursor:pointer;text-align:center;transition:.16s;position:relative;overflow:hidden;
}
.day-chip:hover{border-color:color-mix(in srgb,var(--primary) 45%,var(--border));transform:translateY(-2px)}
.day-chip.sel{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 16%,transparent)}
.day-chip.today::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--primary),var(--primary-2));
}
.day-chip .wd{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.day-chip .dd{font-size:16px;font-weight:800;margin:2px 0 6px;letter-spacing:-.3px}
.day-chip .mini{height:4px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.day-chip .mini i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-2));border-radius:99px;transition:width .4s}

.rev-row{display:flex;gap:6px;flex-wrap:wrap}
.rev-chip{
  display:flex;flex-direction:column;align-items:center;gap:1px;
  min-width:56px;padding:6px 9px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface-2);cursor:pointer;transition:.16s;
}
.rev-chip:hover{border-color:var(--primary);transform:translateY(-2px)}
.rev-chip .rl{font-size:9.5px;font-weight:750;color:var(--muted);letter-spacing:.3px}
.rev-chip .rd{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.rev-chip.on{background:rgba(16,185,129,.14);border-color:rgba(16,185,129,.45)}
.rev-chip.on .rd,.rev-chip.on .rl{color:#0d9c6e}
.rev-chip.due{background:rgba(225,29,72,.13);border-color:rgba(225,29,72,.4);animation:pulse 2s infinite}
.rev-chip.due .rd,.rev-chip.due .rl{color:#e11d48}
.rev-chip.late{background:rgba(245,158,11,.14);border-color:rgba(245,158,11,.4)}
.rev-chip.late .rd,.rev-chip.late .rl{color:#c47a06}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(225,29,72,.35)}50%{box-shadow:0 0 0 6px rgba(225,29,72,0)}}

.scroll-x{overflow-x:auto;margin:0 -6px;padding:0 6px}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:620px}
table.tbl th{
  text-align:left;font-size:10.5px;font-weight:750;color:var(--muted);
  letter-spacing:.7px;text-transform:uppercase;padding:0 12px 9px;white-space:nowrap;
}
table.tbl td{padding:11px 12px;border-top:1px solid var(--border);vertical-align:middle}
table.tbl tbody tr{transition:.14s}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl tbody tr:first-child td{border-top:1px solid var(--border)}
table.tbl input.cell-input{
  width:100%;border:1px solid transparent;background:transparent;
  padding:5px 7px;border-radius:7px;font:inherit;font-size:12.5px;color:inherit;outline:none;
  transition:.15s;
}
table.tbl input.cell-input:hover{background:var(--surface-2);border-color:var(--border)}
table.tbl input.cell-input:focus{background:var(--surface);border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}

.sched-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.period{
  padding:11px 12px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface-2);transition:.16s;
}
.period:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--primary) 40%,var(--border))}
.period .pn{font-size:10px;font-weight:750;color:var(--muted);letter-spacing:.7px;text-transform:uppercase;margin-bottom:4px}
.period .pc{font-size:12.5px;font-weight:650;line-height:1.35}
.period input{
  width:100%;border:1px solid var(--border);background:var(--surface);
  padding:6px 8px;border-radius:8px;font:inherit;font-size:12.5px;color:var(--text);outline:none;
  transition:.15s;margin-top:2px;
}
.period input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.day-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;flex-wrap:wrap}
.day-tab{
  padding:7px 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface);
  font-size:12.5px;font-weight:650;cursor:pointer;transition:.15s;color:var(--muted);white-space:nowrap;
}
.day-tab:hover{color:var(--text);border-color:var(--primary)}
.day-tab.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-color:transparent;box-shadow:0 8px 18px -12px var(--primary)}

details.acc{
  border:1px solid var(--border);border-radius:14px;background:var(--surface);
  overflow:hidden;transition:.16s;
}
details.acc + details.acc{margin-top:9px}
details.acc[open]{border-color:color-mix(in srgb,var(--primary) 30%,var(--border));box-shadow:var(--shadow)}
details.acc summary{
  padding:13px 16px;cursor:pointer;list-style:none;display:flex;align-items:center;
  gap:11px;font-size:13.5px;font-weight:650;transition:.15s;
}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{
  content:'＋';margin-left:auto;color:var(--muted);font-weight:600;font-size:15px;transition:.2s;
}
details.acc[open] summary::after{content:'－'}
details.acc summary:hover{background:var(--surface-2)}
.acc-body{padding:2px 16px 16px;font-size:13px;color:var(--text)}
.fb-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.fb-list li{
  padding-left:14px;position:relative;color:var(--muted);line-height:1.65;font-size:12.8px;
  white-space:pre-wrap;
}
.fb-list li::before{
  content:'';position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:99px;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
}
.fb-list li strong{color:var(--text)}

.chip-row{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:5px 12px;border-radius:99px;border:1px solid var(--border);background:var(--surface);
  font-size:12px;font-weight:600;cursor:pointer;transition:.15s;color:var(--muted);
}
.chip:hover{color:var(--text);border-color:var(--primary)}
.chip.active{background:var(--primary);color:#fff;border-color:transparent}

.subj-chip{
  display:inline-flex;align-items:center;gap:6px;padding:7px 10px 7px 13px;border-radius:99px;
  background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;font-weight:650;
  transition:.15s;
}
.subj-chip:hover{border-color:var(--primary)}
.subj-chip .dot{width:8px;height:8px;border-radius:99px}
.subj-chip button{
  width:20px;height:20px;border-radius:99px;border:none;background:transparent;
  color:var(--muted);cursor:pointer;font-size:11px;display:grid;place-items:center;
  transition:.15s;line-height:1;
}
.subj-chip button:hover{background:var(--surface-3);color:var(--text)}

.empty{
  padding:26px 16px;text-align:center;color:var(--muted);font-size:12.5px;
  border:1.5px dashed var(--border);border-radius:14px;line-height:1.7;
}

  if (!Array.isArray(merged.subjects) || !merged.subjects.length) merged.subjects = [...DEFAULT_SUBJECTS];
  if (!Array.isArray(merged.feedback)) merged.feedback = structuredClone(DEFAULT_FEEDBACK);
  if (!merged.schedule || typeof merged.schedule !== 'object') merged.schedule = structuredClone(DEFAULT_SCHEDULE);
  if (!Array.isArray(merged.reportGrades)) merged.reportGrades = [];
  if (!Array.isArray(merged.todos)) merged.todos = [];
  if (!Array.isArray(merged.srp)) merged.srp = [];
  if (!Array.isArray(merged.assignments)) merged.assignments = [];
  if (!Array.isArray(merged.assessments)) merged.assessments = [];
  if (typeof merged.updatedAt !== 'number') merged.updatedAt = 0;
  /* 舊資料自動補上 grade 欄位 */
  merged.feedback.forEach(f => { if (!f.grade) f.grade = 'Grade 8'; });
  return merged;
}

/* =====================================================================
   4. DERIVED HELPERS
   ===================================================================== */
const isFinished = a => /完成|已繳|finished|submitted/i.test(a.status || '');

function srpDates(item){
  return item.start ? REV_OFFSETS.map(o => addDays(item.start, o)) : [];
}
function srpDueOn(date){
  const out = [];
  state.srp.forEach(it => {
    const ds = srpDates(it);
    const done = it.done || [false,false,false,false];
    ds.forEach((d, i) => { if (d === date && !done[i]) out.push({item: it, idx: i}); });
  });
  return out;
}
function srpStatus(it){
  const ds = srpDates(it);
  if (!ds.length) return {label:'📋 待安排 To schedule', tone:'muted'};
  const done = it.done || [false,false,false,false];
  const t = todayISO();
  if (done.every(Boolean)) return {label:'✅ 已完成所有複習 All revisions done', tone:'ok'};
  const iToday = ds.findIndex((d,i) => !done[i] && d === t);
  if (iToday >= 0) return {label:`🔴 今日第 ${iToday+1} 次複習（第 ${REV_DAYNUM[iToday]} 天）`, tone:'urgent'};
  const iOver = ds.findIndex((d,i) => !done[i] && d < t);
  if (iOver >= 0) return {label:`⏰ 第 ${iOver+1} 次複習已逾期 Overdue`, tone:'danger'};
  const iNext = ds.findIndex((d,i) => !done[i]);
  return {label:`📅 等待第 ${iNext+1} 次複習（第 ${REV_DAYNUM[iNext]} 天）`, tone:'info'};
}
function assignStatus(a){
  if (isFinished(a)) return {label:'✅ 已完成 Done', tone:'ok'};
  if (!a.due) return {label:'📋 待安排 To schedule', tone:'muted'};
  const d = diffDays(todayISO(), a.due);
  if (d < 0)  return {label:'⚠️ 逾期 Overdue', tone:'danger'};
  if (d === 0) return {label:'⏰ 今天到期 Due today', tone:'urgent'};
  if (d <= 3) return {label:'🔔 即將到期 Due soon', tone:'warn'};
  return {label:'📋 進行中 In progress', tone:'info'};
}
function assessStatus(a){
  if (!a.due) return {label:'📋 日期待定 Date TBD', tone:'muted'};
  const d = diffDays(todayISO(), a.due);
  const p = a.progress || 0;
  if (d < 0) return {label:'⚠️ 已過期 Past due', tone:'danger'};
  if (d <= 3 && p < 80) return {label:'⚠️ 剩餘 3 天內但準備未達 80%，請緊急加強！', tone:'danger'};
  if (d <= 10 && p < 50) return {label:'🔔 剩餘 10 天，進度落後', tone:'warn'};
  if (p >= 80) return {label:'✅ 準備充分 Well prepared', tone:'ok'};
  if (p >= 50) return {label:'🔄 進行中 In progress', tone:'info'};
  return {label:'📝 未開始 Not started', tone:'muted'};
}
function assessSuggest(a){
  if (!a.due) return '📌 先確認評估日期，再納入 SRP 規劃。';
  const d = diffDays(todayISO(), a.due);
  if (d < 0) return '⚠️ 已過期，請立即與老師確認補交安排。';
  if (d <= 7) return `🔔 距離考試僅剩 ${d} 天，建議用考試倒數法密集複習！`;
  if (d <= 14) return '📌 考前兩週，可開始規劃此科知識點進入 SRP。';
  return '✅ 時間充裕，先建立知識點清單。';
}
function weekStats(startISO){
  const days = [...Array(7)].map((_, i) => addDays(startISO, i));
  const list = state.todos.filter(t => days.includes(t.date));
  const done = list.filter(t => t.done).length;
  return {total: list.length, done, pct: list.length ? Math.round(done/list.length*100) : 0, days};
}
function smartTips(){
  const t = todayISO(), tips = [];
  state.assessments.forEach(a => {
    if (!a.due) return;
    const d = diffDays(t, a.due);
    if (d >= 0 && d <= 7 && (a.progress||0) < 80)
      tips.push({tone:'danger', txt:`《${a.name}》剩 ${d} 天，準備進度 ${a.progress||0}% — 今天先攻克一個知識點。`});
  });
  const overdueA = state.assignments.filter(a => !isFinished(a) && a.due && diffDays(t, a.due) < 0);
  if (overdueA.length) tips.push({tone:'danger', txt:`有 ${overdueA.length} 項作業已逾期，先處理最舊的一項。`});
  const lateSRP = state.srp.filter(it => {
    const ds = srpDates(it), done = it.done || [];
    return ds.some((d, i) => !done[i] && d < t);
  });
  if (lateSRP.length) tips.push({tone:'warn', txt:`有 ${lateSRP.length} 個知識點複習逾期，趁空堂補上（間隔複習最忌斷線）。`});
  const dueToday = srpDueOn(t).length;
  if (dueToday) tips.push({tone:'info', txt:`今天有 ${dueToday} 個複習任務，每個只需 5–15 分鐘，先做最舊的。`});
  const soonA = state.assignments.filter(a => !isFinished(a) && a.due && diffDays(t, a.due) >= 0 && diffDays(t, a.due) <= 3);
  if (soonA.length) tips.push({tone:'warn', txt:`有 ${soonA.length} 項作業 3 天內到期，建議今天先完成一項。`});
  if (!tips.length) tips.push({tone:'ok', txt:'一切在軌道上 ✅ 保持節奏，睡前用費曼技巧回顧今天的一個重點。'});
  return tips.slice(0, 5);
}

const RC_SUBJECTS = [
  {key:'Chinese',    crit:['A','B','C','D'],         cuts:[28,24,19,15,10,6]},
  {key:'MfE',        crit:['A','B','C','D'],         cuts:[28,24,19,15,10,6]},
  {key:'English',    crit:['A','B','C','D'],         cuts:[28,24,19,15,10,6]},
  {key:'Math',       crit:['A','B','C','D'],         cuts:[28,24,19,15,10,6]},
  {key:'INS',        crit:['A','B','C','D'],         cuts:[28,24,19,15,10,6]},
  {key:'Sciences',   crit:['A','B','C','D'],         cuts:[28,24,19,15,10,6]},
  {key:'PHE',        crit:['A','B','C','D'],         cuts:[28,24,19,15,10,6]},
  {key:'Humanities', crit:['A','B','C','D'],         cuts:[28,24,19,15,10,6]},
  {key:'Biotech',    crit:['I','II','III','IV','V'], cuts:[35,30,24,19,13,8]}
];

function ibGradeFromTotal(total, cuts){
  for (let i = 0; i < cuts.length; i++) if (total >= cuts[i]) return 7 - i;
  return 1;
}

function rcCalc(){
  const grades = state.reportGrades || [];
  return RC_SUBJECTS.map(def => {
    const recs = grades.filter(r => r.subject === def.key);
    const avgs = def.crit.map((_, i) => {
      const vals = recs
        .map(r => (r.scores || [])[i])
        .filter(v => v !== null && v !== undefined && v !== '' && !isNaN(v))
        .map(Number);
      if (!vals.length) return null;
      return Math.floor(vals.reduce((a, b) => a + b, 0) / vals.length);
    });
    const filled = avgs.filter(v => v !== null);
    const total = filled.reduce((a, b) => a + b, 0);
    const complete = filled.length === def.crit.length;
    const grade = complete ? ibGradeFromTotal(total, def.cuts) : null;
    return { def, avgs, total, complete, grade, count: recs.length, filledCount: filled.length };
  });
}

function rcStatsHTML(){
  const subjData = rcCalc();
  let sumAll = 0, cntAll = 0;
  const graded = [];
  subjData.forEach(sd => {
    sd.avgs.forEach(v => { if (v !== null){ sumAll += v; cntAll++; } });
    if (sd.grade !== null) graded.push(sd.grade);
  });
  const avg = cntAll ? sumAll / cntAll : null;
  const oa  = graded.length ? graded.reduce((a, b) => a + b, 0) / graded.length : null;
  return `
    <div class="stat"><div class="stat-icon" style="background:rgba(91,94,240,.14)">📊</div>
      <div><div class="stat-val">${graded.length}/9</div><div class="stat-lbl">已評科目 Subjects graded</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(16,185,129,.14)">🏆</div>
      <div><div class="stat-val">${oa !== null ? oa.toFixed(2) : '—'}</div><div class="stat-lbl">Total OA（科目等級平均）</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(139,92,246,.14)">📐</div>
      <div><div class="stat-val">${avg !== null ? avg.toFixed(2) : '—'}</div><div class="stat-lbl">標準平均分 (0–8)</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(245,158,11,.16)">Σ</div>
      <div><div class="stat-val">${sumAll}</div><div class="stat-lbl">總分（已填 ${cntAll} 項）</div></div></div>
  `;
}

function rcSummaryHTML(){
  const subjData = rcCalc();
  const rows = subjData.map(sd => {
    const cells = [...Array(5)].map((_, i) => {
      if (i >= sd.def.crit.length) return `<td style="text-align:center" class="tiny muted">·</td>`;
      const v = sd.avgs[i];
      return `<td style="text-align:center;font-weight:750;font-size:14px;font-variant-numeric:tabular-nums">${
        v === null ? '<span class="muted" style="font-weight:400">–</span>' : v
      }</td>`;
    }).join('');
    const gc = sd.grade === null ? '' : sd.grade >= 6 ? 'hi' : sd.grade >= 4 ? 'mid' : 'lo';
    const hasAny = sd.filledCount > 0;
    return `<tr>
      <td><span style="display:flex;align-items:center;gap:8px">
        <span style="width:8px;height:8px;border-radius:99px;background:${subjColor(sd.def.key)};flex:0 0 8px"></span>

      }</td>
      <td style="text-align:center">
        <span class="rc-grade ${gc}" style="display:inline-block;min-width:36px;padding:3px 0;font-size:14px">${
          sd.grade ?? '—'
        }</span>
      </td>
      <td style="text-align:right" class="tiny muted">${sd.count ? sd.count + ' 筆' : '—'}</td>

    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

const CLOUD_CFG_KEY = 'nathan-cloud-cfg-v1';

const Cloud = {
  cfg: {
    provider: 'supabase',
    auto: true,
    intervalSec: 120,
    supabase: { url: '', anonKey: '', roomId: '' },
    jsonbin:  { masterKey: '', binId: '' },
    custom:   { url: '', token: '' }
  },
  timer: null,
  busy: false,
  lastSyncAt: 0,
  status: 'idle',
  message: '',

  load(){
    try{
      const raw = localStorage.getItem(CLOUD_CFG_KEY);
      if (raw) Object.assign(this.cfg, JSON.parse(raw));
    }catch(e){}
  },
  persist(){
    try{ localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(this.cfg)); }catch(e){}
  },
  get configured(){
    const c = this.cfg;
    if (c.provider === 'supabase') return !!(c.supabase.url && c.supabase.anonKey && c.supabase.roomId);
    if (c.provider === 'jsonbin')  return !!(c.jsonbin.binId && c.jsonbin.masterKey);
    if (c.provider === 'custom')   return !!c.custom.url;
    return false;
  },

  async pull(){
    const c = this.cfg;
    if (c.provider === 'supabase'){
      const base = c.supabase.url.replace(/\/+$/,'');
      const r = await fetch(
        `${base}/rest/v1/study_state?room=eq.${encodeURIComponent(c.supabase.roomId)}&select=data`,
        { headers: { apikey: c.supabase.anonKey, Authorization: `Bearer ${c.supabase.anonKey}` } }
      );
      if (!r.ok) throw new Error(`pull HTTP ${r.status}`);
      const rows = await r.json();
      return rows[0] ? rows[0].data : null;
    }
    if (c.provider === 'jsonbin'){
      const r = await fetch(`https://api.jsonbin.io/v3/b/${c.jsonbin.binId}/latest`, {
        headers: { 'X-Master-Key': c.jsonbin.masterKey, 'X-Bin-Meta': 'false' }
      });
      if (!r.ok) throw new Error(`pull HTTP ${r.status}`);
      return await r.json();
    }
    if (c.provider === 'custom'){
      const r = await fetch(c.custom.url, {
        headers: c.custom.token ? { Authorization: `Bearer ${c.custom.token}` } : {}
      });
      if (!r.ok) throw new Error(`pull HTTP ${r.status}`);
      return await r.json();
    }
    throw new Error('未設定同步 Not configured');
  },

  async push(data){
    const c = this.cfg;
    if (c.provider === 'supabase'){
      const base = c.supabase.url.replace(/\/+$/,'');
      const r = await fetch(`${base}/rest/v1/study_state`, {
        method: 'POST',
        headers: {
          apikey: c.supabase.anonKey,
          Authorization: `Bearer ${c.supabase.anonKey}`,
          'Content-Type': 'application/json',
          Prefer: 'resolution=merge-duplicates,return=minimal'
        },
        body: JSON.stringify([{ room: c.supabase.roomId, data, updated_at: new Date().toISOString() }])
      });
      if (!r.ok) throw new Error(`push HTTP ${r.status}`);
      return;
    }
    if (c.provider === 'jsonbin'){
      const r = await fetch(`https://api.jsonbin.io/v3/b/${c.jsonbin.binId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': c.jsonbin.masterKey },
        body: JSON.stringify(data)
      });
      if (!r.ok) throw new Error(`push HTTP ${r.status}`);
      return;
    }
    if (c.provider === 'custom'){
      const r = await fetch(c.custom.url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(c.custom.token ? { Authorization: `Bearer ${c.custom.token}` } : {})
        },
        body: JSON.stringify(data)
      });
      if (!r.ok) throw new Error(`push HTTP ${r.status}`);
      return;
    }
    throw new Error('未設定同步 Not configured');
  },

  async sync(silent){
    if (!this.configured || this.busy) return;
    this.busy = true;
    this.setStatus('syncing', '同步中…');
    try{
      const remote = await this.pull();
      const localTs  = state.updatedAt || 0;
      const remoteTs = (remote && remote.updatedAt) || 0;

      if (!remote){
        await this.push(state);
        this.setStatus('ok', '已上傳雲端');
      } else if (remoteTs > localTs){
        state = normalizeState(remote);
        state.editingFbId = null;
        state.fbAdding = false;
        state.editingSchedule = false;
        localStorage.setItem(LS_KEY, JSON.stringify(state));
        applyTheme();
        render();
        this.setStatus('ok', '已下載雲端更新');
        if (!silent) toast('⬇️ 已同步雲端最新資料');
      } else if (localTs > remoteTs){
        await this.push(state);
        this.setStatus('ok', '已上傳本地');
      } else {
        this.setStatus('ok', '已是最新');
      }
      this.lastSyncAt = Date.now();
    }catch(err){
      console.warn('sync error', err);
      this.setStatus('error', err.message || '同步失敗');
    }finally{
      this.busy = false;
      this.renderChip();
    }
  },

  async forcePush(){
    if (!this.configured) { toast('⚠️ 尚未設定同步'); return; }
    this.busy = true; this.setStatus('syncing', '上傳中…');
    try{
      state.updatedAt = Date.now();
      localStorage.setItem(LS_KEY, JSON.stringify(state));
      await this.push(state);
      this.setStatus('ok', '已上傳'); toast('⬆️ 已上傳本地資料');
    }catch(e){ this.setStatus('error', e.message); toast('⚠️ 上傳失敗'); }
    finally{ this.busy = false; this.renderChip(); }
  },
  async forcePull(){
    if (!this.configured) { toast('⚠️ 尚未設定同步'); return; }
    this.busy = true; this.setStatus('syncing', '下載中…');
    try{
      const remote = await this.pull();
      if (!remote){ this.setStatus('ok', '雲端無資料'); toast('雲端尚無資料'); return; }
      state = normalizeState(remote);
      state.editingFbId = null; state.fbAdding = false; state.editingSchedule = false;
      localStorage.setItem(LS_KEY, JSON.stringify(state));
      applyTheme(); render();
      this.setStatus('ok', '已下載'); toast('⬇️ 已下載雲端資料');
    }catch(e){ this.setStatus('error', e.message); toast('⚠️ 下載失敗'); }
    finally{ this.busy = false; this.renderChip(); }
  },

  setStatus(s, msg){
    this.status = s; this.message = msg || '';
    this.renderChip();
    const el = document.getElementById('cloudStatusText');
    if (el) el.textContent = msg || s;
  },

  renderChip(){
    const dot  = document.getElementById('syncDot');
    const text = document.getElementById('syncText');
    if (!dot || !text) return;
    if (!this.configured){
      dot.style.background = 'var(--muted)'; dot.style.boxShadow = 'none';
      text.textContent = '本機 Local';
      return;
    }
    const map = {
      idle:    ['var(--info)',   '待同步'],
      syncing: ['var(--warn)',   '同步中…'],
      ok:      ['var(--ok)',     '已同步'],
      error:   ['var(--danger)', '同步失敗']
    };
    const [color, label] = map[this.status] || map.idle;
    dot.style.background = color;
    dot.style.boxShadow = `0 0 0 3px color-mix(in srgb, ${color} 25%, transparent)`;
    text.textContent = label;
  },

  restartTimer(){
    clearInterval(this.timer);
    if (!this.cfg.auto || !this.configured) return;
    const sec = Math.max(30, this.cfg.intervalSec || 120);
    this.timer = setInterval(() => {
      if (document.visibilityState === 'visible') this.sync(true);
    }, sec * 1000);
  },

  async createJsonBin(){
    const key = this.cfg.jsonbin.masterKey;
    if (!key){ toast('⚠️ 請先填入 X-Master-Key'); return; }
    try{
      const r = await fetch('https://api.jsonbin.io/v3/b', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': key, 'X-Bin-Name': 'study-dashboard' },
        body: JSON.stringify(state)
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      const id = data?.metadata?.id;
      if (!id) throw new Error('no id');
      this.cfg.jsonbin.binId = id;
      this.persist();
      toast('✅ 已建立 Bin：' + id);
      render();
    }catch(e){
      toast('⚠️ 建立失敗：' + e.message);
    }
  }
};

  }).length;
  const upcomingAssess = state.assessments
    .filter(a => a.due && diffDays(t, a.due) >= 0)
    .sort((a,b) => a.due.localeCompare(b.due));
  const nearAssign = state.assignments
    .filter(a => a.due && !isFinished(a))
    .sort((a,b) => a.due.localeCompare(b.due));
  const ws = weekStats(weekStart(t));
  const totalToday = todayTasks.length + revToday.length;
  const pct = totalToday ? Math.round(doneToday / totalToday * 100) : (todayTasks.length === 0 && revToday.length === 0 ? 100 : 0);
  const circ = 2 * Math.PI * 16;

  const hero = `
  <div class="hero">
    <div>
      <h3>${greet}，Nathan 👋</h3>
      <p>${fmtLong(t)} · ${todayTasks.length ? `今日有 <b>${todayTasks.length}</b> 項待辦` : '今日暫無待辦'}${revToday.length ? `、<b>${revToday.length}</b> 個複習任務` : ''}。</p>
      <div class="hero-chips">
        <span>✅ 今日完成 ${doneToday}/${todayTasks.length || 0}</span>
        <span>⏰ 複習 ${revToday.length} 項</span>
        <span>📚 考試 ${upcomingAssess.length} 場</span>
      </div>
    </div>
    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 42 42">
        <circle class="bg" cx="21" cy="21" r="16"></circle>
        <circle class="fg" cx="21" cy="21" r="16"
          stroke-dasharray="${(pct/100*circ).toFixed(1)} ${circ.toFixed(1)}"></circle>
      </svg>
      <div class="ring-label"><b>${pct}%</b><small>TODAY</small></div>
    </div>
  </div>`;

  const stats = `
  <div class="grid g-4" style="margin-bottom:16px">
    <div class="stat"><div class="stat-icon" style="background:rgba(91,94,240,.14)">📝</div>
      <div><div class="stat-val">${doneToday}<span class="muted" style="font-size:15px">/${todayTasks.length}</span></div>
      <div class="stat-lbl">今日待辦 To-Do</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(225,29,72,.14)">⏰</div>
      <div><div class="stat-val" style="color:${revToday.length ? 'var(--urgent)' : 'inherit'}">${revToday.length}</div>
      <div class="stat-lbl">今日複習 Revisions</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(16,185,129,.14)">📚</div>
      <div><div class="stat-val">${upcomingAssess.length}</div>
      <div class="stat-lbl">待考評估 Assessments</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(245,158,11,.16)">⚠️</div>
      <div><div class="stat-val" style="color:${revLate ? 'var(--warn)' : 'inherit'}">${revLate}</div>
      <div class="stat-lbl">逾期複習 Overdue</div></div></div>
  </div>`;

  const revList = revToday.length
    ? `<div class="list">${revToday.map(({item, idx}) => `
        <div class="item">
          <button class="cb" data-act="srp-toggle" data-id="${item.id}" data-idx="${idx}" title="標記完成">✓</button>
          <div class="item-main">
            <div class="item-title">${esc(item.concept)}</div>
            <div class="item-meta">${subjBadge(item.subject)}
              <span>第 ${idx+1} 次複習 · 第 ${REV_DAYNUM[idx]} 天</span></div>
          </div>
          <span class="pill urgent">今日</span>
        </div>`).join('')}</div>`
    : `<div class="empty"><b>📖 無複習任務</b>No revision task today — 好好休息或預習新內容！</div>`;

  const todoList = todayTasks.length
    ? `<div class="list">${todayTasks.map(x => `
        <div class="item">
          <button class="cb ${x.done?'on':''}" data-act="todo-toggle" data-id="${x.id}">✓</button>
          <div class="item-main"><div class="item-title ${x.done?'done':''}">${esc(x.text)}</div></div>
        </div>`).join('')}</div>`
    : `<div class="empty"><b>✨ 今天沒有待辦</b>No tasks for today — 到「待辦事項」新增吧！</div>`;

  const assessList = upcomingAssess.length
    ? `<div class="list">${upcomingAssess.slice(0,5).map(a => {
        const d = diffDays(t, a.due);
        const p = a.progress || 0;
        const cls = d <= 3 ? 'danger' : d <= 10 ? 'warn' : 'ok';
        return `<div class="item" style="flex-direction:column;align-items:stretch;gap:8px">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
            <div class="item-main">
              <div class="item-title">${esc(a.name)}</div>
              <div class="item-meta">${subjBadge(a.subject)}
                <span>${fmtMD(a.due)}</span>${a.criteria && a.criteria!=='—' ? `<span>Crit ${esc(a.criteria)}</span>` : ''}</div>
            </div>
            <div style="text-align:right;flex:0 0 auto">
              <div style="font-size:20px;font-weight:800;line-height:1;color:${d<=3?'var(--danger)':d<=10?'var(--warn)':'var(--ok)'}">${d}</div>
              <div class="tiny muted" style="font-weight:700">天 LEFT</div>
            </div>
          </div>
          <div class="bar"><div class="bar-fill ${cls}" style="width:${p}%"></div></div>
        </div>`;
      }).join('')}</div>`
    : `<div class="empty"><b>🎉 暫無近期考試</b>No upcoming assessments</div>`;

  const assignList = nearAssign.length
    ? `<div class="list">${nearAssign.slice(0,5).map(a => {
        const st = assignStatus(a);
        const d = a.due ? diffDays(t, a.due) : null;
        return `<div class="item">
          <div class="item-main">
            <div class="item-title">${esc(a.name)}</div>
            <div class="item-meta">${subjBadge(a.subject)}
              <span>${a.due ? fmtMD(a.due) : '—'}</span>
              ${d !== null ? `<span>${d < 0 ? `逾期 ${-d} 天` : d === 0 ? '今天' : `剩 ${d} 天`}</span>` : ''}</div>
          </div>
          <span class="pill ${st.tone}">${st.label}</span>
        </div>`;
      }).join('')}</div>`
    : `<div class="empty"><b>✅ 沒有待辦作業</b>No pending assignments</div>`;

  const tips = smartTips().map(x => `
    <div class="item" style="border-left:3px solid var(--${x.tone==='ok'?'ok':x.tone==='warn'?'warn':x.tone==='info'?'info':'danger'})">
      <div class="item-main"><div class="item-title" style="font-weight:600;font-size:12.8px">${esc(x.txt)}</div></div>
    </div>`).join('');

  const weekBar = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px">
      <span class="tiny muted" style="font-weight:700">本週完成度 Weekly completion</span>
      <b style="font-size:14px">${ws.done}/${ws.total} · ${ws.pct}%</b>
    </div>
    <div class="bar"><div class="bar-fill ${ws.pct>=80?'ok':ws.pct>=50?'':'warn'}" style="width:${ws.pct}%"></div></div>`;

  return `
  ${hero}
  ${stats}
  <div class="grid g-2">
    <div class="stack">
      <div class="card">
        <div class="card-head"><div class="card-title">⏰ 今日複習任務 <span class="muted" style="font-weight:500;font-size:12px">Today's Revisions</span></div>
          <button class="btn btn-sm" data-nav="srp">全部 →</button></div>
        ${revList}
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">📝 今日待辦 <span class="muted" style="font-weight:500;font-size:12px">Today's To-Do</span></div>
          <button class="btn btn-sm" data-nav="todo">全部 →</button></div>
        ${todoList}
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">📊 本週概況 <span class="muted" style="font-weight:500;font-size:12px">Weekly Overview</span></div></div>
        ${weekBar}
      </div>
    </div>
    <div class="stack">
      <div class="card">
        <div class="card-head"><div class="card-title">📚 即將到來的考試 <span class="muted" style="font-weight:500;font-size:12px">Upcoming Assessments</span></div>
          <button class="btn btn-sm" data-nav="assess">全部 →</button></div>
        ${assessList}
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">✍️ 作業追蹤 <span class="muted" style="font-weight:500;font-size:12px">Assignments</span></div>
          <button class="btn btn-sm" data-nav="assign">全部 →</button></div>
        ${assignList}
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">💡 智慧提醒 <span class="muted" style="font-weight:500;font-size:12px">Smart Tips</span></div></div>
        <div class="list">${tips}</div>
      </div>
    </div>
  </div>`;
};

/* ---------- TO-DO ---------- */
VIEWS.todo = function(){
  const t = todayISO();
  const anchor = state.weekAnchor || t;
  const start = weekStart(anchor);
  const days = [...Array(7)].map((_, i) => addDays(start, i));
  const sel = state.selDate || t;
  const selTasks = state.todos.filter(x => x.date === sel);

  const dayChips = days.map(d => {
    const list = state.todos.filter(x => x.date === d);
    const done = list.filter(x => x.done).length;
    const pct = list.length ? Math.round(done/list.length*100) : 0;
    const dt = parseISO(d);
    return `<div class="day-chip ${d===sel?'sel':''} ${d===t?'today':''}" data-act="pick-day" data-date="${d}">
      <div class="wd">週${WD[dt.getDay()]}</div>
      <div class="dd">${dt.getDate()}</div>
      <div class="mini"><i style="width:${pct}%"></i></div>
    </div>`;
  }).join('');

  const ws = weekStats(start);

  const taskList = selTasks.length
    ? `<div class="list">${selTasks.map(x => `
        <div class="item">
          <button class="cb ${x.done?'on':''}" data-act="todo-toggle" data-id="${x.id}">✓</button>
          <div class="item-main"><div class="item-title ${x.done?'done':''}">${esc(x.text)}</div></div>
          <div class="item-actions">
            <button class="icon-btn" data-act="todo-del" data-id="${x.id}" title="刪除">✕</button>
          </div>
        </div>`).join('')}</div>`
    : `<div class="empty"><b>尚無待辦 No tasks yet</b>在下方輸入框新增今天要做的事吧！</div>`;

  const doneCount = selTasks.filter(x => x.done).length;
  const pct = selTasks.length ? Math.round(doneCount/selTasks.length*100) : 0;

  return `
  <div class="card" style="margin-bottom:14px">
    <div class="card-head">
      <div class="card-title">📅 一週待辦 1-Week To-Do List</div>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="icon-btn" data-act="week-shift" data-delta="-7" title="上一週">‹</button>
        <button class="btn btn-sm" data-act="week-shift" data-delta="0">本週 This week</button>
        <button class="icon-btn" data-act="week-shift" data-delta="7" title="下一週">›</button>
      </div>
    </div>
    <div class="week-strip">${dayChips}</div>
    <div style="margin-top:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span class="tiny muted" style="font-weight:700">本週整體完成度 Weekly completion</span>
      <b style="font-size:13px">${ws.done}/${ws.total} · ${ws.pct}%</b>
    </div>
    <div class="bar"><div class="bar-fill ${ws.pct>=80?'ok':ws.pct>=50?'':'warn'}" style="width:${ws.pct}%"></div></div>
  </div>

  <div class="card">
    <div class="card-head">
      <div>
        <div class="card-title">${fmtLong(sel)} ${sel===t?'<span class="pill info" style="margin-left:6px">今天 Today</span>':''}</div>
        <div class="tiny muted" style="margin-top:3px">${selTasks.length} 項任務 · 完成 ${doneCount} 項 · ${pct}%</div>
      </div>
    </div>
    ${taskList}
    <div class="form-row" style="margin-top:14px">
      <input class="input" id="newTodoInput" placeholder="新增任務… Add a task…" style="flex:1 1 260px">
      <button class="btn btn-primary" data-act="todo-add">＋ 新增 Add</button>
    </div>
  </div>`;
};

/* ---------- SRP ---------- */
VIEWS.srp = function(){
  const t = todayISO();
  const sorted = [...state.srp].sort((a, b) => {
    const da = srpDates(a)[0] || '9999';
    const db = srpDates(b)[0] || '9999';
    return da.localeCompare(db);
  });

  const rows = sorted.length ? sorted.map(it => {
    const ds = srpDates(it);
    const done = it.done || [false,false,false,false];
    const st = srpStatus(it);
    const chips = ds.length ? ds.map((d, i) => {
      const isDone = done[i];
      const isDue  = !isDone && d === t;
      const isLate = !isDone && d < t;
      const cls = isDone ? 'on' : isDue ? 'due' : isLate ? 'late' : '';
      return `<div class="rev-chip ${cls}" data-act="srp-toggle" data-id="${it.id}" data-idx="${i}" title="點擊切換完成狀態">
        <span class="rl">D${REV_DAYNUM[i]}</span>
        <span class="rd">${fmtMD(d)}</span>
      </div>`;
    }).join('') : '<span class="muted tiny">—</span>';

    return `<tr>
      <td>${subjBadge(it.subject)}</td>
      <td><div style="font-weight:600;max-width:280px">${esc(it.concept)}</div></td>
      <td><span class="tiny" style="font-weight:700">${it.start ? fmtMD(it.start) : '—'}</span></td>
      <td><div class="rev-row">${chips}</div></td>
      <td><span class="pill ${st.tone}">${st.label}</span></td>
      <td style="text-align:right"><button class="icon-btn" data-act="srp-del" data-id="${it.id}" title="刪除">✕</button></td>
    </tr>`;
  }).join('') : '';

  const body = sorted.length
    ? `<div class="scroll-x"><table class="tbl">
        <thead><tr>
          <th>科目 Subject</th><th>知識點 Concept</th><th>第 1 天 Day 1</th>
          <th>複習節點 Revision nodes（點擊切換）</th><th>狀態 Status</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`
    : `<div class="empty"><b>尚無知識點 No concepts yet</b>每學完一個新內容，就把它拆成小知識點加進來。</div>`;

  const dueToday = srpDueOn(t);

  return `
  <div class="grid g-4" style="margin-bottom:16px">
    <div class="stat"><div class="stat-icon" style="background:rgba(91,94,240,.14)">🧠</div>
      <div><div class="stat-val">${state.srp.length}</div><div class="stat-lbl">知識點 Concepts</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(225,29,72,.14)">🔴</div>
      <div><div class="stat-val">${dueToday.length}</div><div class="stat-lbl">今日複習 Due today</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(245,158,11,.16)">⏰</div>
      <div><div class="stat-val">${state.srp.filter(x => srpStatus(x).tone === 'danger').length}</div><div class="stat-lbl">逾期 Overdue</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(16,185,129,.14)">✅</div>
      <div><div class="stat-val">${state.srp.filter(x => srpStatus(x).tone === 'ok').length}</div><div class="stat-lbl">已完成 Completed</div></div></div>
  </div>

  <div class="card" style="margin-bottom:14px">
    <div class="card-head"><div class="card-title">➕ 新增知識點 <span class="muted" style="font-weight:500;font-size:12px">Add Concept</span></div></div>
    <div class="form-row">
      <select class="input" id="srpSubj" style="flex:0 0 130px">${state.subjects.map(s => `<option>${esc(s)}</option>`).join('')}</select>
      <input class="input" id="srpConcept" placeholder="知識點 Concept（越小越好）" style="flex:1 1 300px">
      <input class="input" type="date" id="srpStart" value="${t}" style="flex:0 0 160px">
      <button class="btn btn-primary" data-act="srp-add">＋ 新增</button>
    </div>
  </div>

  <div class="card">${body}</div>`;
};

/* ---------- ASSIGNMENTS ---------- */
VIEWS.assign = function(){
  const t = todayISO();
  const sorted = [...state.assignments].sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));
  const overdue = sorted.filter(a => !isFinished(a) && a.due && diffDays(t, a.due) < 0).length;
  const soon = sorted.filter(a => !isFinished(a) && a.due && diffDays(t, a.due) >= 0 && diffDays(t, a.due) <= 3).length;
  const finished = sorted.filter(isFinished).length;

  const rows = sorted.length ? sorted.map(a => {
    const st = assignStatus(a);
    const d = a.due ? diffDays(t, a.due) : null;
    const dTxt = d === null ? '—' : d < 0 ? `逾期 ${-d} 天` : d === 0 ? '今天 Today' : `${d} 天`;
    return `<tr>
      <td><div style="font-weight:650">${esc(a.name)}</div>${a.remarks ? `<div class="tiny muted">${esc(a.remarks)}</div>` : ''}</td>
      <td>${subjBadge(a.subject)}</td>
      <td><span class="tiny" style="font-weight:700">${a.due ? fmtMD(a.due) : '—'}</span></td>
      <td><span style="font-weight:800;color:${d!==null && d<0 ? 'var(--danger)' : d!==null && d<=3 ? 'var(--warn)' : 'inherit'}">${dTxt}</span></td>
      <td><span class="tiny muted">${esc(a.time || '—')}</span></td>
      <td><span class="pill ${st.tone}">${st.label}</span></td>
      <td style="text-align:right;white-space:nowrap">
        <button class="icon-btn" data-act="assign-cycle" data-id="${a.id}" title="切換狀態">↻</button>
        <button class="icon-btn" data-act="assign-del" data-id="${a.id}" title="刪除">✕</button>
      </td>
    </tr>`;
  }).join('') : '';

  const body = sorted.length
    ? `<div class="scroll-x"><table class="tbl">
        <thead><tr><th>名稱 Name</th><th>科目</th><th>到期日 Due</th><th>剩餘天數</th><th>所需時間</th><th>狀態 Status</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>`
    : `<div class="empty"><b>尚無作業 No assignments</b>在下方新增一項作業來追蹤吧。</div>`;

  return `
  <div class="grid g-4" style="margin-bottom:16px">
    <div class="stat"><div class="stat-icon" style="background:rgba(91,94,240,.14)">📋</div>
      <div><div class="stat-val">${sorted.length - finished}</div><div class="stat-lbl">進行中 In progress</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(245,158,11,.16)">🔔</div>
      <div><div class="stat-val">${soon}</div><div class="stat-lbl">3 天內到期 Due soon</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(239,68,68,.15)">⚠️</div>
      <div><div class="stat-val">${overdue}</div><div class="stat-lbl">逾期 Overdue</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(16,185,129,.14)">✅</div>
      <div><div class="stat-val">${finished}</div><div class="stat-lbl">已完成 Completed</div></div></div>
  </div>

  <div class="card" style="margin-bottom:14px">
    <div class="card-head"><div class="card-title">➕ 新增作業 <span class="muted" style="font-weight:500;font-size:12px">Add Assignment</span></div></div>
    <div class="form-row">
      <input class="input" id="asName" placeholder="作業名稱 Name" style="flex:1 1 220px">
      <select class="input" id="asSubj" style="flex:0 0 120px">${state.subjects.map(s => `<option>${esc(s)}</option>`).join('')}</select>
      <input class="input" type="date" id="asDue" style="flex:0 0 150px">
      <input class="input" id="asTime" placeholder="所需時間 e.g. 45 min" style="flex:0 0 150px">
      <button class="btn btn-primary" data-act="assign-add">＋ 新增</button>
    </div>
  </div>

  <div class="card">${body}</div>`;
};

/* ---------- ASSESSMENTS ---------- */
VIEWS.assess = function(){
  const t = todayISO();
  const sorted = [...state.assessments].sort((a, b) => {
    if (!a.due && !b.due) return 0;
    if (!a.due) return 1;
    if (!b.due) return -1;
    return a.due.localeCompare(b.due);
  });

  const cards = sorted.map(a => {
    const st = assessStatus(a);
    const p = a.progress || 0;
    const hasDue = !!a.due;
    const d = hasDue ? diffDays(t, a.due) : null;
    const cls = d === null ? '' : d <= 3 ? 'danger' : d <= 10 ? 'warn' : 'ok';
    return `<div class="card" style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
        <div style="min-width:0">
          <div style="font-size:15px;font-weight:750;letter-spacing:-.2px">${esc(a.name)}</div>
          <div class="item-meta" style="margin-top:6px">
            ${subjBadge(a.subject)}
            ${a.criteria && a.criteria !== '—' ? `<span class="pill muted">Crit ${esc(a.criteria)}</span>` : ''}
            <span>${hasDue ? fmtMD(a.due) : (a.dueNote || 'TBD')}</span>
          </div>
        </div>
        <div style="text-align:right;flex:0 0 auto">
          ${hasDue ? `<div style="font-size:26px;font-weight:850;line-height:1;letter-spacing:-1px;color:${d<=3?'var(--danger)':d<=10?'var(--warn)':'var(--ok)'}">${d < 0 ? '—' : d}</div>
            <div class="tiny muted" style="font-weight:750;letter-spacing:.5px">${d < 0 ? 'PAST' : 'DAYS LEFT'}</div>`
          : `<div style="font-size:20px">📌</div><div class="tiny muted" style="font-weight:700">TBD</div>`}
        </div>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;margin-bottom:6px">
          <span class="muted">準備進度 Prepare progress</span><span>${p}%</span>
        </div>
        <div class="bar"><div class="bar-fill ${cls}" style="width:${p}%"></div></div>
        <input type="range" min="0" max="100" step="5" value="${p}" data-act="assess-progress" data-id="${a.id}">
      </div>
      <div class="tiny muted" style="line-height:1.6">${esc(assessSuggest(a))}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="pill ${st.tone}">${st.label}</span>
        <button class="icon-btn" data-act="assess-del" data-id="${a.id}" title="刪除">✕</button>
      </div>
    </div>`;
  }).join('');

  const body = sorted.length
    ? `<div class="grid g-2">${cards}</div>`
    : `<div class="card"><div class="empty"><b>尚無考試 No assessments</b>新增一場考試，系統會自動倒數並給出複習建議。</div></div>`;

  const urgent = sorted.filter(a => a.due && diffDays(t, a.due) >= 0 && diffDays(t, a.due) <= 7).length;

  return `
  <div class="grid g-4" style="margin-bottom:16px">
    <div class="stat"><div class="stat-icon" style="background:rgba(91,94,240,.14)">📚</div>
      <div><div class="stat-val">${sorted.length}</div><div class="stat-lbl">總評估 Total</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(225,29,72,.14)">🔔</div>
      <div><div class="stat-val">${urgent}</div><div class="stat-lbl">7 天內 Within 7 days</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(16,185,129,.14)">✅</div>
      <div><div class="stat-val">${sorted.filter(a => (a.progress||0) >= 80).length}</div><div class="stat-lbl">準備充分 ≥80%</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(245,158,11,.16)">📝</div>
      <div><div class="stat-val">${sorted.filter(a => (a.progress||0) < 50).length}</div><div class="stat-lbl">進度落後 &lt;50%</div></div></div>
  </div>

  <div class="card" style="margin-bottom:14px">
    <div class="card-head"><div class="card-title">➕ 新增評估 <span class="muted" style="font-weight:500;font-size:12px">Add Assessment</span></div></div>
    <div class="form-row">
      <input class="input" id="evName" placeholder="評估名稱 Name" style="flex:1 1 220px">
      <select class="input" id="evSubj" style="flex:0 0 120px">${state.subjects.map(s => `<option>${esc(s)}</option>`).join('')}</select>
      <input class="input" id="evCrit" placeholder="評分準則 e.g. A, B, D" style="flex:0 0 160px">
      <input class="input" type="date" id="evDue" style="flex:0 0 150px">
      <button class="btn btn-primary" data-act="assess-add">＋ 新增</button>
    </div>
  </div>

  ${body}`;
};

/* ---------- FEEDBACK（含年級分類） ---------- */
VIEWS.feedback = function(){
  const grades = ['All', ...new Set(state.feedback.map(f => f.grade || '未分類'))];
  const subs = ['All', ...new Set(state.feedback.map(f => f.subject))];
  const gradeFilter = state.fbGradeFilter || 'All';
  const filter = state.fbFilter || 'All';

  const list = state.feedback.filter(f => {
    const g = f.grade || '未分類';
    return (gradeFilter === 'All' || g === gradeFilter) &&
           (filter === 'All' || f.subject === filter);
  });

  const editingId = state.editingFbId;
  const isNew = state.fbAdding;

  const gradeChips = grades.map(g =>
    `<button class="chip ${g===gradeFilter?'active':''}" data-act="fb-grade-filter" data-grade="${esc(g)}">${g === 'All' ? '全部年級 All' : esc(g)}</button>`
  ).join('');

  const subjChips = subs.map(s =>
    `<button class="chip ${s===filter?'active':''}" data-act="fb-filter" data-subj="${esc(s)}">${s === 'All' ? '全部科目 All' : esc(s)}</button>`
  ).join('');

  const newForm = isNew ? `
    <div class="card" style="margin-bottom:14px;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 15%,transparent)">
      <div class="card-head">
        <div class="card-title">➕ 新增反饋 <span class="muted" style="font-weight:500;font-size:12px">New Feedback</span></div>
      </div>
      <div class="form-row">
        <input class="input" id="fbNewName" placeholder="考試名稱 Name" style="flex:1 1 220px">
        <select class="input" id="fbNewSubj" style="flex:0 0 130px">${state.subjects.map(s => `<option>${esc(s)}</option>`).join('')}</select>
        <input class="input" id="fbNewGrade" placeholder="年級 e.g. Grade 9" style="flex:0 0 130px">
        <input class="input" id="fbNewCrit" placeholder="評分準則 e.g. A, B, D" style="flex:0 0 200px">
      </div>
      <textarea class="input" id="fbNewText" placeholder="反饋內容 Feedback（每行一項，可用 - 開頭）" rows="5" style="margin-top:8px"></textarea>
      <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end">
        <button class="btn" data-act="fb-cancel">取消 Cancel</button>
        <button class="btn btn-primary" data-act="fb-save-new">💾 儲存 Save</button>
      </div>
    </div>` : '';

  const grouped = {};
  list.forEach(f => {
    const g = f.grade || '未分類';
    if (!grouped[g]) grouped[g] = [];
    grouped[g].push(f);
  });
  const groupNames = Object.keys(grouped).sort();

  const renderItem = (f) => {
    if (editingId === f.id){
      return `
        <div class="card" style="margin-bottom:10px;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 15%,transparent)">
          <div class="form-row">
            <input class="input" id="fbEditName-${f.id}" value="${esc(f.name)}" placeholder="名稱 Name" style="flex:1 1 200px">
            <select class="input" id="fbEditSubj-${f.id}" style="flex:0 0 130px">${state.subjects.map(s => `<option ${s===f.subject?'selected':''}>${esc(s)}</option>`).join('')}</select>
            <input class="input" id="fbEditGrade-${f.id}" value="${esc(f.grade || '')}" placeholder="年級 Grade" style="flex:0 0 120px">
            <input class="input" id="fbEditCrit-${f.id}" value="${esc(f.crit)}" placeholder="Crit" style="flex:0 0 150px">
          </div>
          <textarea class="input" id="fbEditText-${f.id}" rows="6" style="margin-top:8px">${esc(f.text)}</textarea>
          <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end">
            <button class="btn" data-act="fb-cancel">取消 Cancel</button>
            <button class="btn btn-primary" data-act="fb-save" data-id="${f.id}">💾 儲存 Save</button>
          </div>
        </div>`;
    }
    const txt = f.text && f.text.trim() && f.text.trim() !== 'N/A'
      ? `<ul class="fb-list">${f.text.split('\n').map(l => l.trim()).filter(Boolean)
          .map(l => `<li>${esc(l.replace(/^-\s*/, ''))}</li>`).join('')}</ul>`
      : `<p class="muted tiny">N/A — 暫無反饋 No feedback recorded</p>`;
    return `<details class="acc">
      <summary>
        ${subjBadge(f.subject)}
        <span>${esc(f.name)}</span>
        <span class="pill muted" style="margin-left:auto;margin-right:6px">Crit ${esc(f.crit)}</span>
      </summary>
      <div class="acc-body">
        ${txt}
        <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
          <button class="btn btn-sm" data-act="fb-edit" data-id="${f.id}">✏️ 編輯 Edit</button>
          <button class="btn btn-sm btn-danger" data-act="fb-del" data-id="${f.id}">🗑 刪除 Delete</button>
        </div>
      </div>
    </details>`;
  };

  const groupedHTML = groupNames.length
    ? groupNames.map(g => `
      <div style="margin-bottom:20px">
        <div class="sec-title" style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <span style="font-size:14px">🎓 ${esc(g)}</span>
          <span class="tiny muted" style="font-weight:600">${grouped[g].length} 筆</span>
        </div>
        ${grouped[g].map(renderItem).join('')}
      </div>`).join('')
    : `<div class="empty"><b>沒有符合的反饋</b>No feedback matches this filter.</div>`;

  return `
  <div class="card" style="margin-bottom:14px">
    <div class="card-head">
      <div class="card-title">💬 考試反饋 Assessment Feedback</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="tiny muted">${list.length} 筆 records</span>
        <button class="btn btn-primary btn-sm" data-act="fb-add">＋ 新增反饋 Add</button>
      </div>
    </div>
    <div style="margin-bottom:10px">
      <div class="tiny muted" style="font-weight:700;letter-spacing:.5px;margin-bottom:6px">年級 GRADE</div>
      <div class="chip-row">${gradeChips}</div>
    </div>
    <div>
      <div class="tiny muted" style="font-weight:700;letter-spacing:.5px;margin-bottom:6px">科目 SUBJECT</div>
      <div class="chip-row">${subjChips}</div>
    </div>
  </div>
  ${newForm}
  <div>${groupedHTML}</div>`;
};

/* ---------- REPORT CARDS ---------- */
VIEWS.report = function(){
  const grades = state.reportGrades || [];
  const gradeRows = grades.length ? grades.map(g => {
    const def = RC_SUBJECTS.find(s => s.key === g.subject) || RC_SUBJECTS[0];
    const cells = [...Array(5)].map((_, i) => {
      const active = i < def.crit.length;
      const raw = (g.scores || [])[i];
      const v = (raw === null || raw === undefined || raw === '') ? '' : raw;
      return `<input class="input rcg-num" type="number" inputmode="numeric" min="0" max="8" step="1"
        value="${v}" ${active ? '' : 'disabled'}
        data-act="rcg-score" data-id="${g.id}" data-idx="${i}" placeholder="–">`;
    }).join('');
    return `<div class="rcg-row">
      <input class="input" value="${esc(g.name)}" placeholder="評估名稱 Name" data-act="rcg-name" data-id="${g.id}">
      <select class="input" data-act="rcg-subject" data-id="${g.id}">
        ${RC_SUBJECTS.map(s => `<option value="${s.key}" ${s.key === g.subject ? 'selected' : ''}>${s.key}</option>`).join('')}
      </select>
      ${cells}
      <button class="icon-btn" data-act="rcg-del" data-id="${g.id}" title="刪除 Delete">✕</button>

        <div style="text-align:center">C</div><div style="text-align:center">D</div>
        <div style="text-align:center">E</div><div></div>
      </div>
      ${gradeRows}
    </div></div>`
    : `<div class="empty"><b>尚無評估成績 No assessment grades</b>先在上方新增一筆評估，再逐格填入各 Criterion 的分數（0–8）。</div>`;

  const bounds5 = [[35,'7','卓越'],[30,'6','優秀'],[24,'5','良好'],[19,'4','滿意'],[13,'3','基本'],[8,'2','不足'],[0,'1','入門']];
  const boundBlock = (title, arr) => `
    <div>
      <div class="sec-title">${title}</div>
      ${arr.map(([min, g, lbl]) => `<div class="kv" style="padding:6px 0">
        <span style="display:flex;align-items:center;gap:9px">
          <b style="font-size:15px;color:var(--primary);min-width:14px">${g}</b>
          <span class="tiny muted" style="font-weight:600">${lbl}</span>
        </span>
        <span class="tiny muted">≥ ${min} 分</span>
      </div>`).join('')}
    </div>`;

  return `
  <div class="grid g-4" id="rcStats" style="margin-bottom:16px">${rcStatsHTML()}</div>

  <div class="card" style="margin-bottom:14px">
    <div class="card-head">
      <div class="card-title">📝 單次評估成績</div>
      <span class="tiny muted">每項 0–8 分</span>
    </div>
    <div class="form-row" style="margin-bottom:14px">
      <input class="input" id="rcgNewName" placeholder="評估名稱 e.g. Statistics" style="flex:1 1 240px">
      <select class="input" id="rcgNewSubj" style="flex:0 0 150px">
        ${RC_SUBJECTS.map(s => `<option value="${s.key}">${s.key}</option>`).join('')}
      </select>
      <button class="btn btn-primary" data-act="rcg-add">＋ 新增評估</button>
    </div>
    ${gradeTable}
  </div>

  <div class="card" style="margin-bottom:14px">
    <div class="card-head">
      <div class="card-title">💯 科目 Criterion 彙總</div>
      <span class="tiny muted">自動計算平均（向下取整）</span>
    </div>
    <div id="rcSummary">${rcSummaryHTML()}</div>
  </div>

  <div class="card">
    <div class="card-head"><div class="card-title">📏 MYP 等級換算表</div></div>
    <div class="grid g-2" style="gap:18px">
      ${boundBlock('4 Criterion（滿分 32）', bounds4)}

/* ---------- SCHEDULE ---------- */
VIEWS.schedule = function(){
  const d = state.schedDay || 1;
  const periods = (state.schedule[d] || ['','','','','']);
  const PERIOD_NAMES = ['Period 1','Period 2','Period 3','Period 4','Period 5'];
  const TIMES = ['08:15','09:15','10:25','11:25','13:30'];
  const edit = state.editingSchedule;

  const tabs = [...Array(10).keys()].map(i => {
    const n = i + 1;
    return `<button class="day-tab ${n===d?'active':''}" data-act="sched-day" data-day="${n}">Day ${n}</button>`;
  }).join('');

  const todayCards = periods.map((p, i) => {
    if (edit){
      return `<div class="period">
        <div class="pn">${PERIOD_NAMES[i]} · ${TIMES[i]}</div>
        <input data-act="sched-edit" data-day="${d}" data-period="${i}" value="${esc(p)}" placeholder="e.g. Chinese (B310)">
      </div>`;
    }
    const m = String(p||'').match(/^(.+?)\s*\((.+)\)$/);
    const name = m ? m[1] : p;
    const room = m ? m[2] : '';
    return `<div class="period">
      <div class="pn">${PERIOD_NAMES[i]} · ${TIMES[i]}</div>
      <div class="pc" style="color:${subjColor(name)}">${esc(name || '—')}</div>
      ${room && room !== '/' ? `<div class="tiny muted" style="margin-top:3px">📍 ${esc(room)}</div>` : ''}
    </div>`;
  }).join('');

  const tableRows = PERIOD_NAMES.map((pn, i) => `
    <tr>
      <td style="font-weight:750;white-space:nowrap">${pn}</td>
      ${[...Array(10).keys()].map(k => {
        const n = k + 1;
        const cell = (state.schedule[n] || [])[i] || '';
        const m = String(cell).match(/^(.+?)\s*\((.+)\)$/);
        const nm = m ? m[1] : cell;
        if (edit){
          return `<td><input class="cell-input" data-act="sched-edit" data-day="${n}" data-period="${i}" value="${esc(cell)}" placeholder="—" style="${n===d ? 'background:color-mix(in srgb,var(--primary) 8%,transparent)' : ''}"></td>`;
        }
        return `<td style="${n===d ? 'background:color-mix(in srgb,var(--primary) 8%,transparent)' : ''}">
          <span style="font-size:12.5px;font-weight:600;color:${cell ? subjColor(nm) : 'var(--muted)'}">${esc(nm || '—')}</span>
        </td>`;
      }).join('')}
    </tr>`).join('');

  return `
  <div class="card" style="margin-bottom:14px">
    <div class="card-head">
      <div class="card-title">📅 我的課表 <span class="muted" style="font-weight:500;font-size:12px">My Schedule</span></div>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="tiny muted">10 天循環</span>
        ${edit
          ? `<button class="btn btn-primary btn-sm" data-act="sched-done">✓ 完成編輯 Done</button>`
          : `<button class="btn btn-sm" data-act="sched-edit-toggle">✏️ 編輯課表 Edit</button>`}
      </div>
    </div>
    ${edit ? `<div class="tiny muted" style="margin-bottom:12px">💡 直接點擊欄位修改，格式建議 <b>科目 (教室)</b></div>` : ''}
    <div class="day-tabs">${tabs}</div>
  </div>

  <div class="card" style="margin-bottom:14px">
    <div class="card-head"><div class="card-title">🕐 Day ${d} 課堂</div></div>
    <div class="sched-grid">${todayCards}</div>
  </div>

  <div class="card">
    <div class="card-head"><div class="card-title">🗓️ 全循環總表</div></div>
    <div class="scroll-x">
      <table class="tbl" style="min-width:900px">
        <thead><tr><th>節次 Period</th>${[...Array(10).keys()].map(k => `<th style="text-align:center">D${k+1}</th>`).join('')}</tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>
  </div>`;
};

  const usage = {};

  state.srp.forEach(x => { if (usage[x.subject] !== undefined) usage[x.subject]++; });
  state.assignments.forEach(x => { if (usage[x.subject] !== undefined) usage[x.subject]++; });
  state.assessments.forEach(x => { if (usage[x.subject] !== undefined) usage[x.subject]++; });
  state.feedback.forEach(x => { if (usage[x.subject] !== undefined) usage[x.subject]++; });

  const cf = Cloud.cfg;
  const provider = cf.provider;
  const statusLabel = Cloud.configured
    ? (Cloud.status === 'ok' ? '✅ 已同步' : Cloud.status === 'error' ? '⚠️ ' + (Cloud.message||'同步失敗') : Cloud.status === 'syncing' ? '⏳ 同步中…' : '⏸ 待同步')
    : '未設定';

  const providerFields = (() => {
    if (provider === 'supabase') return `
      <div class="form-row">
        <input class="input" data-cloud="supabase.url" value="${esc(cf.supabase.url)}" placeholder="Supabase URL  e.g. https://xxxx.supabase.co" style="flex:1 1 320px">
        <input class="input" data-cloud="supabase.anonKey" value="${esc(cf.supabase.anonKey)}" placeholder="anon public key" style="flex:1 1 260px">
        <input class="input" data-cloud="supabase.roomId" value="${esc(cf.supabase.roomId)}" placeholder="房間 ID（自行亂打一串）" style="flex:1 1 220px">
      </div>
      <div class="tiny muted" style="margin-top:8px;line-height:1.7">
        ① 到 <b>supabase.com</b> 註冊 → New Project<br>
        ② SQL Editor 跑建立 study_state 表的 SQL<br>
        ③ Project Settings → API Keys 複製 URL 與 anon key<br>
        ④ 房間 ID 自己亂打一串，所有裝置填同一串
      </div>`;
    if (provider === 'jsonbin') return `
      <div class="form-row">
        <input class="input" data-cloud="jsonbin.masterKey" value="${esc(cf.jsonbin.masterKey)}" placeholder="X-Master-Key" style="flex:1 1 300px">
        <input class="input" data-cloud="jsonbin.binId" value="${esc(cf.jsonbin.binId)}" placeholder="Bin ID（留空 → 點右邊建立）" style="flex:1 1 260px">
        <button class="btn" data-act="cloud-create-bin">＋ 建立新 Bin</button>
      </div>`;
    return `
      <div class="form-row">
        <input class="input" data-cloud="custom.url" value="${esc(cf.custom.url)}" placeholder="GET / POST 端點 URL" style="flex:1 1 340px">
        <input class="input" data-cloud="custom.token" value="${esc(cf.custom.token)}" placeholder="Bearer token（可留空）" style="flex:1 1 240px">
      </div>`;
  })();

  const stat = `
  <div class="grid g-4" style="margin-bottom:16px">
    <div class="stat"><div class="stat-icon" style="background:rgba(91,94,240,.14)">🏷️</div>
      <div><div class="stat-val">${subs.length}</div><div class="stat-lbl">科目 Subjects</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(16,185,129,.14)">💬</div>
      <div><div class="stat-val">${state.feedback.length}</div><div class="stat-lbl">反饋 Feedback</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(245,158,11,.16)">📅</div>
      <div><div class="stat-val">${Object.keys(state.schedule).length}</div><div class="stat-lbl">課表天數 Days</div></div></div>
    <div class="stat"><div class="stat-icon" style="background:rgba(139,92,246,.14)">🧠</div>
      <div><div class="stat-val">${state.srp.length}</div><div class="stat-lbl">SRP 知識點</div></div></div>
  </div>`;

  return `
  ${stat}

  <div class="card" style="margin-bottom:14px;border-color:${Cloud.configured?'color-mix(in srgb,var(--ok) 35%,var(--border))':'var(--border)'}">
    <div class="card-head">
      <div class="card-title">☁️ 雲端同步 <span class="muted" style="font-weight:500;font-size:12px">Cloud Sync（無 Firebase）</span></div>
      <span class="pill ${Cloud.configured ? (Cloud.status==='error'?'danger':'ok') : 'muted'}">${Cloud.configured ? '已啟用' : '未設定'}</span>
    </div>
    <div class="form-row" style="margin-bottom:12px">
      <select class="input" id="cloudProvider" style="flex:0 0 200px">
        <option value="supabase" ${provider==='supabase'?'selected':''}>Supabase（推薦）</option>
        <option value="jsonbin"  ${provider==='jsonbin' ?'selected':''}>JSONBin.io（最快）</option>
        <option value="custom"   ${provider==='custom'  ?'selected':''}>自訂 API</option>
      </select>
      <label style="display:flex;align-items:center;gap:7px;flex:0 0 auto;font-size:12.5px;font-weight:600;cursor:pointer">
        <input type="checkbox" id="cloudAuto" ${cf.auto?'checked':''}> 自動同步
      </label>
      <input class="input" type="number" id="cloudInterval" value="${cf.intervalSec}" min="30" step="10" style="flex:0 0 110px" title="同步間隔（秒）">
      <span class="tiny muted" style="flex:0 0 auto;align-self:center">秒 / interval</span>
    </div>
    ${providerFields}
    <div class="form-row" style="margin-top:12px">
      <button class="btn btn-primary" data-act="cloud-save">💾 儲存並同步</button>
      <button class="btn" data-act="cloud-sync-now">🔄 立即同步</button>
      <button class="btn" data-act="cloud-push-now">⬆️ 上傳本地</button>
      <button class="btn" data-act="cloud-pull-now">⬇️ 下載雲端</button>
    </div>
    <div class="kv" style="margin-top:12px">
      <span>目前狀態 Status</span>
      <b id="cloudStatusText">${statusLabel}</b>
    </div>
    <div class="kv">
      <span>上次同步 Last sync</span>
      <b>${Cloud.lastSyncAt ? new Date(Cloud.lastSyncAt).toLocaleTimeString() : '—'}</b>
    </div>
    <div class="tiny muted" style="margin-top:10px;line-height:1.7">
      💡 同步策略：以「最後修改時間」為準。本機改動較新 → 上傳；雲端較新 → 下載覆蓋本機。
    </div>
  </div>

  <div class="card" style="margin-bottom:14px">
    <div class="card-head">
      <div class="card-title">🏷️ 科目管理</div>
      <span class="tiny muted">用於 SRP、作業、考試、反饋的下拉選單</span>
    </div>
    <div class="chip-row" style="margin-bottom:14px">${chips || '<span class="tiny muted">尚無科目</span>'}</div>
    <div class="form-row">
      <input class="input" id="subjNewInput" placeholder="新增科目名稱 e.g. Drama" style="flex:1 1 260px">
      <button class="btn btn-primary" data-act="subj-add">＋ 新增科目</button>
    </div>
  </div>

  <div class="card" style="margin-bottom:14px">
    <div class="card-head"><div class="card-title">📊 科目使用統計</div></div>
    <div style="display:flex;flex-direction:column;gap:7px">
      ${subs.map(s => {
        const u = usage[s] || 0;
        return `<div class="kv">
          <span style="display:flex;align-items:center;gap:8px">
            <span style="width:8px;height:8px;border-radius:99px;background:${subjColor(s)}"></span>
            <b>${esc(s)}</b>
          </span>
          <span class="tiny muted">${u} 筆紀錄</span>
        </div>`;
      }).join('')}
    </div>
  </div>

  <div class="card" style="margin-bottom:14px">
    <div class="card-head"><div class="card-title">💾 資料管理</div></div>
    <div class="form-row">
      <button class="btn" data-act="data-export">⬇️ 匯出 JSON Export</button>
      <button class="btn" data-act="data-import">⬆️ 匯入 JSON Import</button>
      <button class="btn btn-danger" data-act="data-reset">🗑 重設所有資料 Reset All</button>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><div class="card-title">ℹ️ 關於</div></div>
    <div class="kv"><span>版本 Version</span><b>1.4（年級分類）</b></div>
    <div class="kv"><span>適用 For</span><b>IB MYP Grade 9</b></div>
    <div class="kv"><span>儲存 Storage</span><b>Local + Cloud</b></div>
  </div>`;
};
